<title>Kibanja SmartCare</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky bar of six views; each view is one column that splits into a working pane and a side pane from 900px. */
:root {
  --bg: #F1F4EF;  --surface: #FFFFFF; --sunk: #E7ECE5; --ink: #13231A; --muted: #55665C; --line: #D3DCD2;
  --leaf: #1D5A3E; --leaf-soft: #DBEADF; --on-leaf: #FFFFFF;
  --sun: #C98A12; --sun-soft: #FAEDCF;
  --ok: #2A7748;  --ok-soft: #DCEFE2; --warn: #8F5D00; --warn-soft: #FAEAC6; --bad: #AE3520; --bad-soft: #F7DCD4;
  --bezel: #17221C;
  --card-a: #163F2B; --card-b: #2C7650; --card-ink: #F5F1E1; --card-sun: #F0BF4C;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1612; --surface: #16211B; --sunk: #1D2A23; --ink: #E4ECE6; --muted: #98AA9F; --line: #2B3A31;
  --leaf: #6CC795; --leaf-soft: #1E3628; --on-leaf: #0B1A12;
  --sun: #EDB848; --sun-soft: #3A2F14;
  --ok: #62C68E; --ok-soft: #173325; --warn: #E8B04C; --warn-soft: #382A10; --bad: #F07A60; --bad-soft: #3D1D16;
  --bezel: #040706; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E1612; --surface: #16211B; --sunk: #1D2A23; --ink: #E4ECE6; --muted: #98AA9F; --line: #2B3A31;
  --leaf: #6CC795; --leaf-soft: #1E3628; --on-leaf: #0B1A12;
  --sun: #EDB848; --sun-soft: #3A2F14;
  --ok: #62C68E; --ok-soft: #173325; --warn: #E8B04C; --warn-soft: #382A10; --bad: #F07A60; --bad-soft: #3D1D16;
  --bezel: #040706; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 700; }
h3 { font-size: 18px; font-weight: 700; }
h4 { font-size: 15px; font-weight: 700; font-family: var(--f-body); }
p { margin: 0; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
button, input, select, textarea { font: inherit; color: inherit; }
table { font: inherit; }
:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1200px; margin: 0 auto; padding-block: 10px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 19px; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(140deg, var(--card-a), var(--card-b)); position: relative; flex: none; }
.brand-mark::after { content: ""; position: absolute; left: 7px; top: 9px; width: 14px; height: 10px; border-radius: 3px; background: var(--card-sun); }
.brand small { font-family: var(--f-body); font-weight: 500; font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 10px 12px; font-size: 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--leaf); }
.tab:hover { color: var(--ink); }

main { max-width: 1200px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { display: grid; gap: 24px; }
.split { display: grid; gap: 24px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 900px) { .split { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } .split.phone-split { grid-template-columns: 400px minmax(0, 1fr); } }
.split > * { min-width: 0; }
.stack { display: grid; gap: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; }
.panel.flat { background: transparent; border: 0; padding: 0; }
.lede { font-size: 17px; max-width: 62ch; color: var(--muted); }

/* Buttons and pills */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--leaf); border-color: var(--leaf); color: var(--on-leaf); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; justify-content: center; padding-block: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.btn.chip { padding: 5px 10px; font-size: 12.5px; font-family: var(--f-mono); font-weight: 500; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; background: var(--sunk); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }

label.f { display: grid; gap: 5px; font-size: 13px; font-weight: 600; }
label.f span.hint { font-weight: 400; color: var(--muted); }
.in { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
textarea.in { min-height: 72px; resize: vertical; }

/* Overview */
.hero { display: grid; gap: 14px; padding-block: 8px 4px; }
.hero h1 em { font-style: normal; color: var(--leaf); }
.models { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.model-card { display: grid; gap: 12px; align-content: start; }
.terms { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; margin: 0; }
.terms dt { color: var(--muted); }
.terms dd { margin: 0; font-weight: 600; }
.modules { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.module { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 6px; align-content: start; background: var(--surface); cursor: pointer; text-align: left; }
.module:hover { border-color: var(--leaf); }
.module .go { color: var(--leaf); font-weight: 600; font-size: 13px; }
.journey { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: j; }
.journey li { counter-increment: j; display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding-block: 10px; border-top: 1px solid var(--line); }
.journey li::before { content: counter(j); font-family: var(--f-mono); font-size: 13px; width: 26px; height: 26px; border-radius: 50%; background: var(--leaf-soft); color: var(--leaf); display: grid; place-items: center; }
.callout { border-left: 3px solid var(--sun); background: var(--sun-soft); padding: 14px 16px; border-radius: 0 var(--r) var(--r) 0; display: grid; gap: 8px; }

/* Phone */
.phone { width: 100%; max-width: 400px; border: 10px solid var(--bezel); border-radius: 34px; background: var(--bg); overflow: hidden; margin-inline: auto; }
.screen { padding: 14px 14px 20px; display: grid; gap: 14px; min-height: 640px; align-content: start; }
.ph-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.hello { font-family: var(--f-display); font-size: 20px; font-weight: 700; }
.ph-block { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.big { font-family: var(--f-mono); font-size: 24px; font-weight: 500; letter-spacing: -0.02em; }
.ticks { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 14px; }
.ticks li::before { content: "✓"; color: var(--leaf); font-weight: 700; margin-right: 8px; }
.meter { height: 10px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--leaf); border-radius: inherit; }
.meter.sun > i { background: var(--sun); }
.ladder { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; align-items: end; height: 64px; }
.ladder i { display: block; border-radius: 4px 4px 0 0; background: var(--sunk); }
.ladder i.done { background: var(--leaf-soft); }
.ladder i.on { background: var(--leaf); }
.ladder-lbl { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); text-align: center; }
.due { border-radius: 10px; padding: 10px 12px; background: var(--sunk); display: grid; gap: 8px; }
.due.bad { background: var(--bad-soft); }
.txns { list-style: none; margin: 0; padding: 0; display: grid; }
.txns li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding-block: 9px; border-top: 1px solid var(--line); font-size: 13.5px; }
.txns li .amt { font-family: var(--f-mono); text-align: right; }
.txns li .sub { font-size: 12px; color: var(--muted); }

/* SmartCare card */
.kcard { position: relative; aspect-ratio: 1.586; max-width: 100%; border-radius: 14px; padding: 16px 18px; color: var(--card-ink); overflow: hidden;
  background: radial-gradient(120% 90% at 100% 0%, rgba(240,191,76,.28), transparent 55%), repeating-linear-gradient(118deg, rgba(255,255,255,.035) 0 14px, transparent 14px 30px), linear-gradient(150deg, var(--card-a), var(--card-b));
  display: grid; grid-template-rows: auto 1fr auto; box-shadow: 0 10px 24px -14px rgba(0,0,0,.55); }
.kcard .k-head { display: flex; justify-content: space-between; align-items: center; }
.kcard .k-name { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: .01em; }
.kcard .k-name b { color: var(--card-sun); }
.kcard .k-chip { width: 38px; height: 28px; border-radius: 6px; background: linear-gradient(135deg, var(--card-sun), #D49A26); align-self: center; }
.kcard .k-num { font-family: var(--f-mono); font-size: 18px; letter-spacing: .08em; }
.kcard .k-foot { display: flex; justify-content: space-between; align-items: end; gap: 8px; font-size: 12px; }
.kcard .k-foot .lbl { opacity: .7; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
.kcard .k-state { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: rgba(0,0,0,.28); }

/* Rules panel */
.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rules li { display: grid; gap: 2px; padding-left: 14px; border-left: 2px solid var(--line); }
.rules li b { font-weight: 600; }
.try { background: var(--leaf-soft); border-radius: var(--r); padding: 12px 14px; font-size: 14px; display: grid; gap: 6px; }

/* POS */
.cat { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.sku { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px; text-align: left; cursor: pointer; display: grid; gap: 4px; align-content: start; }
.sku:hover { border-color: var(--leaf); }
.sku .nm { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
.sku .pr { font-family: var(--f-mono); font-size: 13px; }
.tag { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--leaf); }
.tag.no { color: var(--muted); }
.cart { list-style: none; margin: 0; padding: 0; display: grid; }
.cart li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); font-size: 14px; }
.qty { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); }
.qty button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.tot { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; }
.tot .v { font-family: var(--f-mono); text-align: right; }
.tot .grand { font-weight: 700; font-size: 16px; border-top: 1px solid var(--line); padding-top: 8px; }
.member-strip { display: grid; gap: 8px; padding: 12px 14px; border-radius: var(--r); background: var(--sunk); }
.receipt { font-family: var(--f-mono); font-size: 12.5px; background: var(--surface); border: 1px dashed var(--muted); border-radius: 6px; padding: 14px; display: grid; gap: 4px; }
.receipt .r { display: flex; justify-content: space-between; gap: 10px; }
.receipt hr { border: 0; border-top: 1px dashed var(--line); width: 100%; margin: 4px 0; }

/* Ops */
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; }
.kpi .v { font-family: var(--f-mono); font-size: 22px; font-weight: 500; }
.queue { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.queue button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: grid; gap: 4px; }
.queue button[aria-current="true"] { border-color: var(--leaf); box-shadow: inset 3px 0 0 var(--leaf); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; }
.checks li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding-block: 9px; border-top: 1px solid var(--line); font-size: 14px; }
.ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.ic.ok { background: var(--ok-soft); color: var(--ok); }
.ic.todo { background: var(--warn-soft); color: var(--warn); }
.ic.bad { background: var(--bad-soft); color: var(--bad); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th, table.t td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--sunk); }
table.t td.n, table.t th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.strong td { font-weight: 700; }
table.t td.neg { color: var(--bad); }

/* Model */
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; }
legend { padding: 0; margin-bottom: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg label { padding: 8px 12px; font-size: 13.5px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.seg label:has(input:checked) { background: var(--leaf-soft); color: var(--leaf); font-weight: 600; }
.seg input { accent-color: var(--leaf); }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 120px 1fr 92px; gap: 10px; align-items: center; font-size: 13.5px; }
.bar .track { height: 14px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.bar .track i { display: block; height: 100%; border-radius: 4px; }
.bar .v { font-family: var(--f-mono); text-align: right; font-size: 13px; }
.grid-sens td.cell { text-align: right; font-family: var(--f-mono); }
.grid-sens td.pos { background: var(--ok-soft); color: var(--ok); }
.grid-sens td.neg { background: var(--bad-soft); color: var(--bad); }
.grid-sens td.here { outline: 2px solid var(--ink); outline-offset: -2px; font-weight: 700; }
.findings { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.findings li { display: grid; grid-template-columns: 8px 1fr; gap: 12px; }
.findings li::before { content: ""; border-radius: 4px; background: var(--sun); }
.findings li.bad::before { background: var(--bad); }
.findings li.ok::before { background: var(--ok); }
.findings b { display: block; margin-bottom: 2px; }

/* Rollout */
.phases { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.phase { display: grid; gap: 10px; align-content: start; }
.phase .when { font-family: var(--f-mono); font-size: 12.5px; color: var(--leaf); font-weight: 500; }
.phase ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.lic { list-style: none; margin: 0; padding: 0; display: grid; }
.lic li { border-top: 1px solid var(--line); padding-block: 10px; }
.lic label { display: grid; grid-template-columns: 22px 1fr; gap: 10px; cursor: pointer; }
.lic input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--leaf); }
.lic li:has(input:checked) b { text-decoration: line-through; color: var(--muted); }

/* Plans */
.plans { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.plan-tile { gap: 8px; align-content: start; }
.plans.tiers { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.paygrid { display: grid; grid-template-columns: auto auto 1fr; gap: 4px 12px; font-size: 13.5px; padding: 10px 12px; border-radius: 8px; background: var(--sunk); }
.paygrid .gets { color: var(--leaf); text-align: right; }
.plan-tile .per { font-size: 14px; color: var(--muted); }
.tag.offer { color: var(--sun); }
.cell-in { width: 120px; text-align: right; padding: 6px 8px; }
.per { font-size: 14px; color: var(--muted); font-family: var(--f-body); letter-spacing: 0; }
.paycode { font-family: var(--f-mono); font-size: 30px; letter-spacing: .14em; text-align: center; padding: 10px; border: 1px dashed var(--muted); border-radius: 10px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--leaf); }
.paid-by { display: grid; gap: 6px; padding: 12px; border-radius: 8px; background: var(--sunk); }

/* How it works and loans */
.how-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.how-step { gap: 8px; align-content: start; }
.step-n { width: 30px; height: 30px; border-radius: 50%; background: var(--leaf); color: var(--on-leaf); display: grid; place-items: center; font-family: var(--f-mono); font-size: 14px; }
.faq { display: grid; }
.faq details { border-top: 1px solid var(--line); padding-block: 10px; }
.faq summary { cursor: pointer; font-weight: 600; font-size: 14.5px; }
.faq details p { margin-top: 6px; }
table.t.wrap td { white-space: normal; min-width: 140px; }
.score { display: grid; gap: 8px; padding: 12px; border-radius: 8px; background: var(--sunk); }
.score .bars { gap: 2px; }
.score-why { margin: 0 0 6px; }
.bad-callout { border-left-color: var(--bad); background: var(--bad-soft); }
input[type="range"] { width: 100%; accent-color: var(--leaf); }

/* One card and food */
.onecard { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.feat { gap: 6px; align-content: start; }
.names-en { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); align-items: start; }
.name-list { list-style: none; margin: 0; padding: 0; display: grid; }
.name-list li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start; padding-block: 8px; border-top: 1px solid var(--line); }
.star { border: 0; background: none; font-size: 18px; line-height: 1; color: var(--sun); cursor: pointer; padding: 2px; }
table.t.inv td:nth-child(5) { min-width: 260px; }
table.t.inv select.in { min-width: 140px; padding: 6px 8px; }

const trim2 = x => String(Math.round(x * 100) / 100);

// Is the household's plan paid? A missed payment keeps cover through the plan's grace days, then pauses it.
function cover(m) {
  const p = S.plans[m.sub.plan];
  if (tierOf(m).free || TODAY <= m.sub.paidUntil) return { s: 'paid', p };
  return { s: days(m.sub.paidUntil, TODAY) <= p.grace ? 'due' : 'lapsed', p };
}
function coverPill(m) {
  const c = cover(m);
  if (tierOf(m).free) return '<span class="pill">Kibanja Card · free</span>';
  return { paid: `<span class="pill ok">${m.sub.payer ? 'Paid by employer' : c.p.name + ' · paid'}</span>`, due: `<span class="pill warn">${c.p.name} payment due</span>`, lapsed: '<span class="pill bad">Cover paused</span>' }[c.s];
}

function emergencyPill(m) {
  if (tierOf(m).free) return '<span class="pill">No Package Protection</span>';
  if (m.cover === 'review') return '<span class="pill warn">Claim under review</span>';
  if (m.cover === 'active') return '<span class="pill ok">Package Protection paying</span>';
  return days(m.sub.start, TODAY) < WAIT_DAYS ? '<span class="pill">Protection in waiting period</span>' : '<span class="pill ok">Package Protection ready</span>';
}
function creditPill(m) {
  if (tierOf(m).free) return '<span class="pill">No food credit</span>';
  if (m.cover === 'active') return '<span class="pill">Credit frozen during emergency</span>';
  return m.credit.overdue ? '<span class="pill bad">Repayment overdue</span>' : '<span class="pill ok">Credit in good standing</span>';
}

// Everything the card can pay with right now. The till spends them in this order: points (if chosen), allowance, wallet, credit.
function sources(m) {
  const c = cover(m), live = c.s !== 'lapsed', notes = [], cr = m.credit;
  let allowance = 0, credit = 0;
  if (m.cover === 'active') {
    const a = m.allowance, cap = capOf(m);
    if (TODAY >= addMonths(a.activated, PROTECT_MONTHS)) notes.push('Package Protection has ended.');
    else if (live) allowance = Math.max(0, Math.min(cap - a.month, limitOf(m) - a.total));
    notes.push('Food credit is frozen while the emergency allowance runs: no new credit, no repayments due.');
  } else {
    if (m.cover === 'review') notes.push('Emergency claim under review.');
    if (cr.overdue) notes.push('Food credit paused until the overdue repayment is made.');
    else if (live && ladderOf(m).length) credit = Math.max(0, ladderOf(m)[cr.rung] - cr.used);
  }
  if (!live) notes.push(`Cover paused: the ${c.p.name.toLowerCase()} payment was due ${fdate(m.sub.paidUntil)}. Allowance, credit and the member discount stop until it is paid. The wallet still works.`);
  const pointsValue = m.points * S.loyalty.value, pointsUsable = m.points >= S.loyalty.threshold && S.loyalty.value > 0;
  if (tierOf(m).free) notes.push('Kibanja Card: shopping balance and points. A package adds bonus value, Package Protection and food credit.');
  return { allowance, credit, wallet: m.wallet, disc: live && !tierOf(m).free ? c.p.disc : 0, live, notes, pointsValue, pointsUsable,
    total: allowance + credit + m.wallet + (pointsUsable ? pointsValue : 0) };
}

    ? `<p class="small">Next rung <b class="num">${short(L[c.rung + 1])}</b>: ${Math.min(c.onTime, 3)}/3 on-time repayments with your plan paid up.</p>`
    : `<p class="small">You're on the top rung.</p>`;
  const due = frozen
    ? `<div class="due"><span class="small"><b>Frozen while your emergency allowance runs.</b> Nothing new goes on credit and nothing is due, with no extra interest, until a month after the allowance ends.</span></div>`
    : c.dueAmt > 0 ? `<div class="due ${c.overdue ? 'bad' : ''}">
      <div class="row between"><span class="small"><b>${c.overdue ? 'Overdue since' : 'Next repayment'}</b> ${fdate(c.due)}</span><span class="num">${ugx(c.dueAmt)}</span></div>
      <button class="btn primary block" data-a="pay">Repay ${ugx(c.dueAmt)} with Mobile Money</button>
    </div>` : `<p class="small muted">Nothing to repay right now.</p>`;
  return `<div class="ph-block">
    <div class="row between"><span class="eyebrow">Food credit line</span>${creditPill(m)}</div>

    ${next}
    ${due}
  </div>`;
}

/* Till */
function cartTotals() {
  const m = ui.posMember && member(ui.posMember);
  const src = m ? sources(m) : null;
  const lines = ui.cart.map(l => {
    const s = SKUS.find(x => x.sku === l.sku), promo = S.promos.find(p => p.on && p.sku === s.sku);
    const gross = s.price * l.q, promoOff = promo ? Math.round(gross * promo.pct / 100) : 0;
    const memberOff = src ? Math.round((gross - promoOff) * src.disc / 100) : 0;
    return { ...s, q: l.q, gross, promo, promoOff, memberOff, net: gross - promoOff - memberOff };
  });
  const sum = k => lines.reduce((a, l) => a + l[k], 0);
  const ess = lines.filter(l => l.ess).reduce((a, l) => a + l.net, 0), total = sum('net'), other = total - ess;
  const local = lines.filter(l => l.local).reduce((a, l) => a + l.net, 0);
  const pay = { points: 0, allowance: 0, wallet: 0, credit: 0, mm: 0 };
  let e = ess, o = other;
  if (src) {
    if (ui.usePoints && src.pointsUsable) {
      pay.points = Math.min(src.pointsValue, total);
      const p1 = Math.min(o, pay.points); o -= p1; e -= pay.points - p1; // points take extras first, leaving essentials for the allowance
    }
    pay.allowance = Math.min(e, src.allowance); e -= pay.allowance;
    // The wallet takes extras first: the food credit line can only pay for essentials.
    const w1 = Math.min(o, src.wallet); o -= w1;
    const w2 = Math.min(e, src.wallet - w1); e -= w2;
    pay.wallet = w1 + w2;
    pay.credit = Math.min(e, src.credit); e -= pay.credit;
  }
  pay.mm = e + o;
  // Points are earned on money the household pays in (wallet, credit, Mobile Money), not on insurance money or points.
  // Ugandan-made goods earn the plan's rate twice.
  const paidIn = pay.wallet + pay.credit + pay.mm, rate = src && src.live ? earnRate(m) : 0;
  const earn = Math.floor(paidIn / 100 * rate) + Math.floor(Math.min(local, paidIn) / 100 * rate);
  return { m, src, lines, gross: sum('gross'), promoOff: sum('promoOff'), memberOff: sum('memberOff'), total, ess, other, local, pay, earn };
}

// Average premium a year per household, from the plan mix and the prices on the Plans screen.
function premiumOf(o = M) {
  const w = Math.min(o.mixW, 100) / 100, mo = Math.min(o.mixM, 100 - Math.min(o.mixW, 100)) / 100;
  return w * ORIGINAL.weekly * 52 + mo * ORIGINAL.monthly * 12 + (1 - w - mo) * ORIGINAL.annual;
}

function yr(i, o = M) {
  const f = o.fam[i], spend = o.spend * 1e6;
  const prem = f * premiumOf(o), claims = f * (o.claimRate / 100) * o.avgDraw * 1e6;
  const creditVol = f * (o.creditShare / 100) * spend;          // groceries bought on the monthly credit line
  const reb = f * spend * (o.rebatePct / 100) + creditVol * (o.feePct / 100);
  const outstanding = creditVol / 12;                           // one month of credit spend, repaid at cycle end
  const credit = creditVol * (o.lossPct / 100) + outstanding * (o.cofPct / 100);
  const disc = f * spend * ((o.discPct + o.ptsPct) / 100);     // member discounts and points Kibanja pays for
  const ops = o.ops[i] * 1e6;
  return { f, prem, reb, gross: prem + reb, claims, credit, disc, ops, outstanding, creditVol, net: prem + reb - claims - credit - disc - ops };
}
// Claim rate at which the margin from everything else is used up by claims.
function breakEven(i, o = M) { const y = yr(i, { ...o, claimRate: 0 }); return y.net / y.f / (o.avgDraw * 1e6); }

};

const BOOKS = {
  food: { view: 'loans', title: 'Kibanja Loan', short: 'Kibanja Loan', products: PRODUCTS, def: { product: 'farm', amount: 500000, n: 4 },
    intro: 'Loans that grow, store, sell and move food, all on the same score and rules: farm inputs, poultry and livestock, storage, food-trade stock, motorcycles and fuel.' },
};

const bookOf = () => 'food';
const span = (period, n) => `${n} ${period}${n === 1 ? '' : 's'}`;
const perRate = l => l.rate / 100 * (l.period === 'week' ? 12 / 52 : 1);   // the monthly rate, spread over weeks for weekly loans
const instalment = l => { const r = perRate(l); return r ? l.amount * r / (1 - Math.pow(1 + r, -l.n)) : l.amount / l.n; };
const monthlyCost = l => instalment(l) * (l.period === 'week' ? 52 / 12 : 1);
const balanceAfter = (l, k) => { const r = perRate(l), i = instalment(l); return r ? Math.max(0, l.amount * Math.pow(1 + r, k) - i * (Math.pow(1 + r, k) - 1) / r) : l.amount - i * k; };
const nextDue = l => l.period === 'week' ? addDays(l.start, 7 * (l.paid + 1)) : addMonths(l.start, l.paid + 1);
const openLoans = m => S.loans.filter(l => l.m === m.id && (l.status === 'active' || l.status === 'pending'));
const openLoan = (m, book) => openLoans(m).find(l => !book || bookOf(l.product) === book);

// The Kibanja score: built only from what the household has done on the platform, so every point can be explained to them.
function score(m) {
  const c = cover(m), parts = [];
  const months = Math.min(12, Math.max(0, Math.floor(days(m.enrolled, TODAY) / 30)));
  parts.push(['Time as a member', months / 12 * 20, 20, `${months} month${months === 1 ? '' : 's'}`]);
  parts.push(['Plan payments', tierOf(m).free ? 5 : { paid: 20, due: 10, lapsed: 0 }[c.s], 20, tierOf(m).free ? 'Free card: no package payments yet' : { paid: 'Up to date', due: 'Payment due', lapsed: 'Cover paused' }[c.s]]);
  const late = S.loans.some(l => l.m === m.id && l.status === 'active' && nextDue(l) < TODAY);
  let rep = m.credit.overdue ? 0 : 15 + Math.min(m.credit.onTime, 3) / 3 * 10;
  let repTxt = m.credit.overdue ? 'Food credit repayment overdue' : `${Math.min(m.credit.onTime, 3)} on-time repayments in a row`;
  if (late) { rep = 0; repTxt = 'Loan instalment late'; }
  parts.push(['Repayment record', rep, 25, repTxt]);
  const share = essShare(m.spend);
  parts.push(['Spending on essentials', share * 20, 20, `${pct(share)} of card spending`]);
  parts.push(['Card activity', Math.min(15, m.points / S.loyalty.threshold * 15), 15, `${m.points.toLocaleString('en-US')} points`]);
  return { total: Math.round(parts.reduce((a, x) => a + x[1], 0)), parts };
}

function loanOffer(m, key) {
  const P = PRODUCTS[key], book = bookOf(key), sc = score(m).total, blocks = [];
  if (tierOf(m).free) blocks.push('Free card holders can\'t borrow yet. A package builds the record the score is made from.');
  if (m.cover === 'active' || m.cover === 'review') blocks.push('This household has an open emergency claim or allowance. Kibanja does not lend during an emergency; the allowance is the help.');
  if (cover(m).s === 'lapsed') blocks.push('The package is paused. It has to be paid first.');
  if (m.credit.overdue) blocks.push('A food credit repayment is overdue.');
  // One loan at a time; fuel credit is small and short, so it may run alongside one other loan.
  const clash = openLoans(m).find(l => (l.product === 'fuel') === (key === 'fuel'));
  if (clash) blocks.push(key === 'fuel' ? 'This household already has fuel credit open.' : `One Kibanja Loan at a time: this household already has a ${PRODUCTS[clash.product].name.toLowerCase()} loan open. Fuel credit can still run alongside it.`);
  if (sc < 50) blocks.push(`A score of ${sc} is below the 50 needed to borrow.`);
  const step = P.max >= 1000000 ? 50000 : 10000;
  const limit = sc < 50 ? 0 : Math.floor(P.max * Math.min(1, (sc - 40) / 50) / step) * step;
  return { limit, blocks, sc, step };
}

function affordability(m, l) {
  const other = (m.cover === 'active' ? 0 : m.credit.dueAmt) + S.loans.filter(x => x.m === m.id && x.status === 'active' && x !== l).reduce((a, x) => a + monthlyCost(x), 0);
  const cap = m.income * AFFORD, total = other + monthlyCost(l);
  return { ok: total <= cap, total, cap, other };
}

function loanBlock(m) {

function volume(n, unit) {
  if (unit === 'kg') return n >= 1000 ? `${trim2(n / 1000)} t` : `${Math.round(n).toLocaleString('en-US')} kg`;

  return `${Math.round(n).toLocaleString('en-US')} ${unit}`;
}

/* ---------- render + actions ---------- */
function render() {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.v === ui.view)));
  $('#main').innerHTML = `<div class="view">${V[ui.view]()}</div>`;
  if (ui.view === 'model') modelOut();
  if (ui.view === 'loans') loanCalc();
}

function go(v) {
  if (!V[v] || !VIEWS.includes(v)) return;
  ui.view = v;
  try { history.replaceState(null, '', '#' + v); } catch {}
  render();
  window.scrollTo(0, 0);
}

function lookup(q) {
  const d = String(q).replace(/\s/g, '').toUpperCase();
  if (ui.payCode && d === ui.payCode.code) { const m = member(ui.payCode.m); ui.payCode = null; toast('Pay code accepted'); return m; }
  return S.members.find(m => m.card.replace(/\s/g, '') === d || m.id === d || (d.length >= 4 && m.card.replace(/\s/g, '').endsWith(d)));
}

const A = {
  tab: b => go(b.dataset.v),
  reset: () => { S = seed(); Object.assign(ui, { usePoints: false, payCode: null, loanAs: 'KSC-0001', loanDraft: { food: { ...BOOKS.food.def }, move: { ...BOOKS.move.def } }, viewAs: 'KSC-0001', claimForm: false, posMember: null, posInput: '', cart: [], receipt: null, opsClaim: 'CLM-0141' }); render(); toast('Example households, plans and offers reset'); },
  'open-claim': () => { ui.claimForm = true; render(); },
  'cancel-claim': () => { ui.claimForm = false; render(); },
  pay: () => {
    const m = member(ui.viewAs), c = m.credit;
    const wasOverdue = c.overdue;
    c.used = Math.max(0, c.used - c.dueAmt);
    S.txns.push({ d: TODAY, m: m.id, where: 'Repayment · Mobile Money', smart: 0, mm: c.dueAmt, items: 0 });
    c.onTime = wasOverdue ? 0 : c.onTime + 1;
    c.overdue = false;
    c.due = addMonths(wasOverdue ? TODAY : c.due, 1);
    c.dueAmt = c.used ? Math.max(100000, Math.round(c.used / 4 / 1000) * 1000) : 0;
    let msg = wasOverdue ? 'Repaid. The food credit line works again.' : `Repaid on time (${Math.min(c.onTime, 3)}/3).`;
    if (c.onTime >= 3 && cover(m).s === 'paid' && c.rung < ladderOf(m).length - 1) { c.rung++; c.onTime = 0; msg = `Moved up to the ${short(ladderOf(m)[c.rung])} rung`; }
    render(); toast(msg);
  },
  'pay-plan': () => {
    const m = member(ui.viewAs), wasFree = tierOf(m).free, lapsed = cover(m).s === 'lapsed';
    const tk = m.sub.nextTier || m.sub.tier, fk = m.sub.next || m.sub.plan, t = S.tiers[tk], price = priceFor(tk, fk), value = valueFor(tk, fk);
    m.sub.tier = tk; m.sub.plan = fk; delete m.sub.next; delete m.sub.nextTier;
    // Starting from free or after a lapse, cover starts today, and so does the waiting period for emergency claims.
    if (wasFree || lapsed) { m.sub.start = TODAY; m.sub.paidUntil = nextPeriod(TODAY, fk); } else m.sub.paidUntil = nextPeriod(m.sub.paidUntil, fk);
    m.wallet += value;
    S.txns.push({ d: TODAY, m: m.id, where: `${t.name.replace('Kibanja ', '')}, ${S.plans[fk].name.toLowerCase()} · Mobile Money`, smart: 0, mm: price, items: 0, via: `+ ${value.toLocaleString('en-US')} to spend` });
    render(); toast(`Paid ${ugx(price)}. ${ugx(value)} added to your shopping balance.`);
  },

    const m = member(ui.viewAs), v = +b.dataset.amt;
    m.wallet += v;

  'promo-toggle': b => { const p = S.promos.find(x => x.id === b.dataset.id); p.on = !p.on; render(); toast(`${p.name} ${p.on ? 'started' : 'paused'}`); },
  'promo-del': b => { const p = S.promos.find(x => x.id === b.dataset.id); S.promos = S.promos.filter(x => x !== p); render(); toast(`${p.name} removed`); },
  'star-name': b => { nameStars[b.dataset.name] = !nameStars[b.dataset.name]; store.set('ksc-names', nameStars); render(); },
  'inv-filter': b => { ui.invFilter = b.dataset.k; render(); },
  'ops-pick': b => { ui.opsClaim = b.dataset.id; render(); },
  verify: b => { const c = S.claims.find(x => x.id === ui.opsClaim); c.checks[+b.dataset.i].r = 'ok'; render(); },
  approve: () => {
    const c = S.claims.find(x => x.id === ui.opsClaim), m = member(c.member);
    c.status = 'approved'; c.decided = TODAY;
    m.cover = 'active'; m.allowance = { activated: TODAY, month: 0, total: 0 };
    render(); toast(`${hh(m)}: package continues free for ${PROTECT_MONTHS} months at ${ugx(capOf(m))} a month, food credit frozen`);
  },
  decline: () => {
    const c = S.claims.find(x => x.id === ui.opsClaim), m = member(c.member);
    c.status = 'declined'; c.decided = TODAY; m.cover = 'none';
    render(); toast(`${c.id} declined. The household is told why in the app.`);
  },
  'model-reset': () => { Object.assign(M, JSON.parse(JSON.stringify(M0))); render(); },
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  A[b.dataset.a] && A[b.dataset.a](b);
});

document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'pos-form') return A['pos-lookup']();
  if (e.target.id === 'promo-form') {
    const name = $('#pr-name').value.trim(), pctOff = parseFloat($('#pr-pct').value);
    if (!name || !(pctOff > 0 && pctOff < 100)) { toast('Give the offer a name and a discount between 1 and 99%'); return; }
    const sku = $('#pr-sku').value;
    S.promos = S.promos.filter(p => !(p.sku === sku && p.on)); // one running offer per product
    S.promos.push({ id: 'P' + Date.now(), sku, pct: pctOff, name, funder: $('#pr-funder').value, on: true });
    render(); toast(`${name} is running at every till`);
    return;
  }
  if (e.target.id === 'loan-form') {
    const m = member(ui.loanAs), d = ui.loanDraft[ui.loanBook], P = PRODUCTS[d.product];
    const l = { id: 'LN-' + String(8 + S.loans.length).padStart(4, '0'), m: m.id, product: d.product, amount: d.amount, n: d.n, period: P.period, rate: P.rate, applied: TODAY, paid: 0, status: 'pending' };
    if (loanOffer(m, d.product).blocks.length || !affordability(m, l).ok) { toast('This application cannot be sent'); return; }
    S.loans.push(l);
    render(); toast(`Application ${l.id} sent. Approve it in the loan book.`);
    return;
  }
  if (e.target.id === 'claim-form') {
    const m = member(ui.viewAs);
    if (tierOf(m).free) { toast('The free card has no Package Protection. Choose a package first.'); return; }
    const type = $('#cl-type').value, note = $('#cl-note').value.trim(), hasFile = $('#cl-file').files.length > 0;
    const inForce = days(m.sub.start, TODAY);
    const checks = [{ t: `Waiting period passed (${WAIT_DAYS} days)`, r: inForce >= WAIT_DAYS ? 'ok' : 'fail', d: `${inForce} days of continuous cover` }];
    if (type === 'job') checks.push({ t: 'Termination letter on file', r: hasFile ? 'ok' : 'missing' }, { t: 'NSSF contributions stopped', r: 'todo', d: 'Pull the contribution history' }, { t: 'Employer confirms by phone', r: 'todo', d: 'Call HR on a number the platform finds itself' });
    if (type === 'medical') checks.push({ t: 'Admission note on file', r: hasFile ? 'ok' : 'missing' }, { t: 'Partner hospital confirms admission', r: 'todo' });
    if (type === 'drought') checks.push({ t: 'District on the declared drought list', r: 'todo', d: 'Check against the national weather authority\'s rainfall bulletin' });
    checks.push({ t: 'No other claim this policy year', r: S.claims.some(x => x.member === m.id && x.status === 'approved') ? 'fail' : 'ok' });
    const id = 'CLM-0' + (142 + S.claims.length - 2);
    S.claims.push({ id, member: m.id, type, filed: TODAY, status: 'pending', note, checks });
    m.cover = 'review'; ui.claimForm = false; ui.opsClaim = id;
    render(); toast(`Claim ${id} sent. Operations can see it now.`);
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'view-as') { ui.viewAs = t.value; ui.claimForm = false; render(); }
  if (t.id === 'use-points') { ui.usePoints = t.checked; render(); }
  if (t.dataset.loyalty) { const v = parseFloat(t.value); S.loyalty[t.dataset.loyalty] = isFinite(v) && v >= 0 ? v : 0; render(); }
  if (t.id === 'ln-as') { ui.loanAs = t.value; ui.loanDraft[ui.loanBook].amount = BOOKS[ui.loanBook].def.amount; render(); }
  if (t.id === 'ln-product') { const d = ui.loanDraft[ui.loanBook]; d.product = t.value; d.n = PRODUCTS[t.value].terms[1]; render(); }
  if (t.id === 'ln-n') { ui.loanDraft[ui.loanBook].n = +t.value; loanCalc(); }
  if (t.id === 'plan-switch') {
    const m = member(ui.viewAs);
    if (t.value === m.sub.plan) delete m.sub.next; else m.sub.next = t.value;
    render();
  }
  if (t.id === 'tier-switch') {
    const m = member(ui.viewAs);
    if (t.value === m.sub.tier) delete m.sub.nextTier; else m.sub.nextTier = t.value;
    render();
  }
  if (t.dataset.tier) {
    const v = parseFloat(t.value), x = isFinite(v) && v >= 0 ? v : 0;
    S.tiers[t.dataset.tier][t.dataset.freq] = x;
    render();
  }
  if (t.dataset.plan) {
    const v = parseFloat(t.value);
    S.plans[t.dataset.plan][t.dataset.field] = isFinite(v) && v >= 0 ? v : 0;
    render();
  }
  if (t.dataset.lic) { licences[t.dataset.lic] = t.checked; store.set('ksc-licences', licences); }
  if (t.dataset.inv) { invTrack[t.dataset.inv] = t.value; store.set('ksc-investors', invTrack); render(); }
  if (t.dataset.room) { dataroom[t.dataset.room] = t.checked; store.set('ksc-dataroom', dataroom); }
  if (t.id === 'corp-staff') { const v = parseInt(t.value, 10); ui.corp.staff = isFinite(v) && v > 0 ? v : 1; render(); }
  if (t.id === 'corp-pkg') { ui.corp.pkg = t.value; render(); }
  if (t.id === 'corp-freq') { ui.corp.freq = t.value; render(); }
  if (t.id === 'food-uptake') { const v = parseFloat(t.value); ui.uptake = isFinite(v) ? Math.max(0, Math.min(100, v)) : 0; render(); }
  if (t.id === 'float-yield') { const v = parseFloat(t.value); ui.floatYield = isFinite(v) && v >= 0 ? v : 0; render(); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'pos-card') ui.posInput = e.target.value;
  if (e.target.id === 'ln-amount') { const d = ui.loanDraft[ui.loanBook]; d.amount = +e.target.value; $('#ln-amount-out').textContent = ugx(d.amount); loanCalc(); }
  if (!e.target.closest('#model-form')) return;
  const num = id => { const v = parseFloat($('#' + id).value); return isFinite(v) && v >= 0 ? v : 0; };
  M.fam = [0, 1, 2].map(i => Math.max(1, num('fam' + i)));
  M.ops = [0, 1, 2].map(i => num('ops' + i));
  ['mixW', 'mixM', 'discPct', 'ptsPct', 'limit', 'claimRate', 'avgDraw', 'spend', 'creditShare', 'rebatePct', 'feePct', 'lossPct', 'cofPct'].forEach(k => M[k] = num(k));
  modelOut();
});

document.querySelectorAll('[data-mode]').forEach(el => { if (el.dataset.mode !== MODE) el.remove(); });
const VIEWS = [...document.querySelectorAll('.tab')].map(t => t.dataset.v);
if (MODE === 'investors') { $('#brand-sub').textContent = 'investor pack'; document.querySelector('.tabs').setAttribute('aria-label', 'Investor pack sections'); }
const start = (location.hash || '').slice(1);
ui.view = VIEWS.includes(start) ? start : VIEWS[0];
render();
</script>
