<title>Kibanja SmartCare</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky bar of six views; each view is one column that splits into a working pane and a side pane from 900px. */
:root {
  --bg: #F1F4EF;  --surface: #FFFFFF; --sunk: #E7ECE5; --ink: #13231A; --muted: #55665C; --line: #D3DCD2;
  --leaf: #1D5A3E; --leaf-soft: #DBEADF; --on-leaf: #FFFFFF;
  --sun: #C98A12; --sun-soft: #FAEDCF;
  --ok: #2A7748;  --ok-soft: #DCEFE2; --warn: #8F5D00; --warn-soft: #FAEAC6; --bad: #AE3520; --bad-soft: #F7DCD4;
  --bezel: #17221C;
  --card-a: #163F2B; --card-b: #2C7650; --card-ink: #F5F1E1; --card-sun: #F0BF4C;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1612; --surface: #16211B; --sunk: #1D2A23; --ink: #E4ECE6; --muted: #98AA9F; --line: #2B3A31;
  --leaf: #6CC795; --leaf-soft: #1E3628; --on-leaf: #0B1A12;
  --sun: #EDB848; --sun-soft: #3A2F14;
  --ok: #62C68E; --ok-soft: #173325; --warn: #E8B04C; --warn-soft: #382A10; --bad: #F07A60; --bad-soft: #3D1D16;
  --bezel: #040706; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E1612; --surface: #16211B; --sunk: #1D2A23; --ink: #E4ECE6; --muted: #98AA9F; --line: #2B3A31;
  --leaf: #6CC795; --leaf-soft: #1E3628; --on-leaf: #0B1A12;
  --sun: #EDB848; --sun-soft: #3A2F14;
  --ok: #62C68E; --ok-soft: #173325; --warn: #E8B04C; --warn-soft: #382A10; --bad: #F07A60; --bad-soft: #3D1D16;
  --bezel: #040706; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 700; }
h3 { font-size: 18px; font-weight: 700; }
h4 { font-size: 15px; font-weight: 700; font-family: var(--f-body); }
p { margin: 0; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
button, input, select, textarea { font: inherit; color: inherit; }
table { font: inherit; }
:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1200px; margin: 0 auto; padding-block: 10px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 19px; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(140deg, var(--card-a), var(--card-b)); position: relative; flex: none; }
.brand-mark::after { content: ""; position: absolute; left: 7px; top: 9px; width: 14px; height: 10px; border-radius: 3px; background: var(--card-sun); }
.brand small { font-family: var(--f-body); font-weight: 500; font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 10px 12px; font-size: 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--leaf); }
.tab:hover { color: var(--ink); }

main { max-width: 1200px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { display: grid; gap: 24px; }
.split { display: grid; gap: 24px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 900px) { .split { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } .split.phone-split { grid-template-columns: 400px minmax(0, 1fr); } }
.split > * { min-width: 0; }
.stack { display: grid; gap: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; }
.panel.flat { background: transparent; border: 0; padding: 0; }
.lede { font-size: 17px; max-width: 62ch; color: var(--muted); }

/* Buttons and pills */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--leaf); border-color: var(--leaf); color: var(--on-leaf); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; justify-content: center; padding-block: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.btn.chip { padding: 5px 10px; font-size: 12.5px; font-family: var(--f-mono); font-weight: 500; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; background: var(--sunk); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }

label.f { display: grid; gap: 5px; font-size: 13px; font-weight: 600; }
label.f span.hint { font-weight: 400; color: var(--muted); }
.in { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
textarea.in { min-height: 72px; resize: vertical; }

/* Overview */
.hero { display: grid; gap: 14px; padding-block: 8px 4px; }
.hero h1 em { font-style: normal; color: var(--leaf); }
.models { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.model-card { display: grid; gap: 12px; align-content: start; }
.terms { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; margin: 0; }
.terms dt { color: var(--muted); }
.terms dd { margin: 0; font-weight: 600; }
.modules { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.module { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 6px; align-content: start; background: var(--surface); cursor: pointer; text-align: left; }
.module:hover { border-color: var(--leaf); }
.module .go { color: var(--leaf); font-weight: 600; font-size: 13px; }
.journey { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: j; }
.journey li { counter-increment: j; display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding-block: 10px; border-top: 1px solid var(--line); }
.journey li::before { content: counter(j); font-family: var(--f-mono); font-size: 13px; width: 26px; height: 26px; border-radius: 50%; background: var(--leaf-soft); color: var(--leaf); display: grid; place-items: center; }
.callout { border-left: 3px solid var(--sun); background: var(--sun-soft); padding: 14px 16px; border-radius: 0 var(--r) var(--r) 0; display: grid; gap: 8px; }

/* Phone */
.phone { width: 100%; max-width: 400px; border: 10px solid var(--bezel); border-radius: 34px; background: var(--bg); overflow: hidden; margin-inline: auto; }
.screen { padding: 14px 14px 20px; display: grid; gap: 14px; min-height: 640px; align-content: start; }
.ph-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.hello { font-family: var(--f-display); font-size: 20px; font-weight: 700; }
.ph-block { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.big { font-family: var(--f-mono); font-size: 24px; font-weight: 500; letter-spacing: -0.02em; }
.ticks { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 14px; }
.ticks li::before { content: "✓"; color: var(--leaf); font-weight: 700; margin-right: 8px; }
.meter { height: 10px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--leaf); border-radius: inherit; }
.meter.sun > i { background: var(--sun); }
.ladder { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; align-items: end; height: 64px; }
.ladder i { display: block; border-radius: 4px 4px 0 0; background: var(--sunk); }
.ladder i.done { background: var(--leaf-soft); }
.ladder i.on { background: var(--leaf); }
.ladder-lbl { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); text-align: center; }
.due { border-radius: 10px; padding: 10px 12px; background: var(--sunk); display: grid; gap: 8px; }
.due.bad { background: var(--bad-soft); }
.txns { list-style: none; margin: 0; padding: 0; display: grid; }
.txns li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding-block: 9px; border-top: 1px solid var(--line); font-size: 13.5px; }
.txns li .amt { font-family: var(--f-mono); text-align: right; }
.txns li .sub { font-size: 12px; color: var(--muted); }

/* SmartCare card */
.kcard { position: relative; aspect-ratio: 1.586; max-width: 100%; border-radius: 14px; padding: 16px 18px; color: var(--card-ink); overflow: hidden;
  background: radial-gradient(120% 90% at 100% 0%, rgba(240,191,76,.28), transparent 55%), repeating-linear-gradient(118deg, rgba(255,255,255,.035) 0 14px, transparent 14px 30px), linear-gradient(150deg, var(--card-a), var(--card-b));
  display: grid; grid-template-rows: auto 1fr auto; box-shadow: 0 10px 24px -14px rgba(0,0,0,.55); }
.kcard .k-head { display: flex; justify-content: space-between; align-items: center; }
.kcard .k-name { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: .01em; }
.kcard .k-name b { color: var(--card-sun); }
.kcard .k-chip { width: 38px; height: 28px; border-radius: 6px; background: linear-gradient(135deg, var(--card-sun), #D49A26); align-self: center; }
.kcard .k-num { font-family: var(--f-mono); font-size: 18px; letter-spacing: .08em; }
.kcard .k-foot { display: flex; justify-content: space-between; align-items: end; gap: 8px; font-size: 12px; }
.kcard .k-foot .lbl { opacity: .7; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
.kcard .k-state { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: rgba(0,0,0,.28); }

/* Rules panel */
.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rules li { display: grid; gap: 2px; padding-left: 14px; border-left: 2px solid var(--line); }
.rules li b { font-weight: 600; }
.try { background: var(--leaf-soft); border-radius: var(--r); padding: 12px 14px; font-size: 14px; display: grid; gap: 6px; }

/* POS */
.cat { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.sku { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px; text-align: left; cursor: pointer; display: grid; gap: 4px; align-content: start; }
.sku:hover { border-color: var(--leaf); }
.sku .nm { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
.sku .pr { font-family: var(--f-mono); font-size: 13px; }
.tag { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--leaf); }
.tag.no { color: var(--muted); }
.cart { list-style: none; margin: 0; padding: 0; display: grid; }
.cart li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); font-size: 14px; }
.qty { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); }
.qty button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.tot { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; }
.tot .v { font-family: var(--f-mono); text-align: right; }
.tot .grand { font-weight: 700; font-size: 16px; border-top: 1px solid var(--line); padding-top: 8px; }
.member-strip { display: grid; gap: 8px; padding: 12px 14px; border-radius: var(--r); background: var(--sunk); }
.receipt { font-family: var(--f-mono); font-size: 12.5px; background: var(--surface); border: 1px dashed var(--muted); border-radius: 6px; padding: 14px; display: grid; gap: 4px; }
.receipt .r { display: flex; justify-content: space-between; gap: 10px; }
.receipt hr { border: 0; border-top: 1px dashed var(--line); width: 100%; margin: 4px 0; }

/* Ops */
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; }
.kpi .v { font-family: var(--f-mono); font-size: 22px; font-weight: 500; }
.queue { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.queue button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: grid; gap: 4px; }
.queue button[aria-current="true"] { border-color: var(--leaf); box-shadow: inset 3px 0 0 var(--leaf); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; }
.checks li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding-block: 9px; border-top: 1px solid var(--line); font-size: 14px; }
.ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.ic.ok { background: var(--ok-soft); color: var(--ok); }
.ic.todo { background: var(--warn-soft); color: var(--warn); }
.ic.bad { background: var(--bad-soft); color: var(--bad); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th, table.t td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--sunk); }
table.t td.n, table.t th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.strong td { font-weight: 700; }
table.t td.neg { color: var(--bad); }

/* Model */
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; }
legend { padding: 0; margin-bottom: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg label { padding: 8px 12px; font-size: 13.5px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.seg label:has(input:checked) { background: var(--leaf-soft); color: var(--leaf); font-weight: 600; }
.seg input { accent-color: var(--leaf); }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 120px 1fr 92px; gap: 10px; align-items: center; font-size: 13.5px; }
.bar .track { height: 14px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.bar .track i { display: block; height: 100%; border-radius: 4px; }
.bar .v { font-family: var(--f-mono); text-align: right; font-size: 13px; }
.grid-sens td.cell { text-align: right; font-family: var(--f-mono); }
.grid-sens td.pos { background: var(--ok-soft); color: var(--ok); }
.grid-sens td.neg { background: var(--bad-soft); color: var(--bad); }
.grid-sens td.here { outline: 2px solid var(--ink); outline-offset: -2px; font-weight: 700; }
.findings { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.findings li { display: grid; grid-template-columns: 8px 1fr; gap: 12px; }
.findings li::before { content: ""; border-radius: 4px; background: var(--sun); }
.findings li.bad::before { background: var(--bad); }
.findings li.ok::before { background: var(--ok); }
.findings b { display: block; margin-bottom: 2px; }

/* Rollout */
.phases { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.phase { display: grid; gap: 10px; align-content: start; }
.phase .when { font-family: var(--f-mono); font-size: 12.5px; color: var(--leaf); font-weight: 500; }
.phase ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.lic { list-style: none; margin: 0; padding: 0; display: grid; }
.lic li { border-top: 1px solid var(--line); padding-block: 10px; }
.lic label { display: grid; grid-template-columns: 22px 1fr; gap: 10px; cursor: pointer; }
.lic input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--leaf); }
.lic li:has(input:checked) b { text-decoration: line-through; color: var(--muted); }

/* Investors */
.adv { display: grid; gap: 12px; align-content: start; }
.adv h4 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.adv .claim { font-size: 15px; }
.adv .ask { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px; font-size: 14px; }
.figs { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; padding: 10px 12px; border-radius: 8px; background: var(--sunk); }
.figs .v { font-family: var(--f-mono); text-align: right; }
.figs .tot { font-weight: 700; border-top: 1px solid var(--line); padding-top: 4px; }
.stages { list-style: none; margin: 0; padding: 0; display: grid; }
.stages li { display: grid; grid-template-columns: minmax(110px, 160px) 1fr; gap: 4px 16px; padding-block: 12px; border-top: 1px solid var(--line); }
.stages li b { font-family: var(--f-display); }
@media (max-width: 520px) { .stages li { grid-template-columns: 1fr; } }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); z-index: 20; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
@media (max-width: 520px) { .bar { grid-template-columns: 92px 1fr 76px; } .screen { min-height: 0; } }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand-row">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Kibanja SmartCare <small>platform prototype</small></span></div>
      <button class="btn chip" data-a="reset" title="Put every example household back to its starting state">Reset demo</button>
    </div>
    <nav class="tabs" role="tablist" aria-label="Platform views">
      <button class="tab" role="tab" data-a="tab" data-v="overview">Overview</button>
      <button class="tab" role="tab" data-a="tab" data-v="member">Family app</button>
      <button class="tab" role="tab" data-a="tab" data-v="pos">Store till</button>
      <button class="tab" role="tab" data-a="tab" data-v="ops">Operations</button>
      <button class="tab" role="tab" data-a="tab" data-v="model">Underwriting</button>
      <button class="tab" role="tab" data-a="tab" data-v="rollout">Rollout</button>
      <button class="tab" role="tab" data-a="tab" data-v="investors">Investors</button>
    </nav>
  </div>
</header>
<main id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- constants ---------- */
const TODAY = '2026-10-22';            // demo date: every example household is dated against this
const PREMIUM = 1500000;
const A_LIMIT = 50000000;              // Model A: emergency allowance, paid over 12 months
const LADDER = [4500000, 9000000, 18000000, 30000000, 50000000]; // Model B credit rungs
const WAIT_DAYS = 90;

function statusPill(m) {
  const map = {
    locked: ['', 'Cover in force · card locked'], review: ['warn', 'Claim under review'], active: ['ok', 'Allowance active'],
    good: ['ok', 'Credit in good standing'], overdue: ['bad', 'Repayment overdue'],
  };
  const [c, t] = map[m.status];
  return `<span class="pill ${c}">${t}</span>`;
}

// What the card can pay for right now, and why.
function power(m) {
  if (m.plan === 'A') {
    if (m.status !== 'active') return { amt: 0, why: m.status === 'review' ? 'Card locked while the claim is reviewed' : 'Card locked until an emergency claim is approved' };
    const a = m.allowance, cap = A_LIMIT / 12;
    if (TODAY >= addMonths(a.activated, 12)) return { amt: 0, why: 'The 12-month allowance has ended' };
    return { amt: Math.max(0, Math.min(cap - a.month, A_LIMIT - a.total)), why: 'Emergency allowance left this month' };
  }
  if (m.status === 'overdue') return { amt: 0, why: 'Credit paused until the overdue repayment is made' };
  return { amt: Math.max(0, LADDER[m.credit.rung] - m.credit.used), why: 'Essentials credit available' };
}

  let ess = 0, other = 0;
  ui.cart.forEach(l => { const s = SKUS.find(x => x.sku === l.sku); (s.ess ? (ess += s.price * l.q) : (other += s.price * l.q)); });
  const m = ui.posMember && member(ui.posMember);
  const p = m ? power(m) : { amt: 0, why: 'No card scanned' };
  const smart = Math.min(ess, p.amt);
  return { ess, other, smart, cash: ess + other - smart, p, m };
}

/* Underwriting model */
function yr(i, o = M) {
  const f = o.fam[i], spend = o.spend * 1e6;
  const prem = f * o.premium * 1e6, claims = f * (o.claimRate / 100) * o.avgDraw * 1e6;
  const creditVol = f * (o.creditShare / 100) * spend;          // groceries bought on the monthly credit line
  const reb = f * spend * (o.rebatePct / 100) + creditVol * (o.feePct / 100);
  const outstanding = creditVol / 12;                           // one month of credit spend, repaid at cycle end
  const credit = creditVol * (o.lossPct / 100) + outstanding * (o.cofPct / 100);
  const ops = o.ops[i] * 1e6;
  return { f, prem, reb, gross: prem + reb, claims, credit, ops, outstanding, creditVol, net: prem + reb - claims - credit - ops };
}
// Claim rate at which the margin from everything else is used up by claims.
function breakEven(i, o = M) { const y = yr(i, { ...o, claimRate: 0 }); return y.net / y.f / (o.avgDraw * 1e6); }

function modelOut() {

  const y3 = Y[2], f = y3.f;
  const per = [['Premium', y3.prem / f, 'var(--leaf)'], ['Rebate and fees', y3.reb / f, 'var(--leaf)'], ['Claims', y3.claims / f, 'var(--bad)'], ['Credit costs', y3.credit / f, 'var(--bad)'], ['Tech and ops', y3.ops / f, 'var(--bad)'], ['Net', y3.net / f, y3.net >= 0 ? 'var(--ok)' : 'var(--bad)']];
  const maxv = Math.max(...per.map(p => Math.abs(p[1])), 1);
  const bars = `<section class="panel"><h3>One household, Year 3</h3><div class="bars">${per.map(([l, v, c]) => `<div class="bar"><span>${l}</span><span class="track"><i style="width:${Math.abs(v) / maxv * 100}%;background:${c}"></i></span><span class="v">${short(v)}</span></div>`).join('')}</div></section>`;
  $('#model-out').innerHTML = `<section class="stack"><h3>Three-year view</h3>${table}</section>${bars}`;

  // Stress grid and findings
  const rates = [2, 4, 6, 8, 10, 12], draws = [10, 20, 35, 50];
  const grid = `<div class="tablewrap"><table class="t grid-sens"><thead><tr><th>Claim rate ↓ · used per claim →</th>${draws.map(d => `<th class="n">UGX ${d}M</th>`).join('')}</tr></thead><tbody>

  const full = yr(2, { ...M, avgDraw: M.limit });
  const be = breakEven(2), beFull = breakEven(2, { ...M, avgDraw: M.limit });
  const illus = yr(2, { ...M, lossPct: Math.max(M.lossPct, 3), cofPct: Math.max(M.cofPct, 18) });
  const noCreditCost = M.lossPct === 0 && M.cofPct === 0;
  const F = [
    [full.net < 0 ? 'bad' : '', 'If approved households use their whole allowance',
      `Your plan budgets an average payout of UGX ${M.avgDraw}M against a ${M.limit}M allowance. If ${trim2(M.claimRate)}% claim the full ${M.limit}M, Year 3 claims become ${ugx(full.claims)} and the net margin is ${ugx(full.net)}. A family that lost its income will usually spend everything it is allowed, so either cap the benefit at ${M.avgDraw}M or price for ${M.limit}M.`],
    [be < 0.06 ? 'bad' : '', `Break-even claim rate: ${pct(be)} (${pct(beFull)} at full use)`,
      `Above this share of households claiming in a year, the business loses money. Job loss, a hospital admission or a district drought in a given year is common among Kampala households, so price from real claims data from a pilot before scaling past Year 1.`],
    [noCreditCost ? 'bad' : '', 'The credit line has to be funded',
      `About ${ugx(y3.outstanding)} of groceries are on credit at any moment in Year 3: one month of spend for ${trim2(M.creditShare)}% of households. Someone lends that money and absorbs the families who don't repay. ${noCreditCost ? 'Your table counts neither.' : ''} At ${trim2(Math.max(M.lossPct, 3))}% of credit volume lost and ${trim2(Math.max(M.cofPct, 18))}% a year cost of funds, Year 3 net is ${ugx(illus.net)}.`],
    ['', `A ${trim2(M.feePct)}% fee every month is about ${trim2(M.feePct * 12)}% a year`,

    ['bad', 'Drought hits many households at once',

    ['', 'Costs still missing from the table',
      'The underwriting partner\'s share or reinsurance, sales agent commissions, card issuing, and corporate income tax (30% in Uganda). Add them before treating any line as profit.'],
  ];
  $('#model-sens').innerHTML = `<div class="split">
    <section class="stack"><h3>Stress test: Year 3 net margin</h3><p class="small muted">Each cell recomputes Year 3 with that claim rate and average use, keeping every other input. The outlined cell is your current assumption.</p>${grid}</section>

    <ul class="lic">${LIC.map(([k, b, t]) => `<li><label><input type="checkbox" data-lic="${k}" ${licences[k] ? 'checked' : ''}><span><b>${b}</b><span class="small muted" style="display:block">${t}</span></span></label></li>`).join('')}</ul>
    <p class="small muted">A starting list, not legal advice. Confirm each item with a Ugandan lawyer before relying on it. Your ticks stay in this browser.</p>
  </section>
</div>`;

/* Investors */
const ROOM = [
  ['claims', 'Pilot claims log', 'Every claim, its trigger, evidence, decision and amount paid.'],
  ['cohorts', 'Renewal and repayment by monthly cohort', 'The retention and credit-loss numbers the pitch depends on.'],
  ['cac', 'Customer acquisition cost', 'Total sales and marketing spend divided by households enrolled, by channel.'],
  ['store', 'Flagship store P&L and measured shrinkage', 'Against the month before the kitchen and the card went live.'],
  ['legal', 'Licences and partner agreements', 'Underwriter, credit partner, payments, data protection registration.'],
  ['cap', 'Cap table and use of funds', 'Who owns what, and what this round pays for.'],
];

V.investors = () => {
  const Y = [0, 1, 2].map(i => yr(i)), y3 = Y[2], f = y3.f;
  const float = y3.prem / 2;                 // premiums are earned through the year, so on average half a year's worth is held
  const nwc = float - y3.outstanding;
  const floatIncome = float * ui.floatYield / 100;
  const lossRatio = y3.claims / y3.prem;
  return `<section class="hero">
  <span class="eyebrow">Investor pitch and 10-year scale plan</span>
  <h1>A fintech ecosystem <em>with its own shelves</em>.</h1>
  <p class="lede">Kibanja SmartCare is pitched as more than a supermarket: an AI-driven card that families pay for upfront, a captive store network where they spend it, and the data that links the two. Investors like captive ecosystems because acquisition costs are low, retention is high and upfront subscriptions make cash flow predictable. Each of those has to be shown with pilot numbers.</p>
</section>

<section class="stack">
  <div class="row between"><h2>Year 3 in the model</h2><button class="btn chip" data-a="tab" data-v="model">Change assumptions</button></div>
  <div class="kpis">
    <div class="kpi"><span class="eyebrow">Households</span><span class="v">${f.toLocaleString('en-US')}</span><span class="small muted">Kampala, Year 3</span></div>
    <div class="kpi"><span class="eyebrow">Revenue per household</span><span class="v">${short(y3.gross / f)}</span><span class="small muted">premium, rebate and fees</span></div>
    <div class="kpi"><span class="eyebrow">Net per household</span><span class="v">${short(y3.net / f)}</span><span class="small muted">before tax and commissions</span></div>
    <div class="kpi"><span class="eyebrow">Loss ratio</span><span class="v">${pct(lossRatio)}</span><span class="small muted">claims ÷ premiums</span></div>
    <div class="kpi"><span class="eyebrow">Acquisition cost</span><span class="v">Not measured</span><span class="small muted">the pilot has to produce it</span></div>
  </div>
</section>

<section class="stack">
  <h2>The three unfair advantages</h2>
  <div class="models">
    <article class="panel adv">
      <h3>Negative working capital: the float</h3>
      <p class="claim">Families pay their subscriptions upfront, so Kibanja holds their money before they consume the goods, and that cash earns interest.</p>
      <div class="figs">
        <span>Premiums held on average</span><span class="v">${short(float)}</span>
        <span>Groceries on credit at any time</span><span class="v">−${short(y3.outstanding)}</span>
        <span class="tot">Cash held minus credit funded</span><span class="v tot" style="color:${nwc < 0 ? 'var(--bad)' : 'var(--ok)'}">${short(nwc)}</span>
      </div>
      <label class="f">Yield on the float <span class="hint">% a year, your assumption</span><input class="in num" type="number" id="float-yield" min="0" step="0.5" value="${ui.floatYield}"></label>
      <p class="small">At ${trim2(ui.floatYield)}% the premiums held would earn about <b class="num">${ugx(floatIncome)}</b> a year.</p>
      <div class="ask"><h4>What diligence will ask</h4>
        <p>Whose balance sheet is the float on? Premiums belong to whoever carries the risk. If a licensed insurer underwrites the cover, the float and its interest sit with them unless the agreement shares investment income.</p>
        <p>${nwc < 0 ? `With ${trim2(M.creditShare)}% of households shopping on credit, Kibanja fronts more in groceries than it holds in premiums. The credit line needs a funder; it does not create float.` : 'Premiums cover the credit line in this scenario, but they are reserved for claims and cannot also fund it.'}</p>
      </div>
    </article>
    <article class="panel adv">
      <h3>The AI data goldmine</h3>
      <p class="claim">The platform records item-level checkout data for every household, down to each family's consumption cycle.</p>
      <div class="figs">
        <span>Households tracked, Year 3</span><span class="v">${f.toLocaleString('en-US')}</span>
        <span>Card spend recorded a year</span><span class="v">${short(f * M.spend * 1e6)}</span>
      </div>
      <div class="ask"><h4>What makes it a moat</h4>
        <p>Nobody else links what a family buys to whether it repays and when it hits a shock. Show the data predicting something that earns money: a missed repayment from a change in the basket, restock timing, supplier-funded offers.</p></div>
      <div class="ask"><h4>What diligence will ask</h4>
        <p>Consent and use. Purchase, health and employment data is personal data under the Data Protection and Privacy Act 2019: get consent at enrolment, use it for stated purposes, and sell suppliers only aggregated insight.</p>
        <p>Scale. ${f.toLocaleString('en-US')} households is a deep panel but a small one next to mobile money operators and large retailers. Pitch the link between spending, repayment and shocks, not the size.</p>
      </div>
    </article>
    <article class="panel adv">
      <h3>Zero-waste vertical integration</h3>
      <p class="claim">Supermarket, AI wallet and an in-house kitchen together: stock near its sell-by date becomes cooked meals, so food waste, the biggest profit killer in retail, falls sharply.</p>
      <div class="ask"><h4>What makes it true</h4>
        <p>A measured number. Run the flagship for six months, record shrinkage against the month before the kitchen opened, and publish it. Card data helps too: knowing when members restock lets the store order closer to demand.</p></div>
      <div class="ask"><h4>What diligence will ask</h4>
        <p>Shrinkage also covers theft, damage and record errors, not only spoilage, so "near zero" will not survive a store visit. Lead with the measured reduction.</p>
        <p>The kitchen adds food-safety licensing, cooks and equipment to the store's costs. Show it pays for itself.</p>
      </div>
    </article>
  </div>
</section>

<section class="stack">
  <h2>10-year geographic expansion</h2>
  <div class="phases">
    <article class="panel phase"><span class="when">Years 1–2</span><h3>Kampala urban</h3>
      <p class="small muted">Launch the core card platform with partner supermarkets, then the flagship store. The Rollout screen has this phase in detail.</p>
      <ul><li>Family app, store till, operations desk</li><li>Underwriter and credit partner signed</li><li>Flagship store, then the first micro-hubs</li></ul>
      <p class="small"><b>Gate to Phase 2:</b> 12 months of claims and repayment data with loss ratio and credit losses inside plan, renewal rate measured, flagship profitable at store level.</p></article>
    <article class="panel phase"><span class="when">Years 3–5</span><h3>Ugandan regional</h3>
      <p class="small muted">Regional cities such as Jinja, Mbarara, Gulu, Mbale and Masaka, plus the farming households around them.</p>
      <ul><li>Micro-hubs supplied from a regional hub store</li><li>Crop and drought cover with agricultural partners</li><li>Offline-capable tills for weaker connectivity</li></ul>
      <p class="small"><b>Gate to Phase 3:</b> unit economics positive in at least two cities outside Kampala, and drought exposure reinsured.</p></article>
    <article class="panel phase"><span class="when">Years 6–10</span><h3>Pan-East Africa</h3>
      <p class="small muted">Kenya, Tanzania and Rwanda, entered one country at a time.</p>
      <ul><li>A local insurer and lender in each country</li><li>Multi-currency, multi-regulator platform</li><li>Data stored according to each country's law</li></ul>
      <p class="small"><b>Watch:</b> insurance, lending, payments and data licences are national. Each country is a new licensing project, not a switch-on.</p></article>
  </div>
</section>

<div class="split">
  <section class="panel"><h3>Raise in the order the evidence arrives</h3>
    <ul class="stages">
      <li><b>Pre-seed · now</b><span class="small">Founders, angels, grants and impact accelerators. Pays for licences, partners, the app and a pilot of up to 1,000 households.</span></li>
      <li><b>Seed · after 12 months</b><span class="small">Impact and Africa-focused early-stage funds. Pitch with real loss ratio, repayment and renewal numbers.</span></li>
      <li><b>Growth · Phase 2</b><span class="small">Growth funds like those named in the pitch (Norrsken, Tiger Global) and regional institutional funds generally invest once revenue and repeat customers are proven. Bring Phase 1 results, not projections.</span></li>
      <li><b>Strategic · any stage</b><span class="small">An insurer or development finance institution taking equity alongside underwriting or a credit facility.</span></li>
    </ul>
  </section>
  <section class="panel"><h3>Data room checklist</h3>
    <ul class="lic">${ROOM.map(([k, b, t]) => `<li><label><input type="checkbox" data-room="${k}" ${dataroom[k] ? 'checked' : ''}><span><b>${b}</b><span class="small muted" style="display:block">${t}</span></span></label></li>`).join('')}</ul>
    <p class="small muted">Your ticks stay in this browser.</p>
  </section>
</div>`;
};

/* ---------- render + actions ---------- */
function render() {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.v === ui.view)));
  $('#main').innerHTML = `<div class="view">${V[ui.view]()}</div>`;
  if (ui.view === 'model') modelOut();
}

function go(v) {
  if (!V[v]) return;
  ui.view = v;
  try { history.replaceState(null, '', '#' + v); } catch {}
  render();
  window.scrollTo(0, 0);
}

function lookup(q) {
  const d = String(q).replace(/\s/g, '').toUpperCase();
  return S.members.find(m => m.card.replace(/\s/g, '') === d || m.id === d || (d.length >= 4 && m.card.replace(/\s/g, '').endsWith(d)));
}

const A = {
  tab: b => go(b.dataset.v),
  reset: () => { S = seed(); Object.assign(ui, { viewAs: 'KSC-0001', claimForm: false, posMember: null, posInput: '', cart: [], receipt: null, opsClaim: 'CLM-0141' }); render(); toast('Example households reset'); },
  'open-claim': () => { ui.claimForm = true; render(); },
  'cancel-claim': () => { ui.claimForm = false; render(); },
  pay: () => {
    const m = member(ui.viewAs), c = m.credit;
    const wasOverdue = m.status === 'overdue';
    c.used = Math.max(0, c.used - c.dueAmt);
    S.txns.push({ d: TODAY, m: m.id, where: 'Repayment · Mobile Money', smart: 0, cash: c.dueAmt, items: 0 });
    c.onTime = wasOverdue ? 0 : c.onTime + 1;
    m.status = 'good';
    c.due = addMonths(wasOverdue ? TODAY : c.due, 1);
    c.dueAmt = c.used ? Math.max(100000, Math.round(c.used / 4 / 1000) * 1000) : 0;
    let msg = wasOverdue ? 'Paid. The card works again.' : `Paid on time (${Math.min(c.onTime, 3)}/3).`;
    if (c.onTime >= 3 && c.essential >= 0.9 && c.rung < LADDER.length - 1) { c.rung++; c.onTime = 0; msg = `Moved up to the ${short(LADDER[c.rung])} rung`; }
    render(); toast(msg);
  },
  'pos-lookup': () => {
    ui.posInput = $('#pos-card').value;
    const m = lookup(ui.posInput);
    if (!m) { toast('No SmartCare card matches that number'); return; }
    ui.posMember = m.id; ui.posInput = m.card; ui.receipt = null; render();
  },
  'pos-pick': b => { const m = member(b.dataset.id); ui.posMember = m.id; ui.posInput = m.card; ui.receipt = null; render(); },
  'pos-clear': () => { ui.posMember = null; ui.posInput = ''; render(); },
  add: b => { ui.receipt = null; const l = ui.cart.find(x => x.sku === b.dataset.sku); l ? l.q++ : ui.cart.push({ sku: b.dataset.sku, q: 1 }); render(); },
  inc: b => { ui.cart.find(x => x.sku === b.dataset.sku).q++; render(); },
  dec: b => { const l = ui.cart.find(x => x.sku === b.dataset.sku); l.q--; if (!l.q) ui.cart = ui.cart.filter(x => x !== l); render(); },
  'clear-cart': () => { ui.cart = []; render(); },
  charge: () => {
    const t = cartTotals(), m = t.m;
    const lines = ui.cart.map(l => { const s = SKUS.find(x => x.sku === l.sku); return { q: l.q, name: s.name, ess: s.ess, amt: s.price * l.q }; });
    const margin = Math.round(lines.reduce((s, l) => s + l.amt * (l.ess ? MARGIN.ess : MARGIN.other), 0));
    if (m && t.smart > 0) {
      if (m.plan === 'A') { m.allowance.month += t.smart; m.allowance.total += t.smart; } else { m.credit.used += t.smart; }
    }
    if (m) S.txns.push({ d: TODAY, m: m.id, where: 'Kibanja Store · Kira', smart: t.smart, cash: t.cash, items: lines.reduce((s, l) => s + l.q, 0) });
    ui.receipt = { no: 'R' + String(4100 + S.txns.length), lines, smart: t.smart, cash: t.cash, margin, card: m && m.card.replace(/\s/g, '') };
    ui.cart = [];
    render(); toast(t.smart ? `${ugx(t.smart)} charged to SmartCare` : 'Paid in cash');
  },
  'new-sale': () => { ui.receipt = null; ui.posMember = null; ui.posInput = ''; render(); },
  'ops-pick': b => { ui.opsClaim = b.dataset.id; render(); },
  verify: b => { const c = S.claims.find(x => x.id === ui.opsClaim); c.checks[+b.dataset.i].r = 'ok'; render(); },
  approve: () => {
    const c = S.claims.find(x => x.id === ui.opsClaim), m = member(c.member);
    c.status = 'approved'; c.decided = TODAY;
    m.status = 'active'; m.allowance = { activated: TODAY, month: 0, total: 0 };
    render(); toast(`${hh(m)}: card unlocked, ${ugx(A_LIMIT / 12)} a month`);
  },
  decline: () => {
    const c = S.claims.find(x => x.id === ui.opsClaim), m = member(c.member);
    c.status = 'declined'; c.decided = TODAY; m.status = 'locked';
    render(); toast(`${c.id} declined. The household is told why in the app.`);
  },
  'model-reset': () => { Object.assign(M, JSON.parse(JSON.stringify(M0))); render(); },
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  A[b.dataset.a] && A[b.dataset.a](b);
});

document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'pos-form') return A['pos-lookup']();
  if (e.target.id === 'claim-form') {
    const m = member(ui.viewAs);
    const type = $('#cl-type').value, note = $('#cl-note').value.trim(), hasFile = $('#cl-file').files.length > 0;
    const inForce = days(m.enrolled, TODAY);
    const checks = [{ t: `Waiting period passed (${WAIT_DAYS} days)`, r: inForce >= WAIT_DAYS ? 'ok' : 'fail', d: `${inForce} days in force` }];
    if (type === 'job') checks.push({ t: 'Termination letter on file', r: hasFile ? 'ok' : 'missing' }, { t: 'NSSF contributions stopped', r: 'todo', d: 'Pull the contribution history' }, { t: 'Employer confirms by phone', r: 'todo', d: 'Call HR on a number the platform finds itself' });
    if (type === 'medical') checks.push({ t: 'Admission note on file', r: hasFile ? 'ok' : 'missing' }, { t: 'Partner hospital confirms admission', r: 'todo' });
    if (type === 'drought') checks.push({ t: 'District on the declared drought list', r: 'todo', d: 'Check against the national weather authority\'s rainfall bulletin' });
    checks.push({ t: 'No other claim this policy year', r: S.claims.some(x => x.member === m.id && x.status === 'approved') ? 'fail' : 'ok' });
    const id = 'CLM-0' + (142 + S.claims.length - 2);
    S.claims.push({ id, member: m.id, type, filed: TODAY, status: 'pending', note, checks });
    m.status = 'review'; ui.claimForm = false; ui.opsClaim = id;
    render(); toast(`Claim ${id} sent. Operations can see it now.`);
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'view-as') { ui.viewAs = e.target.value; ui.claimForm = false; render(); }
  if (e.target.dataset.lic) { licences[e.target.dataset.lic] = e.target.checked; store.set('ksc-licences', licences); }
  if (e.target.dataset.room) { dataroom[e.target.dataset.room] = e.target.checked; store.set('ksc-dataroom', dataroom); }
  if (e.target.id === 'float-yield') { const v = parseFloat(e.target.value); ui.floatYield = isFinite(v) && v >= 0 ? v : 0; render(); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'pos-card') ui.posInput = e.target.value;
  if (!e.target.closest('#model-form')) return;
  const num = id => { const v = parseFloat($('#' + id).value); return isFinite(v) && v >= 0 ? v : 0; };
  M.fam = [0, 1, 2].map(i => Math.max(1, num('fam' + i)));
  M.ops = [0, 1, 2].map(i => num('ops' + i));
  ['premium', 'limit', 'claimRate', 'avgDraw', 'spend', 'creditShare', 'rebatePct', 'feePct', 'lossPct', 'cofPct'].forEach(k => M[k] = num(k));
  modelOut();
});

const start = (location.hash || '').slice(1);
ui.view = V[start] ? start : 'overview';
render();
</script>
