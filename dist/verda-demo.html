<title>Verda EHS Platform</title>
<style>
/* Verda — theme system & layout */

:root, :root[data-theme="forest"] {
  --brand-1: #1f7a4d;
  --brand-2: #2fa66a;
  --brand-3: #eaf7ef;
  --solid-1: var(--brand-1);
  --solid-2: var(--brand-2);
  --accent: #d97706;
  --bg: #f4f7f4;
  --surface: #ffffff;
  --text: #16241c;
  --muted: #5b6b61;
  --border: #dde7e0;
  --warn: #c0392b;
  --shadow-sm: 0 1px 2px rgba(20, 40, 30, .06), 0 1px 1px rgba(20, 40, 30, .04);
  --shadow-md: 0 6px 16px rgba(20, 40, 30, .08), 0 2px 6px rgba(20, 40, 30, .05);
  --shadow-lg: 0 16px 40px rgba(20, 40, 30, .16), 0 4px 12px rgba(20, 40, 30, .08);
  --ring: rgba(31, 122, 77, .28);
}
:root[data-theme="ocean"] {
  --brand-1: #0b6e8f;
  --brand-2: #2aa3c0;
  --brand-3: #e7f6fa;
  --solid-1: var(--brand-1);
  --solid-2: var(--brand-2);
  --accent: #f59e0b;
  --bg: #f2f8fa;
  --surface: #ffffff;
  --text: #0e2630;
  --muted: #4f6b74;
  --border: #d7e9ee;
  --warn: #c0392b;
  --shadow-sm: 0 1px 2px rgba(10, 40, 55, .07), 0 1px 1px rgba(10, 40, 55, .04);
  --shadow-md: 0 6px 16px rgba(10, 40, 55, .09), 0 2px 6px rgba(10, 40, 55, .05);
  --shadow-lg: 0 16px 40px rgba(10, 40, 55, .18), 0 4px 12px rgba(10, 40, 55, .09);
  --ring: rgba(11, 110, 143, .28);
}
:root[data-theme="amber"] {
  --brand-1: #b45309;
  --brand-2: #e8880c;
  --brand-3: #fdf1e0;
  --solid-1: var(--brand-1);
  --solid-2: var(--brand-2);
  --accent: #1f7a4d;
  --bg: #faf6ef;
  --surface: #ffffff;
  --text: #2a1c0d;
  --muted: #7a6650;
  --border: #efe0c9;
  --warn: #b91c1c;
  --shadow-sm: 0 1px 2px rgba(60, 35, 5, .07), 0 1px 1px rgba(60, 35, 5, .04);
  --shadow-md: 0 6px 16px rgba(60, 35, 5, .10), 0 2px 6px rgba(60, 35, 5, .05);
  --shadow-lg: 0 16px 40px rgba(60, 35, 5, .18), 0 4px 12px rgba(60, 35, 5, .09);
  --ring: rgba(180, 83, 9, .28);
}
:root[data-theme="slate"] {
  --brand-1: #8fa6bd;
  --brand-2: #a9bbcf;
  --brand-3: #24344a;
  --solid-1: #3b5573;
  --solid-2: #4d7396;
  --accent: #38bdf8;
  --bg: #0c1420;
  --surface: #16202f;
  --text: #e6edf3;
  --muted: #93a2b5;
  --border: #2a3a51;
  --warn: #f87171;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, .38);
  --shadow-lg: 0 20px 48px rgba(0, 0, 0, .5);
  --ring: rgba(56, 189, 248, .35);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { line-height: 1.25; letter-spacing: -.01em; }
h1 { font-size: 1.7rem; font-weight: 800; }
h3 { font-size: 1.02rem; font-weight: 700; }
p { line-height: 1.55; }

a { color: var(--brand-1); }
::selection { background: var(--ring); }

.icon { width: 18px; height: 18px; flex-shrink: 0; }

/* ---- Illustrations (original flat-style SVG art) ---- */
.illus { width: 100%; height: 110px; display: block; }
.illus-fill-1 { fill: var(--brand-1); }
.illus-fill-2 { fill: var(--brand-2); }
.illus-fill-3 { fill: var(--brand-3); }
.illus-fill-accent { fill: var(--accent); }
.illus-fill-muted { fill: var(--muted); }
.illus-fill-surface { fill: var(--surface); }

.focus-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-bottom: 20px; }
@media (max-width: 1400px) { .focus-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 900px) { .focus-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .focus-grid { grid-template-columns: 1fr; } }
.focus-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 14px 16px;
  box-shadow: var(--shadow-sm); text-decoration: none; color: var(--text);
  display: block; transition: box-shadow .16s ease, transform .16s ease;
}
.focus-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.focus-card h4 { margin: 12px 0 4px; font-size: .92rem; }
.focus-card p { margin: 0; }

/* ---- Page header: title/lead beside a module illustration ---- */
.page-header {
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
  background: linear-gradient(120deg, var(--brand-3), transparent 70%);
  border: 1px solid var(--border); border-radius: 16px;
  padding: 18px 24px; margin-bottom: 20px;
}
.page-header-text { min-width: 0; }
.page-header-text h1 { margin: 0 0 6px; }
.page-header-text p { margin: 0; max-width: 62ch; }
.page-header-illus { width: 150px; height: 92px; flex-shrink: 0; }
@media (max-width: 780px) { .page-header-illus { display: none; } }

.iec-cat-header { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
.iec-cat-illus { width: 64px; height: 44px; flex-shrink: 0; }
.iec-cat-header h3 { margin: 0; }

.solution-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

/* ---- Wide tables scroll in their own container, never the page body ---- */
.table-scroll { overflow-x: auto; min-width: 0; }
.table-scroll .table { min-width: 640px; }
.table-scroll input { min-width: 84px; }

/* ---- Pricing plans ---- */
.plan-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; align-items: stretch; }
@media (max-width: 1200px) { .plan-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 620px) { .plan-grid { grid-template-columns: 1fr; } }
.plan-card {
  position: relative; display: flex; flex-direction: column; gap: 4px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 20px; box-shadow: var(--shadow-sm);
}
.plan-featured { border-color: var(--brand-2); box-shadow: var(--shadow-md); }
.plan-flag {
  position: absolute; top: -11px; left: 20px; background: var(--solid-1); color: #fff;
  font-size: .68rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 999px;
}
.plan-card h3 { margin: 4px 0 2px; }
.plan-price { font-size: 1.9rem; font-weight: 800; color: var(--brand-1); letter-spacing: -.02em; }
.plan-per { font-size: .82rem; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.plan-seats { margin: 0 0 8px; }
.plan-pitch { font-size: .88rem; margin: 0 0 8px; }
.plan-features { flex: 1; margin-bottom: 14px; }
.plan-features li { font-size: .85rem; }
.plan-card .btn { width: 100%; justify-content: center; }

/* ---- Notice card: a caveat that must not read as decoration ---- */
.notice-card { border-left: 4px solid var(--accent); background: var(--brand-3); }
.notice-card p { margin: 6px 0 0; }

/* ---- Sector grid ---- */
.sector-groups { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
@media (max-width: 900px) { .sector-groups { grid-template-columns: 1fr; } }
.sector-group { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow-sm); }
.sector-group-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.sector-group-illus { width: 72px; height: 48px; flex-shrink: 0; }
.sector-group-title { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
.sector-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.sector-chip {
  border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer;
  padding: 6px 12px; border-radius: 999px; font-size: .82rem; font-weight: 600; font-family: inherit;
  transition: all .14s ease;
}
.sector-chip:hover { background: var(--brand-3); border-color: var(--brand-2); }

/* ---- Status badges ----
   Doubled class (.badge.badge-x) so these win over the base .badge rule
   regardless of source order. Every status badge carries its own label,
   so color never has to be read on its own. */
.badge.badge-good { background: rgba(12, 163, 12, .16); color: #0a7d0a; }
.badge.badge-warning { background: rgba(250, 178, 25, .24); color: #8a6000; }
.badge.badge-serious { background: rgba(236, 131, 90, .24); color: #a54a22; }
.badge.badge-critical { background: rgba(208, 59, 59, .16); color: #b02a2a; }
:root[data-theme="slate"] .badge.badge-good { color: #4ed24e; }
:root[data-theme="slate"] .badge.badge-warning { color: #fab219; }
:root[data-theme="slate"] .badge.badge-serious { color: #ec835a; }
:root[data-theme="slate"] .badge.badge-critical { color: #f08585; }
.row-overdue { background: color-mix(in srgb, #d03b3b 7%, transparent); }

/* ---- Charts ----
   Categorical slot 1 and the fixed status palette from the validated
   reference palette; dark steps applied under the Slate theme. */
:root { --chart-1: #2a78d6; --chart-2: #eb6834; --chart-3: #1baf7a; --chart-good: #0ca30c; --chart-warning: #fab219; --chart-serious: #ec835a; --chart-critical: #d03b3b; }
:root[data-theme="slate"] { --chart-1: #3987e5; --chart-2: #d95926; --chart-3: #199e70; }
/* max-width keeps type at a sane size when a chart sits in a full-width card */
.chart { width: 100%; max-width: 560px; height: auto; display: block; margin-top: 6px; }
.chart-axis { stroke: var(--border); stroke-width: 1; }
.chart-value { font-size: 13px; font-weight: 700; text-anchor: middle; fill: var(--text); }
.chart-label { font-size: 12px; text-anchor: middle; fill: var(--muted); }
.chart-table { margin-top: 8px; }
.chart-table summary { cursor: pointer; font-size: .82rem; color: var(--muted); }

/* ---- Chart figure: title, legend, data table ----
   A single series needs no legend (the title names it); two or more always
   carry one, and every bar is directly value-labelled, so identity and
   magnitude are never colour-alone. */
.chart-figure { margin: 0; }
.chart-title { font-weight: 700; font-size: .88rem; margin: 12px 0 2px; }
.chart-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin: 2px 0 6px; }
.chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.chart-empty { margin: 8px 0 0; font-style: italic; }
.chart-slot { margin-top: 10px; }

/* ---- Four-step "how to" card ---- */
.steps { margin: 6px 0 14px; padding-left: 22px; }
.steps li { margin: 7px 0; font-size: .88rem; line-height: 1.5; }
.switch { display: flex; align-items: center; gap: 9px; margin: 0; font-size: .85rem; color: var(--text); font-weight: 600; }
.switch input { width: auto; margin: 0; }

/* ---- Section pickers ---- */
.seg-toggle-actions { display: flex; gap: 8px; margin-bottom: 8px; }
.seg-toggle {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 9px; align-items: start;
  padding: 7px 9px; border-radius: 9px; border: 1px solid transparent; margin: 2px 0;
}
.seg-toggle:hover { background: var(--brand-3); }
.seg-toggle input { grid-row: span 2; margin-top: 2px; }
.seg-toggle-label { font-weight: 600; }
.seg-toggle .small { grid-column: 2; }
.seg-filled { border-color: var(--brand-2); background: var(--brand-3); }

/* ---- Guided mode help ---- */
.guide-box {
  border-left: 4px solid var(--brand-2); background: var(--brand-3);
  border-radius: 0 10px 10px 0; padding: 12px 16px; margin: 10px 0 16px;
}
.guide-box p { margin: 4px 0; font-size: .86rem; }
.guide-box summary { cursor: pointer; font-size: .84rem; font-weight: 600; color: var(--brand-1); margin-top: 6px; }
.guide-example { font-style: italic; }

/* ---- Data-entry tables ---- */
.seg-form { margin-bottom: 22px; }
.seg-form h5 { margin: 18px 0 4px; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.report-table { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin: 10px 0 16px; background: var(--bg); }
.report-table-head h5 { margin: 0 0 2px; text-transform: none; letter-spacing: 0; font-size: .92rem; color: var(--text); }
.entry-table { min-width: 640px; }
.entry-table th, .entry-table td { padding: 5px 6px; vertical-align: middle; }
.entry-table input, .entry-table select { margin: 0; padding: 6px 8px; font-size: .84rem; min-width: 92px; }
.entry-table input[type="number"] { min-width: 76px; }
.entry-table tbody tr:hover { background: transparent; }
.row-actions { white-space: nowrap; }
.row-actions .btn { padding: 4px 9px; }

/* A computed cell: carried forward from the previous period, not typed. */
.cell-computed { background: var(--brand-3); font-weight: 700; cursor: not-allowed; }
.carry-note { margin: 6px 0 0; }

/* ---- Photo drop zone ---- */
.dropzone {
  border: 2px dashed var(--border); border-radius: 12px; padding: 18px; text-align: center;
  cursor: pointer; transition: border-color .15s ease, background-color .15s ease; background: var(--bg);
}
.dropzone:hover, .dropzone:focus-visible { border-color: var(--brand-2); background: var(--brand-3); outline: none; }
.dropzone-active { border-color: var(--brand-1); background: var(--brand-3); }
.dropzone p { margin: 2px 0; font-size: .86rem; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-top: 12px; }
.photo-card { margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px; }
.photo-card img { width: 100%; height: 130px; object-fit: cover; border-radius: 7px; display: block; }
.photo-card figcaption { font-size: .78rem; color: var(--muted); margin-top: 5px; }
.photo-caption { margin-top: 6px; padding: 5px 8px; font-size: .8rem; }

/* ---- Generated report preview ---- */
.report-preview { max-height: 620px; overflow: auto; border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; background: var(--bg); }
.report-doc h1 { font-size: 1.35rem; margin: 0 0 12px; }
.report-section h3 { margin: 26px 0 6px; border-bottom: 2px solid var(--border); padding-bottom: 5px; }
.report-section h4 { margin: 14px 0 3px; font-size: .92rem; }
.kv-table th { width: 34%; color: var(--muted); font-weight: 600; }
.report-photos .photo-card img { height: 150px; }

/* ---- Risk matrix ---- */
.risk-matrix { border-collapse: separate; border-spacing: 3px; width: 100%; }
.risk-matrix th { font-size: .75rem; color: var(--muted); font-weight: 700; width: 16%; text-align: center; }
.risk-cell {
  text-align: center; font-weight: 800; font-size: .9rem; color: #fff;
  border-radius: 7px; height: 38px;
}
.risk-good { background: #0ca30c; }
.risk-warning { background: #fab219; color: #4a3600; }
.risk-serious { background: #ec835a; }
.risk-critical { background: #d03b3b; }

/* ---- Top bar ---- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20; box-shadow: var(--shadow-sm);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.18rem; letter-spacing: -.01em; }
.brand .logo {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(135deg, var(--solid-1), var(--solid-2));
  display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800;
  box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.25);
}
.topbar-right { display: flex; align-items: center; gap: 10px; }
.topbar-right select {
  padding: 7px 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font-size: .85rem; cursor: pointer; transition: border-color .15s ease;
}
.topbar-right select:hover { border-color: var(--brand-2); }
#topbar-credits {
  display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 700; color: var(--brand-1);
  background: var(--brand-3); padding: 6px 12px; border-radius: 999px;
}
#topbar-credits[hidden] { display: none; }
#topbar-credits .icon { width: 15px; height: 15px; }
#topbar-auth { display: flex; gap: 8px; align-items: center; }

/* ---- Layout ---- */
.layout { display: flex; min-height: calc(100vh - 58px); }
#sidebar {
  width: 258px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
  padding: 16px 12px; overflow-y: auto;
}
.nav-group { margin-bottom: 20px; }
.nav-group-title {
  font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
  padding: 4px 10px; font-weight: 800;
}
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; text-decoration: none; color: var(--text);
  font-size: .89rem; font-weight: 500; margin: 2px 0; transition: background-color .12s ease, color .12s ease;
  border-left: 3px solid transparent;
}
.nav-item .icon { opacity: .65; transition: opacity .12s ease; }
.nav-item:hover { background: var(--brand-3); }
.nav-item.active { background: var(--solid-1); color: #fff; font-weight: 700; border-left-color: var(--accent); box-shadow: var(--shadow-sm); }
.nav-item.active .icon { opacity: 1; }

/* min-width:0 is required: #main is a flex item, so without it the item
   refuses to shrink below the min-content width of its widest descendant —
   a wide data-entry table then stretches the whole page instead of scrolling
   inside its own container. */
#main { flex: 1; min-width: 0; padding: 26px 30px; max-width: 1120px; }

/* ---- Narrow screens ----
   Signed in, the top bar carries a credits pill, two selects, a user name and
   a logout button: at phone width that row has to wrap rather than push the
   page sideways. */
@media (max-width: 620px) {
  .topbar { flex-wrap: wrap; gap: 8px; padding: 10px 14px; }
  .topbar-right { flex-wrap: wrap; justify-content: flex-end; row-gap: 8px; }
  #main { padding: 18px 16px; }
  .hero { padding: 24px 18px; }
}

/* ---- Hero ---- */
.hero {
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, var(--solid-1), var(--solid-2));
  color: #fff; padding: 34px 32px; border-radius: 18px; margin-bottom: 22px; box-shadow: var(--shadow-lg);
}
.hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(circle at 88% -10%, rgba(255,255,255,.22), transparent 45%),
    radial-gradient(circle at 100% 100%, rgba(255,255,255,.12), transparent 40%);
}
.hero h1 { margin: 0 0 8px; font-size: 1.9rem; position: relative; }
.hero p { position: relative; opacity: .95; }
.hero-actions { margin-top: 16px; display: flex; gap: 10px; position: relative; }
.hero .btn-primary { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.4); backdrop-filter: blur(2px); }
.hero .btn-ghost { color: #fff; border-color: rgba(255,255,255,.5); }

/* ---- Grid / cards ---- */
.grid { display: grid; gap: 18px; margin-bottom: 20px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } #sidebar { display: none; } }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; margin-bottom: 18px;
  box-shadow: var(--shadow-sm); transition: box-shadow .16s ease, transform .16s ease;
}
.card h3 { margin-top: 0; }
.stat { font-size: 2.1rem; font-weight: 800; color: var(--brand-1); letter-spacing: -.02em; }
.stat.warn { color: var(--warn); }
.muted { color: var(--muted); }
.small { font-size: .82rem; }

.stat-card { display: flex; gap: 14px; align-items: flex-start; }
.stat-icon {
  width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  background: var(--brand-3); color: var(--brand-1);
}
.stat-icon-warn { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.stat-icon .icon { width: 21px; height: 21px; }
.stat-label { font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
.stat-body p { margin: 4px 0 0; }

/* ---- Forms ---- */
label { display: block; margin: 12px 0; font-size: .85rem; font-weight: 600; color: var(--muted); }
input, select, textarea {
  width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font-size: .92rem; margin-top: 5px; font-family: inherit;
  transition: border-color .14s ease, box-shadow .14s ease;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--brand-2); box-shadow: 0 0 0 3px var(--ring);
}
textarea { min-height: 74px; resize: vertical; }
.form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.form-row > * { flex: 1; min-width: 140px; }

/* ---- Buttons ---- */
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); cursor: pointer; font-size: .89rem; font-weight: 600; text-decoration: none;

.btn .icon { width: 17px; height: 17px; }

.btn-sm { padding: 6px 12px; font-size: .8rem; }
.quick-actions { display: flex; flex-direction: column; gap: 9px; }
.quick-actions .btn { justify-content: flex-start; }

.table { width: 100%; border-collapse: collapse; margin-top: 10px; }
.table th, .table td { text-align: left; padding: 10px 12px; font-size: .87rem; }
.table thead th { color: var(--muted); font-weight: 700; font-size: .74rem; text-transform: uppercase; letter-spacing: .03em; border-bottom: 2px solid var(--border); }
.table tbody tr { border-bottom: 1px solid var(--border); transition: background-color .1s ease; }
.table tbody tr:hover { background: var(--brand-3); }
.table tbody tr:last-child { border-bottom: none; }

/* ---- Segments / checklists ---- */
/* Report sections render as cards (see the reporting block above); the old
   tinted-strip styling is gone, only the checklist inputs stay generic. */
.checklist-group { border: none; padding: 0; margin: 12px 0; }
.seg-toggle input { width: auto; }
.checklist { list-style: none; padding: 0; }
.checklist li { padding: 7px 0; border-bottom: 1px dashed var(--border); }
.checklist label { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 500; margin: 0; }
.checklist input { width: auto; }

/* ---- Structured report inputs ----
   The numeric returns a section's KPI tables ask for, laid out compactly so
   a long section doesn't become a column of full-width boxes. */
.field-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 14px; margin: 10px 0 14px; }
@media (max-width: 900px) { .field-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .field-grid { grid-template-columns: 1fr; } }

.seg-form h4 { margin: 0 0 2px; }
.seg-form .field-grid label { color: var(--muted); }

.badge { display: inline-block; padding: 3px 11px; border-radius: 999px; background: var(--brand-3); color: var(--brand-1); font-size: .74rem; font-weight: 700; }

/* ---- Tabs ---- */
.tabs { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
.tab-btn {
  padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text);

.tab-btn.active { background: var(--solid-1); color: #fff; border-color: var(--solid-1); box-shadow: var(--shadow-sm); }

/* ---- Audit rows ---- */
.audit-row { display: grid; grid-template-columns: 2fr 1fr 1.4fr; gap: 10px; align-items: center; margin: 10px 0; }

/* ---- Records / gallery ---- */
.record-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.record-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-sm); transition: box-shadow .16s ease; }

/* ---- Matterport frame ---- */

/* ---- Modal ---- */

  // ---- IEC materials (free, Verda-authored) -----------------------------
  iecMaterials: [
    { category: "Safety", title: "PPE Awareness — Key Points", body:
`PPE AWARENESS — KEY POINTS (Verda IEC Series)

1. Wear the PPE assigned for your specific task — not "any" PPE.
2. Inspect PPE before each use; damaged PPE must be replaced, not repaired informally.
3. Store PPE clean and dry; contaminated PPE should be decontaminated or discarded per site rules.
4. Report lost or damaged PPE to your supervisor immediately.
5. PPE is the last line of defence — it does not replace safe work procedures.
6. Never remove required PPE to "work faster." Report barriers to PPE use so they can be fixed.` },
    { category: "Safety", title: "Fire Safety — Do's and Don'ts", body:
`FIRE SAFETY — DO'S AND DON'TS (Verda IEC Series)

DO
- Know the location of your nearest fire extinguisher and assembly point.
- Keep fire exits and extinguisher access clear at all times.
- Report damaged electrical wiring or overloaded sockets.
- Participate in fire drills.

DON'T
- Don't store flammable materials near ignition sources or exits.
- Don't prop open fire doors.
- Don't attempt to fight a fire beyond your training — evacuate and raise the alarm.` },
    { category: "Environment", title: "Waste Segregation Guide", body:
`WASTE SEGREGATION GUIDE (Verda IEC Series)

Separate waste at the point of generation into:
- General/non-hazardous waste (bin: black)
- Recyclables — paper, plastic, metal (bin: green)
- Hazardous waste — chemicals, oils, contaminated materials (bin: red, labelled)
- Organic/biodegradable waste (bin: brown)

Hazardous waste must be stored in a bunded, covered area and handed only to a
licensed waste transporter. Keep waste transfer records for every collection.` },
    { category: "Social", title: "Community Grievance — What to Know", body:
`COMMUNITY GRIEVANCE REDRESS — WHAT TO KNOW (Verda IEC Series)

- Community members have the right to raise concerns about site operations.
- Grievances should be logged, acknowledged, and given a reference number.
- Investigate and respond within the timeframe committed in your ESMP.
- Keep the grievance log available for audit and regulator review.
- No community member should face any form of retaliation for raising a concern.` },
    { category: "Environment", title: "GHG & Climate Awareness Basics", body:
`GHG & CLIMATE AWARENESS BASICS (Verda IEC Series)

- Greenhouse gases (GHGs) from a site typically come from fuel combustion,
  electricity use, process emissions, and vehicle fleets.
- Simple reduction actions: fix leaks, maintain equipment, switch off idle
  machinery, monitor fuel/electricity use monthly, and track against a baseline.
- Keeping basic activity data (litres of fuel, kWh of power) is the first step
  toward any future GHG inventory or reporting requirement.` },
    { category: "Health", title: "Basic First Aid — Response Priorities", body:
`BASIC FIRST AID — RESPONSE PRIORITIES (Verda IEC Series)

1. Ensure the scene is safe before approaching.
2. Check responsiveness and breathing; call for emergency help.
3. Control severe bleeding with direct pressure.
4. Do not move a person with a suspected spinal injury unless there is
   immediate danger.
5. Keep the first aid kit stocked and know who your trained first aiders are.` }
  ],

  // ---- Plain-English section guidance ---------------------------------------
  // Shown in Guided mode: what a section is for, how to fill it, and example
  // wording. The example is guidance to read, never text the app inserts —
  // a compliance report must say what actually happened on the user's site.
  sectionGuide: {
    "safety": {
      "what": "Shows whether people are getting hurt and what you did about it.",
      "how": "Log every incident and near-miss, even ones with no injury. Fill the training table from your attendance sheets. If nothing happened, leave the log empty — that reports zero, it doesn't look like you forgot.",
      "example": "Two near-misses were recorded and both investigated within 48 hours. PPE spot-checks found 3 non-compliances, each closed the same day. 42 workers attended the revised lockout/tagout briefing."
    },
    "security": {
      "what": "Security incidents, drills and the conduct of security personnel.",
      "how": "Use the format's own columns — management of the incident, outcome, lessons learnt, action required. Drills and VPSHR training belong in the second table.",
      "example": "One incident of vandalism to site sanitation was reported to police and remains under investigation. Patrol frequency was increased and an access-control briefing was delivered to five guards."
    },
    "environment": {
      "what": "Your monitoring results against the limits in your permit.",
      "how": "A result without its limit can't be assessed, so fill both. Use the status column honestly — 'Above limit' with an action beside it reads far better than a missing row.",
      "example": "Effluent BOD measured 28 mg/l against a 50 mg/l permit limit. Dust deposition at the northern boundary exceeded the limit once; water bowser frequency was doubled and the repeat reading was compliant."
    },
    "ghg": {
      "what": "Your energy and fuel use, converted to carbon.",
      "how": "Take quantities from invoices and fuel logs — not estimates. If you don't have an emission factor yet, leave CO₂e blank; the quantity alone is still useful and shows a baseline.",
      "example": "Grid electricity 25,656 kWh and 14,200 litres of diesel. Generator hours fell 18% after the grid connection at the main camp. No reduction target is set yet; a baseline year is being established."
    },
    "community": {
      "what": "What the people around your site said, and what you did about it.",
      "how": "Log every grievance, including ones you disagree with — unlogged complaints are the single most common audit finding. Record the closure date, not just the status.",
      "example": "Four grievances were received: three about dust on the access road and one about water scarcity. Three closed within the 14-day commitment; the water grievance was referred to the district and remains open."
    },
    "permitting": {
      "what": "Proof that you are legally allowed to operate.",
      "how": "List every permit the site depends on, with its certificate number and expiry. Anything expiring within 90 days belongs in your management comment with a named owner.",
      "example": "All seven permits are valid. The effluent discharge permit expires in 74 days; the renewal application was lodged on the 8th and acknowledgement received."
    },
    "ps1": {
      "what": "PS1 is the umbrella: can you identify your E&S risks and manage them?",
      "how": "List risks and the measure managing each one, with an owner. Reviewers check whether measures are actually effective, so use 'Partially effective' where that is the truth.",
      "example": "The ESMS was reviewed in month. Of 14 management measures, 11 are effective, 2 partially effective (dust suppression at the crusher, sub-contractor induction tracking) and 1 not yet implemented."
    },
    "ps2": {
      "what": "Working conditions for everyone on site, including people you don't employ directly.",
      "how": "Contracted and supply-chain workers must appear separately — that is the part most reports miss. Include the worker grievance mechanism numbers.",
      "example": "498 workers: 134 direct, 364 contracted. Nine worker grievances received, seven closed. Two sub-contractors were found paying below the agreed rate and have rectified with back-pay verified."
    },
    "ps3": {
      "what": "Resource efficiency and pollution prevention — what you consume and what you release.",
      "how": "Put the prior period beside this one so the trend is visible. That comparison is what makes the section useful rather than a list.",
      "example": "Water abstraction fell from 1,820 to 1,353 m³ after the access road was sealed. Hazardous waste rose to 4.2 m³ following a workshop clean-out; all transferred to a licensed handler with transfer notes retained."
    },
    "ps4": {
      "what": "Risks your operations create for people outside the fence.",
      "how": "Think traffic, dust, noise, blasting, water, and the conduct of your security personnel. Record drills — emergency preparedness is half of PS4.",

<script>
/* Verda AI Assist — drafting engine.
   -----------------------------------------------------------------------
   HONEST NOTE ON HOW THIS WORKS:
   Verda is a static, no-backend app. A real live call to the Claude API
   requires a server-side proxy so the API key is never exposed in the
   browser — that backend doesn't exist yet. Everything in this file is a
   deterministic, rule-based drafting engine that turns structured form
   input into readable prose, in the same shape a Claude-drafted report
   would take. It is intentionally isolated behind the functions below
   (generateAIDraft, generateAuditSummary, suggestSkills) so that wiring in
   a real POST to a Claude API backend later is a one-function swap, not a
   rewrite.
   ----------------------------------------------------------------------- */

const VerdaAI = (() => {

  /* Every framework's sections are now rendered from structured input —
     the tables, numeric returns and narrative blocks the user actually filled
     in. There are deliberately no per-segment prose templates: a template
     that prints "0 incidents, PPE compliance N/A" from fields nobody filled
     is inventing a compliance position, which is the one thing a report of
     this kind must never do. */

  // Renders one section's numeric/text returns as an aligned KPI block, so
  // the figures a reviewer checks first sit above the narrative.
  function returnsBlock(inputs, fieldDefs) {
    const defs = fieldDefs || [];
    const rows = defs
      .filter(f => inputs && inputs[f.key] !== undefined && String(inputs[f.key]).trim() !== "")
      .map(f => ({ label: f.label + (f.unit ? ` (${f.unit})` : ""), value: String(inputs[f.key]).trim() }));
    if (!rows.length) return "";
    const w = Math.max(...rows.map(r => r.label.length));
    return rows.map(r => `  ${r.label.padEnd(w)} : ${r.value}`).join("\n") + "\n";
  }

  // Renders one data table as fixed-width text, so the plain-text report
  // carries the same rows as the HTML one (a text report is what gets pasted
  // into an email or a regulator's portal).
  function textTable(tableDef, rows) {
    const cols = tableDef.columns.filter(c => rows.some(r => String(r[c.key] ?? "").trim()));
    if (!cols.length) return "";
    const header = cols.map(c => c.label + (c.unit ? ` (${c.unit})` : ""));
    const body = rows.map(r => cols.map(c => String(r[c.key] ?? "").replace(/\s+/g, " ").trim()));
    const w = header.map((hd, i) => Math.min(34, Math.max(hd.length, ...body.map(b => b[i].length))));
    const line = (cells) => "  " + cells.map((v, i) =>
      (v.length > w[i] ? v.slice(0, w[i] - 1) + "…" : v).padEnd(w[i])).join("  ").replace(/\s+$/, "");
    return `\n  ${tableDef.title}\n${line(header)}\n  ${w.map(n => "-".repeat(n)).join("  ")}\n` +
      body.map(line).join("\n") + "\n";
  }

  function tablesBlock(tables, tableDefs) {
    if (!tables || !tableDefs) return "";
    return tableDefs.map(t => {
      const rows = tables[t.id];
      return (rows && rows.length) ? textTable(t, rows) : "";
    }).join("");
  }

  // A section under a framework that declares its own narrative blocks
  // (e.g. ESSR: monthly updates / cumulative KPI / management comment).
  function sectionWithBlocks(def, data, blocks, tableDefs) {
    const d = data || {};
    let out = `${def.label}\n${"-".repeat(Math.min(def.label.length, 71))}\n`;
    const returns = returnsBlock(d.inputs, def.fields);
    if (returns) out += `Returns for the period:\n${returns}`;
    const tables = tablesBlock(d.tables, tableDefs);
    if (tables) out += tables;
    const photos = (d.photos || []).length;
    let anyNarrative = false;
    blocks.forEach(b => {
      const text = (d[b.key] || "").trim();
      if (text) { anyNarrative = true; out += `\n${b.label}:\n${text}\n`; }
    });
    if (!anyNarrative && !tables) {
      // The ESSR convention: where nothing has changed since the previous
      // period, that is reported explicitly rather than left blank.
      if (returns) {
        out += `\n${blocks[blocks.length - 1].label}: No change to report for this period beyond the returns above.\n`;
      } else if (photos) {
        out += `\nPhotographs are attached for this section but no narrative has been written. Describe what they show before this report is issued.\n`;
      } else {
        out += `\nNo change to report for this period. Confirm before issue — a section left blank is a finding at review.\n`;
      }
    }
    if (photos) out += `\n  [${photos} photograph(s) attached to this section — see the full report.]\n`;
    return out;
  }

  function generateAIDraft({ clientName, period, segments, segmentData, standardTitle, segmentDefs, blocks, header, headerDefs, tableDefs }) {
    const defs = segmentDefs || [];
    const defFor = (id) => defs.find((x) => x.id === id) || { id, label: id[0].toUpperCase() + id.slice(1) };
    const labelFor = (id) => defFor(id).label;
    const hdr = header || {};

    // Framework-specific header lines (ESSR: document no., version, project,
    // distribution list) sit above the standard client/period block.
    const extraHeader = (headerDefs || [])
      .filter(f => (hdr[f.key] || "").trim())
      .map(f => `${f.label}: ${hdr[f.key].trim()}`)
      .join("\n");

    const head =
`${standardTitle || "VERDA REPORTING"}
${extraHeader ? extraHeader + "\n" : ""}Client: ${clientName || "—"}
Reporting Period: ${period || "—"}
Sections included: ${segments.map(labelFor).join("; ")}
Generated: ${new Date().toISOString().slice(0, 10)}
-----------------------------------------------------------------------`;

    // A framework that declares narrative blocks gets the structured
    // section renderer; the modular segments keep their bespoke templates.
    const tablesFor = (id) => (tableDefs || {})[id] || null;
    const useBlocks = Array.isArray(blocks) && blocks.length > 1;
    const body = segments.map(id => useBlocks
      ? sectionWithBlocks(defFor(id), segmentData[id] || {}, blocks, tablesFor(id))
      : sectionWithBlocks(defFor(id), segmentData[id] || {}, blocks || [{ key: "notes", label: "Notes" }], tablesFor(id))
    ).join("\n");

    const summary =
`\nSUMMARY\nThis report was compiled from the ${segments.length} selected section(s) above. ` +
`Review each section, add any site-specific context, and forward for sign-off before submission.`;

    return `${head}\n\n${body}${summary}`;
  }

  function generateEsiaDraft({ projectName, sections }) {
    const header =
`TERMS OF REFERENCE / ESIA REPORT DRAFT
Project: ${projectName || "—"}
Generated: ${new Date().toISOString().slice(0, 10)}
-----------------------------------------------------------------------\n`;
    const body = sections.map(s => `${s.title}\n${s.text && s.text.trim() ? s.text.trim() : "[Not yet completed — add input for this section.]"}`).join("\n\n");
    return header + body;
  }

  function generateAuditSummary({ industry, findings }) {
    const nonCompliant = findings.filter(f => f.status === "Non-Compliant");
    const compliant = findings.filter(f => f.status === "Compliant");
    const na = findings.filter(f => f.status === "N/A");

    let text =
`EHS AUDIT FINDINGS SUMMARY\nIndustry checklist: ${industry}\nGenerated: ${new Date().toISOString().slice(0, 10)}\n` +
`-----------------------------------------------------------------------\n` +
`Items reviewed: ${findings.length}  |  Compliant: ${compliant.length}  |  Non-Compliant: ${nonCompliant.length}  |  N/A: ${na.length}\n\n`;

    if (nonCompliant.length === 0) {
      text += "No non-compliant items were identified in this audit. Maintain current controls and re-audit at the next scheduled interval.\n";
    } else {
      text += "NON-COMPLIANT ITEMS & RECOMMENDED CORRECTIVE ACTIONS:\n";
      text += nonCompliant.map(f =>
        `  • ${f.item}\n    Note: ${f.note || "—"}\n    Recommended action: Assign an owner, set a closure date, and re-verify at next visit.`
      ).join("\n");
      text += "\n";
    }
    return text;
  }

  function suggestSkills(freeText, keywordMap) {
    const t = (freeText || "").toLowerCase();
    const hits = [];
    keywordMap.forEach(rule => {
      const matched = rule.match.filter(k => t.includes(k));
      if (matched.length) hits.push({ suggest: rule.suggest, why: rule.why, matched });
    });
    // de-dupe by suggestion, keep richest match
    const seen = new Map();
    hits.forEach(h => {
      if (!seen.has(h.suggest) || seen.get(h.suggest).matched.length < h.matched.length) seen.set(h.suggest, h);
    });
    return Array.from(seen.values());
  }

  return { generateAIDraft, generateEsiaDraft, generateAuditSummary, suggestSkills };
})();

</script>

  function creditBalance() {
    if (!state.user) return 0;
    return state.credits[state.user.email] || 0;
  }
  function spendCredits(amount, reason) {
    if (!state.user) { alert("Log in first — free sign-up gives you " + VERDA_SEED.freeSignupCredits + " credits."); return false; }
    const bal = creditBalance();
    if (bal < amount) { alert(`Not enough credits. This action costs ${amount}, you have ${bal}. Visit Credits & Billing to top up.`); return false; }
    state.credits[state.user.email] = bal - amount;
    state.creditLedger.push({ id: uid("txn"), user: state.user.email, amount: -amount, reason, date: new Date().toISOString() });
    save();
    return true;
  }
  function addCredits(amount, reason) {
    if (!state.user) return;
    state.credits[state.user.email] = creditBalance() + amount;
    state.creditLedger.push({ id: uid("txn"), user: state.user.email, amount, reason, date: new Date().toISOString() });
    save();
  }

    document.documentElement.setAttribute("data-theme", theme);

  }

  function statCard(iconName, label, value, sub, warn) {

  /* Every value a user typed is escaped before it reaches innerHTML.
     With local-only storage this is self-XSS, but the moment records are
     shared between tenants an unescaped incident description becomes
     stored XSS in someone else's session — so it is escaped at the seam,
     not left for the backend to worry about. */
  function esc(value) {
    if (value === null || value === undefined) return "";
    return String(value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function today() { return new Date().toISOString().slice(0, 10); }
  function daysUntil(dateStr) {
    if (!dateStr) return null;
    return Math.round((new Date(dateStr) - new Date(today())) / 86400000);
  }
  function addMonths(dateStr, months) {
    const d = new Date(dateStr);
    d.setMonth(d.getMonth() + months);
    return d.toISOString().slice(0, 10);
  }
  function statusBadge(label, status) {

  }
  function trainingStatus(expiry) {
    const d = daysUntil(expiry);
    if (d === null) return { label: "Unknown", status: "neutral" };
    if (d < 0) return { label: "Expired", status: "critical" };
    if (d <= 60) return { label: "Expiring soon", status: "warning" };
    return { label: "Valid", status: "good" };
  }

  /* ---- Charts: inline SVG, no chart library (keeps the app offline-capable).
     Colors come from CSS custom properties so they follow the active theme;
     the status palette is fixed and always paired with a visible label. ---- */
  function barChart(rows, title, valueLabel) {
    const W = 520, H = 210, padL = 16, padR = 12, padT = 26, padB = 40;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const max = Math.max(1, ...rows.map(r => r.value));
    const n = rows.length || 1;
    const slot = plotW / n, barW = Math.min(52, slot * 0.6);
    const bars = rows.map((r, i) => {
      const hgt = Math.round((r.value / max) * plotH);
      const x = padL + slot * i + (slot - barW) / 2;
      const y = padT + plotH - hgt;
      const rad = Math.min(4, hgt);
      const d = hgt <= 0 ? "" :
        `M${x} ${y + hgt} V${y + rad} q0 -${rad} ${rad} -${rad} h${barW - 2 * rad} q${rad} 0 ${rad} ${rad} V${y + hgt} Z`;
      return `<g><title>${r.label}: ${r.value}</title>` +
        (hgt > 0 ? `<path d="${d}" style="fill:${r.color}"/>` : "") +
        `<text x="${x + barW / 2}" y="${y - 7}" class="chart-value">${r.value}</text>` +
        `<text x="${x + barW / 2}" y="${padT + plotH + 17}" class="chart-label">${r.label}</text></g>`;
    }).join("");
    const table = `<details class="chart-table"><summary>View data table</summary>
      <table class="table"><thead><tr><th>${title}</th><th>${valueLabel || "Count"}</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${r.label}</td><td>${r.value}</td></tr>`).join("")}
      </tbody></table></details>`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">
      <line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" class="chart-axis"/>
      ${bars}</svg>${table}`;
  }

  function fileToDataUrl(file) {

      r.onload = () => resolve(r.result);
      r.onerror = reject;

    });
  }

  /* ============================ VERDA REPORTING ============================ */

  // Categorical series colours, in fixed order (never cycled). Slots 1-3 of the
  // validated palette; a table asking for more than three series is capped.
  const SERIES_VARS = ["var(--chart-1)", "var(--chart-2)", "var(--chart-3)"];

  // Grouped bar chart, 1-3 series. Single series needs no legend (the title
  // names it); two or more always carry one, plus direct value labels, so
  // identity is never colour-alone.
  function groupedBarChart(rows, seriesDefs, title, valueLabel) {
    const series = seriesDefs.slice(0, 3);
    if (!rows.length || !series.length) return "";
    const W = 560, H = 230, padL = 16, padR = 12, padT = 28, padB = 46;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const max = Math.max(1, ...rows.flatMap(r => series.map(s => Number(r.values[s.key]) || 0)));
    const slot = plotW / rows.length;
    const groupW = Math.min(58 * series.length, slot * 0.68);
    const barW = Math.max(4, (groupW - 2 * (series.length - 1)) / series.length); // 2px surface gap
    const body = rows.map((r, i) => {
      const gx = padL + slot * i + (slot - groupW) / 2;
      return series.map((s, j) => {
        const v = Number(r.values[s.key]) || 0;
        const hgt = Math.round((v / max) * plotH);
        const x = gx + j * (barW + 2);
        const y = padT + plotH - hgt;
        const rad = Math.min(4, hgt, barW / 2);
        const d = hgt <= 0 ? "" :
          `M${x} ${y + hgt} V${y + rad} q0 -${rad} ${rad} -${rad} h${barW - 2 * rad} q${rad} 0 ${rad} ${rad} V${y + hgt} Z`;
        // A single-series chart may colour each bar by its own category
        // (the reserved status palette); multi-series colours by series.
        const fill = (series.length === 1 && r.color) ? r.color : (s.color || SERIES_VARS[j]);
        return `<g><title>${esc(r.label)} — ${esc(s.label)}: ${esc(String(v))}</title>` +
          (hgt > 0 ? `<path d="${d}" style="fill:${fill}"/>` : "") +
          `<text x="${x + barW / 2}" y="${y - 6}" class="chart-value">${esc(String(v))}</text></g>`;
      }).join("") +
        `<text x="${gx + groupW / 2}" y="${padT + plotH + 17}" class="chart-label">${esc(shortLabel(r.label))}</text>`;
    }).join("");
    const legend = series.length > 1
      ? `<div class="chart-legend">${series.map((s, j) =>
          `<span class="legend-item"><i style="background:${s.color || SERIES_VARS[j]}"></i>${esc(s.label)}</span>`).join("")}</div>`
      : "";
    const table = `<details class="chart-table"><summary>View data table</summary>
      <div class="table-scroll"><table class="table"><thead><tr><th>${esc(title)}</th>
      ${series.map(s => `<th>${esc(s.label)}${valueLabel ? ` (${esc(valueLabel)})` : ""}</th>`).join("")}</tr></thead><tbody>
      ${rows.map(r => `<tr><td>${esc(r.label)}</td>${series.map(s => `<td>${esc(String(r.values[s.key] ?? "—"))}</td>`).join("")}</tr>`).join("")}
      </tbody></table></div></details>`;
    return `<figure class="chart-figure"><figcaption class="chart-title">${esc(title)}</figcaption>
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">
      <line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" class="chart-axis"/>
      ${body}</svg>${legend}${table}</figure>`;
  }

  function shortLabel(s) {
    s = String(s || "");
    return s.length > 16 ? s.slice(0, 15) + "…" : s;
  }

  // Build chart rows from a table's live data. Returns null when there is
  // nothing numeric to plot yet — an empty chart frame is worse than none.
  function chartFromTable(tableDef, rows) {
    const spec = tableDef.chart;
    if (!spec || !rows || !rows.length) return null;
    if (spec.count) {
      // Count rows per category (e.g. grievances by status).
      const counts = new Map();
      rows.forEach(r => {
        const k = (r[spec.labelKey] || "").trim();
        if (k) counts.set(k, (counts.get(k) || 0) + 1);
      });
      if (!counts.size) return null;
      const palette = spec.status ? statusColorFor : null;
      return {
        rows: Array.from(counts, ([label, n]) => ({ label, values: { count: n }, color: palette ? palette(label) : null })),
        series: [{ key: "count", label: spec.valueLabel || "Count" }],
        title: spec.title, valueLabel: spec.valueLabel,
        perRowColor: !!palette
      };
    }
    const keys = spec.valueKeys.slice(0, 3);
    const out = rows
      .filter(r => (r[spec.labelKey] || "").trim() && keys.some(k => String(r[k] ?? "").trim() !== ""))
      .map(r => ({ label: r[spec.labelKey], values: Object.fromEntries(keys.map(k => [k, Number(r[k]) || 0])) }));
    if (!out.length) return null;
    const colFor = (k) => (tableDef.columns.find(c => c.key === k) || {}).label || k;
    return {
      rows: out,
      series: keys.map(k => ({ key: k, label: colFor(k) })),
      title: spec.title, valueLabel: spec.valueLabel
    };
  }

  // Status words map to the reserved status palette, so "Above limit" is never
  // the same colour as a neutral series.
  function statusColorFor(label) {
    const t = String(label).toLowerCase();
    if (/open|above|non-?compliant|expired|not paid|disputed|major|not obtained|not implemented|destroyed/.test(t)) return "var(--chart-critical)";
    if (/investigat|partial|part paid|applied|in progress|pending|minor|under |await/.test(t)) return "var(--chart-warning)";
    if (/closed|resolved|valid|within|compliant|paid|effective|delivered|obtained|protected/.test(t)) return "var(--chart-good)";
    return "var(--chart-1)";
  }

  function renderChartBlock(tableDef, rows) {
    const c = chartFromTable(tableDef, rows);
    if (!c) return `<p class="muted small chart-empty">Add rows with numbers and a chart appears here.</p>`;
    // Status charts carry a colour per row (the reserved status palette);
    // every bar is directly labelled with its category either way.
    return groupedBarChart(c.rows, c.series, c.title, c.valueLabel);
  }

  // Downscale a dropped photo before it is stored: site photos off a phone are
  // several MB each and localStorage is a few MB in total.
  function compressImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("not an image"));
        img.onload = () => {
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const hh = Math.max(1, Math.round(img.height * scale));
          const cv = document.createElement("canvas");
          cv.width = w; cv.height = hh;
          cv.getContext("2d").drawImage(img, 0, 0, w, hh);
          resolve(cv.toDataURL("image/jpeg", quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  const MAX_PHOTOS_PER_SECTION = 6;

  /* ---- Carry-forward of cumulative figures -------------------------------
     Lender-facing reports ask for two numbers on every line: this period, and
     the running total to date. Re-typing the running total each period is how
     those series go wrong, and a client 20 periods in cannot reconstruct it
     from scratch. Verda owns the series instead: the previous report for the
     same client and format supplies the opening balance, and the new total is
     computed rather than typed. */

  function priorReportFor(clientName, standardId) {
    return state.reports
      .filter(r => r.clientName === clientName && r.standard === standardId && r.full)
      .slice(-1)[0] || null;
  }

  // The cumulative figure this row closed at last period, or null if this row
  // (or this client) has no history yet.
  function priorCumulative(prior, sectionId, tableDef, labelValue) {
    if (!prior) return null;
    const cf = tableDef.carryForward;
    const rows = ((prior.full.segmentData[sectionId] || {}).tables || {})[tableDef.id];
    if (!rows) return null;
    const key = String(labelValue || "").trim().toLowerCase();
    if (!key) return null;
    const match = rows.find(r => String(r[cf.labelKey] || "").trim().toLowerCase() === key);
    if (!match) return null;
    const v = Number(match[cf.cumulativeKey]);
    return Number.isFinite(v) ? v : null;
  }

  function renderReporting(main) {
    let standard = VERDA_SEED.reportStandards[0];
    const segsFor = (std) => VERDA_SEED[std.segmentsKey];
    let segs = segsFor(standard);
    let guided = state.reportGuided !== false;   // on by default — most users are new to this

    // Live form model, kept outside the DOM so adding a table row or a photo
    // never discards what is already typed.
    let model = {};                              // sectionId -> { blocks, inputs, tables, photos }
    function sectionModel(id) {
      if (!model[id]) model[id] = { blocks: {}, inputs: {}, tables: {}, photos: [] };
      return model[id];
    }
    function tableRows(sectionId, tableDef) {
      const m = sectionModel(sectionId);
      if (!m.tables[tableDef.id]) {
        const starters = (tableDef.starterRows || []).map(r => Object.assign({}, r));
        m.tables[tableDef.id] = starters.length ? starters : [{}];
      }
      return m.tables[tableDef.id];
    }
    const tablesFor = (id) => VERDA_SEED.sectionTables[id] || [];

    let prior = null;                    // previous report for this client + format
    function refreshPrior() {
      const sel = main.querySelector("#rep-client");
      const client = sel && state.clients.find(c => c.id === sel.value);
      prior = client ? priorReportFor(client.name, standard.id) : null;
    }

    // Starter rows pre-fill a label column so the expected rows are visible.
    // A row carrying nothing but that scaffolding is not data, and must not be
    // reported as if the user had filled it in.
    function rowHasContent(tableDef, row) {
      const starterKeys = new Set((tableDef.starterRows || []).flatMap(r => Object.keys(r)));
      return Object.entries(row).some(([k, v]) =>
        String(v ?? "").trim() && !starterKeys.has(k));
    }
    function filledRows(sectionId, tableDef) {
      return (sectionModel(sectionId).tables[tableDef.id] || []).filter(r => rowHasContent(tableDef, r));
    }

    main.appendChild(h(`
      <section>
        <div class="page-header">
          <div class="page-header-text">
            <h1>Verda Reporting</h1>
            <p class="muted">Fill in the tables, add your photos, and Verda assembles the report. Every section is optional — include only what applies to this client.</p>
          </div>
        </div>

        <div class="card notice-card" id="how-to">
          <h3>How to build a report — four steps</h3>
          <ol class="steps">
            <li><strong>Pick the format and the client.</strong> Verda's own segments for a straightforward monthly report, the IFC Performance Standards where a lender requires them, or the full ESSR where your contract demands it.</li>
            <li><strong>Tick the sections that apply.</strong> Untick anything that doesn't — you are not expected to fill all of them.</li>
            <li><strong>Fill the tables and drop in photos.</strong> Each table says what belongs in it. Numbers become charts automatically. Leave a figure blank if you don't have it; enter <strong>0</strong> if it genuinely is zero — those mean different things.</li>
            <li><strong>Generate, read it, then download.</strong> The draft is a starting point, not a finished submission. Read every line before it leaves your hands.</li>
          </ol>
          <label class="switch"><input type="checkbox" id="guided-toggle" ${guided ? "checked" : ""} />
            <span>Guided mode — show what each section is for, with example wording</span></label>
        </div>

        <div class="card">
          <div class="form-row">
            <label>Reporting format
              <select id="rep-standard">${VERDA_SEED.reportStandards.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")}</select>
            </label>
            <label>Client
              <select id="rep-client">${state.clients.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</select>
            </label>
            <label>Reporting period<input id="rep-period" placeholder="e.g. October 2026 / Q3 2026" /></label>
          </div>
          <div id="rep-header-fields" class="field-grid"></div>
        </div>

        <div class="card">
          <h3>Sections to include</h3>
          <p class="muted small" id="seg-progress"></p>
          <div class="seg-toggle-actions">
            <button class="btn btn-ghost btn-sm" id="seg-all">Select all</button>
            <button class="btn btn-ghost btn-sm" id="seg-none">Clear all</button>
          </div>
          <div id="seg-toggles"></div>
        </div>

        <div id="seg-forms"></div>

        <div class="card">
          <button class="btn btn-primary" id="gen-report">Generate report with AI Assist (${VERDA_SEED.creditCosts.aiDraft} credits)</button>
          <p class="muted small">Drafts the narrative from what you entered. It cannot invent data it wasn't given — blank stays blank.</p>
        </div>
        <div id="report-output"></div>

        <div class="card">
          <h3>Past reports</h3>
          <div class="table-scroll">
            <table class="table"><thead><tr><th>Client</th><th>Format</th><th>Period</th><th>Sections</th><th>Photos</th><th>Generated</th><th></th></tr></thead>
            <tbody id="reports-list"></tbody></table>
          </div>
        </div>
      </section>
    `));

    /* ---- header fields (format-specific, e.g. ESSR document number) ---- */
    function renderHeaderFields() {
      const box = main.querySelector("#rep-header-fields");
      box.innerHTML = (standard.headerFields || []).map(f =>
        `<label>${esc(f.label)}<input data-header="${esc(f.key)}" placeholder="${esc(f.placeholder || "")}" /></label>`
      ).join("");
    }

    /* ---- one table ---- */
    function tableHtml(sectionId, t) {
      const rows = tableRows(sectionId, t);
      const head = t.columns.map(c =>
        `<th>${esc(c.label)}${c.unit ? ` <span class="muted">(${esc(c.unit)})</span>` : ""}</th>`).join("");
      const body = rows.map((row, ri) => `<tr>${t.columns.map(c => {
        const v = row[c.key] == null ? "" : String(row[c.key]);
        if (c.type === "select") {
          return `<td><select data-cell="${esc(c.key)}" data-row="${ri}">
            <option value="">—</option>
            ${c.options.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></td>`;
        }
        // The cumulative column is computed from last period's closing figure
        // plus this period's, and locked — except on the first report for this
        // client, where the user establishes the opening balance.
        if (t.carryForward && c.key === t.carryForward.cumulativeKey) {
          const opening = priorCumulative(prior, sectionId, t, row[t.carryForward.labelKey]);
          if (opening !== null) {
            const total = opening + (Number(row[t.carryForward.periodKey]) || 0);
            row[c.key] = String(total);
            return `<td><input type="number" class="cell-computed" data-cell="${esc(c.key)}" data-row="${ri}"
              value="${total}" readonly
              title="Carried forward from ${esc(prior.period)}: ${opening}, plus this period" /></td>`;
          }
        }
        const type = c.type === "number" ? "number" : c.type === "date" ? "date" : "text";
        return `<td><input type="${type}" data-cell="${esc(c.key)}" data-row="${ri}" value="${esc(v)}" /></td>`;
      }).join("")}<td class="row-actions"><button class="btn btn-ghost btn-sm" data-delrow="${ri}" title="Remove this row" aria-label="Remove row ${ri + 1}">✕</button></td></tr>`).join("");
      return `<div class="report-table" data-table="${esc(t.id)}">
        <div class="report-table-head">
          <h5>${esc(t.title)}</h5>
          ${t.hint ? `<p class="muted small">${esc(t.hint)}</p>` : ""}
        </div>
        <div class="table-scroll"><table class="table entry-table"><thead><tr>${head}<th></th></tr></thead>
        <tbody>${body}</tbody></table></div>
        <button class="btn btn-ghost btn-sm" data-addrow="${esc(t.id)}">+ Add row</button>
        ${t.carryForward ? (prior
          ? `<p class="muted small carry-note">Running totals are carried forward from <strong>${esc(prior.period)}</strong> and locked — enter this period's figure and the total updates itself.</p>`
          : `<p class="muted small carry-note">This is the first report for this client in this format, so enter the opening running totals yourself. From the next one Verda carries them forward.</p>`) : ""}
        <div class="chart-slot" data-chart="${esc(t.id)}">${t.chart ? renderChartBlock(t, rows) : ""}</div>
      </div>`;
    }

    /* ---- one section ---- */
    function sectionHtml(sec) {
      const blocks = standard.blocks || DEFAULT_BLOCKS;
      const m = sectionModel(sec.id);
      const guide = VERDA_SEED.sectionGuide[sec.id];
      const guideHtml = (guided && guide) ? `<div class="guide-box">
        <p><strong>What this section is for.</strong> ${esc(guide.what)}</p>
        <p><strong>How to fill it.</strong> ${esc(guide.how)}</p>
        <details><summary>Example wording</summary>
          <p class="guide-example">${esc(guide.example)}</p>
          <p class="muted small">Guidance only — describe what actually happened on your site.</p>
        </details>
      </div>` : "";
      const fields = (sec.fields || []).map(f =>
        `<label class="field-sm">${esc(f.label)}${f.unit ? ` <span class="muted">(${esc(f.unit)})</span>` : ""}
          <input type="${f.type === "number" ? "number" : "text"}" data-input="${esc(f.key)}"
            value="${esc(m.inputs[f.key] || "")}" placeholder="${esc(f.placeholder || "")}" /></label>`).join("");
      const tables = tablesFor(sec.id).map(t => tableHtml(sec.id, t)).join("");
      const narrative = blocks.map(b =>
        `<label>${esc(b.label)}<textarea data-field="${esc(b.key)}" rows="3"
          placeholder="${esc(b.label)} — in your own words.">${esc(m.blocks[b.key] || "")}</textarea></label>`).join("");
      return `<div class="card seg-form" data-seg="${esc(sec.id)}">
        <h4>${esc(sec.label)}</h4>
        ${sec.hint ? `<p class="muted small">${esc(sec.hint)}</p>` : ""}
        ${guideHtml}
        ${fields ? `<h5>Summary figures</h5><div class="field-grid">${fields}</div>` : ""}
        ${tables}
        <h5>Narrative</h5>
        ${narrative}
        <h5>Photographs</h5>
        <div class="dropzone" data-drop="${esc(sec.id)}" tabindex="0" role="button"
             aria-label="Add photographs for ${esc(sec.label)}">
          <p><strong>Drag photos here</strong> — or click to choose, or paste from your clipboard.</p>
          <p class="muted small">Up to ${MAX_PHOTOS_PER_SECTION} per section. Photos are resized in your browser and stored on this device only.</p>
          <input type="file" accept="image/*" multiple hidden data-file="${esc(sec.id)}" />
        </div>
        <div class="photo-grid" data-photos="${esc(sec.id)}"></div>
      </div>`;
    }

    /* ---- photos ---- */
    function renderPhotos(sectionId) {
      const grid = main.querySelector(`[data-photos="${sectionId}"]`);
      if (!grid) return;
      const photos = sectionModel(sectionId).photos;
      grid.innerHTML = photos.map((p, i) => `<figure class="photo-card">
        <img src="${p.src}" alt="${esc(p.caption || "Site photograph")}" />
        <input class="photo-caption" data-caption="${i}" value="${esc(p.caption || "")}" placeholder="Caption — what this shows" />
        <button class="btn btn-ghost btn-sm" data-delphoto="${i}">Remove</button>
      </figure>`).join("");
      grid.querySelectorAll("[data-caption]").forEach(inp => inp.addEventListener("input", () => {
        photos[Number(inp.dataset.caption)].caption = inp.value;
      }));
      grid.querySelectorAll("[data-delphoto]").forEach(btn => btn.addEventListener("click", () => {
        photos.splice(Number(btn.dataset.delphoto), 1);
        renderPhotos(sectionId);
      }));
    }

    async function addFiles(sectionId, files) {
      const m = sectionModel(sectionId);
      const list = Array.from(files).filter(f => f.type.startsWith("image/"));
      if (!list.length) { alert("That doesn't look like an image file. Photos can be JPG, PNG, HEIC-converted or WebP."); return; }
      const room = MAX_PHOTOS_PER_SECTION - m.photos.length;
      if (room <= 0) { alert(`This section already has ${MAX_PHOTOS_PER_SECTION} photos. Remove one before adding another.`); return; }
      for (const f of list.slice(0, room)) {
        try {
          m.photos.push({ src: await compressImage(f, 1100, 0.72), caption: f.name.replace(/\.[^.]+$/, "") });
        } catch (e) { alert(`Couldn't read "${f.name}". Try saving it as a JPG or PNG first.`); }
      }
      if (list.length > room) alert(`Added ${room} photo(s) — this section is now full at ${MAX_PHOTOS_PER_SECTION}.`);
      renderPhotos(sectionId);
    }

    /* ---- wiring for a rendered section ---- */
    function wireSection(sec) {
      const form = main.querySelector(`.seg-form[data-seg="${sec.id}"]`);
      if (!form) return;
      const m = sectionModel(sec.id);

      form.querySelectorAll("[data-input]").forEach(el =>
        el.addEventListener("input", () => { m.inputs[el.dataset.input] = el.value; updateProgress(); }));
      form.querySelectorAll("[data-field]").forEach(el =>
        el.addEventListener("input", () => { m.blocks[el.dataset.field] = el.value; updateProgress(); }));

      tablesFor(sec.id).forEach(t => {
        const wrap = form.querySelector(`[data-table="${t.id}"]`);
        const rows = tableRows(sec.id, t);
        wrap.querySelectorAll("[data-cell]").forEach(el => {
          el.addEventListener("input", () => {
            rows[Number(el.dataset.row)][el.dataset.cell] = el.value;
            recomputeCumulative(sec.id, t, wrap, Number(el.dataset.row));
            updateProgress();
          });
          // Charts refresh on commit (blur / select change), not per keystroke.
          el.addEventListener("change", () => refreshChart(sec.id, t));
        });
        wrap.querySelector("[data-addrow]").addEventListener("click", () => {
          rows.push({});
          rerenderTable(sec, t);
        });
        wrap.querySelectorAll("[data-delrow]").forEach(btn => btn.addEventListener("click", () => {
          rows.splice(Number(btn.dataset.delrow), 1);
          if (!rows.length) rows.push({});
          rerenderTable(sec, t);
        }));
      });

      const dz = form.querySelector("[data-drop]");
      const picker = form.querySelector("[data-file]");
      dz.addEventListener("click", () => picker.click());
      dz.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); picker.click(); } });
      picker.addEventListener("change", () => { addFiles(sec.id, picker.files); picker.value = ""; });
      ["dragenter", "dragover"].forEach(ev => dz.addEventListener(ev, (e) => {
        e.preventDefault(); e.stopPropagation(); dz.classList.add("dropzone-active");
      }));
      ["dragleave", "drop"].forEach(ev => dz.addEventListener(ev, (e) => {
        e.preventDefault(); e.stopPropagation(); dz.classList.remove("dropzone-active");
      }));
      dz.addEventListener("drop", (e) => { if (e.dataTransfer && e.dataTransfer.files) addFiles(sec.id, e.dataTransfer.files); });
      dz.addEventListener("paste", (e) => {
        const items = (e.clipboardData && e.clipboardData.files) || [];
        if (items.length) { e.preventDefault(); addFiles(sec.id, items); }
      });
      renderPhotos(sec.id);
    }

    function recomputeCumulative(sectionId, t, wrap, ri) {
      if (!t.carryForward) return;
      const cf = t.carryForward;
      const rows = tableRows(sectionId, t);
      const opening = priorCumulative(prior, sectionId, t, rows[ri][cf.labelKey]);
      if (opening === null) return;
      const total = opening + (Number(rows[ri][cf.periodKey]) || 0);
      rows[ri][cf.cumulativeKey] = String(total);
      const cell = wrap.querySelector(`[data-cell="${cf.cumulativeKey}"][data-row="${ri}"]`);
      if (cell) cell.value = String(total);
    }

    function refreshChart(sectionId, t) {
      const slot = main.querySelector(`.seg-form[data-seg="${sectionId}"] [data-chart="${t.id}"]`);
      if (slot && t.chart) slot.innerHTML = renderChartBlock(t, tableRows(sectionId, t));
    }

    function rerenderTable(sec, t) {
      const wrap = main.querySelector(`.seg-form[data-seg="${sec.id}"] [data-table="${t.id}"]`);
      if (!wrap) return;
      wrap.outerHTML = tableHtml(sec.id, t);
      // Re-wire just this table.
      const fresh = main.querySelector(`.seg-form[data-seg="${sec.id}"] [data-table="${t.id}"]`);
      const rows = tableRows(sec.id, t);
      fresh.querySelectorAll("[data-cell]").forEach(el => {
        el.addEventListener("input", () => {
          rows[Number(el.dataset.row)][el.dataset.cell] = el.value;
          recomputeCumulative(sec.id, t, fresh, Number(el.dataset.row));
          updateProgress();
        });
        el.addEventListener("change", () => refreshChart(sec.id, t));
      });
      fresh.querySelector("[data-addrow]").addEventListener("click", () => { rows.push({}); rerenderTable(sec, t); });
      fresh.querySelectorAll("[data-delrow]").forEach(btn => btn.addEventListener("click", () => {
        rows.splice(Number(btn.dataset.delrow), 1);
        if (!rows.length) rows.push({});
        rerenderTable(sec, t);
      }));
      updateProgress();
    }

    /* ---- section list ---- */
    function checkedIds() {
      return Array.from(main.querySelectorAll(".seg-check:checked")).map(c => c.value);
    }

    function sectionHasData(id) {
      const m = model[id];
      if (!m) return false;
      if (Object.values(m.blocks).some(v => (v || "").trim())) return true;
      if (Object.values(m.inputs).some(v => (v || "").trim())) return true;
      if (m.photos.length) return true;
      return tablesFor(id).some(t => filledRows(id, t).length > 0);
    }

    function updateProgress() {
      const ids = checkedIds();
      const done = ids.filter(sectionHasData).length;
      const el = main.querySelector("#seg-progress");
      if (!el) return;
      el.textContent = ids.length
        ? `${done} of ${ids.length} selected section(s) have something in them. Empty sections are reported as "no change" — that is allowed, but say so deliberately.`
        : "No sections selected yet — tick the ones that apply to this client.";
      main.querySelectorAll(".seg-toggle").forEach(lab => {
        const id = lab.querySelector(".seg-check").value;
        lab.classList.toggle("seg-filled", sectionHasData(id));
      });
    }

    function renderSegForms() {
      const ids = checkedIds();
      const container = main.querySelector("#seg-forms");
      const chosen = segs.filter(s => ids.includes(s.id));
      container.innerHTML = chosen.length
        ? chosen.map(sectionHtml).join("")
        : `<p class="muted">Tick a section above and its tables appear here.</p>`;
      chosen.forEach(wireSection);
      updateProgress();
    }

    function renderSegToggles() {
      main.querySelector("#seg-toggles").innerHTML = segs.map(s =>
        `<label class="seg-toggle"><input type="checkbox" class="seg-check" value="${esc(s.id)}" checked />
          <span class="seg-toggle-label">${esc(s.label)}</span>
          <span class="muted small">${esc(s.hint || "")}</span></label>`).join("");
      main.querySelectorAll(".seg-check").forEach(cb => cb.addEventListener("change", renderSegForms));
      renderSegForms();
    }

    main.querySelector("#seg-all").addEventListener("click", () => {
      main.querySelectorAll(".seg-check").forEach(c => { c.checked = true; });
      renderSegForms();
    });
    main.querySelector("#seg-none").addEventListener("click", () => {
      main.querySelectorAll(".seg-check").forEach(c => { c.checked = false; });
      renderSegForms();
    });
    main.querySelector("#guided-toggle").addEventListener("change", (e) => {
      guided = e.target.checked;
      state.reportGuided = guided;
      save();
      renderSegForms();
    });

    refreshPrior();
    renderHeaderFields();
    renderSegToggles();
    main.querySelector("#rep-client").addEventListener("change", () => {
      refreshPrior();
      renderSegForms();
    });

    main.querySelector("#rep-standard").addEventListener("change", (e) => {
      standard = VERDA_SEED.reportStandards.find(s => s.id === e.target.value);
      segs = segsFor(standard);
      model = {};                 // a different format asks different questions
      refreshPrior();
      renderHeaderFields();
      renderSegToggles();
    });

    /* ---- past reports ---- */
    function refreshList() {
      main.querySelector("#reports-list").innerHTML = state.reports.slice().reverse().map(r => `
        <tr><td>${esc(r.clientName)}</td>
        <td>${statusBadge(esc(r.standardName || "Verda"), STANDARD_BADGE[r.standard] || "good")}</td>
        <td>${esc(r.period)}</td><td>${r.segments.length}</td><td>${r.photoCount || 0}</td><td>${r.date.slice(0, 10)}</td>
        <td class="row-actions">
          <button class="btn btn-ghost btn-sm" data-dl="${esc(r.id)}">.txt</button>
          <button class="btn btn-ghost btn-sm" data-dlhtml="${esc(r.id)}">Full report</button>
        </td></tr>`).join("") ||
        `<tr><td colspan="7" class="muted">No reports generated yet.</td></tr>`;
      const base = (r) => `${REPORT_FILE_PREFIX[r.standard] || "Verda-Reporting"}-${r.clientName.replace(/\s+/g, "_")}-${String(r.period).replace(/\s+/g, "_")}`;
      main.querySelectorAll("[data-dl]").forEach(btn => btn.addEventListener("click", () => {
        const r = state.reports.find(x => x.id === btn.dataset.dl);
        downloadText(`${base(r)}.txt`, r.text);
      }));
      main.querySelectorAll("[data-dlhtml]").forEach(btn => btn.addEventListener("click", () => {
        const r = state.reports.find(x => x.id === btn.dataset.dlhtml);
        if (!r.full) { alert("This report was generated before tables and photos were stored. Generate it again to get the full version."); return; }
        downloadHtml(`${base(r)}.html`, buildReportHtml(r));
      }));
    }
    refreshList();

    /* ---- generate ---- */
    main.querySelector("#gen-report").addEventListener("click", () => {
      const client = state.clients.find(c => c.id === main.querySelector("#rep-client").value);
      const period = main.querySelector("#rep-period").value.trim() || "Current period";
      const segments = checkedIds();
      if (!segments.length) { alert("Tick at least one section to include."); return; }
      if (!spendCredits(VERDA_SEED.creditCosts.aiDraft, "Verda Reporting AI draft")) return;

      const blocks = standard.blocks || DEFAULT_BLOCKS;
      const segmentData = {};
      let photoCount = 0;
      segments.forEach(id => {
        const m = sectionModel(id);
        const tables = {};
        tablesFor(id).forEach(t => {
          const rows = filledRows(id, t);
          if (rows.length) tables[t.id] = rows;
        });
        photoCount += m.photos.length;
        segmentData[id] = Object.assign({}, m.blocks, { inputs: m.inputs, tables, photos: m.photos });
      });
      const header = {};
      main.querySelectorAll("#rep-header-fields [data-header]").forEach(el => {
        if (el.value.trim()) header[el.dataset.header] = el.value.trim();
      });

      const text = VerdaAI.generateAIDraft({
        clientName: client.name, period, segments, segmentData,
        standardTitle: standard.title, segmentDefs: segs,
        blocks, header, headerDefs: standard.headerFields || [],
        tableDefs: VERDA_SEED.sectionTables
      });

      const rec = {
        id: uid("rep"), clientName: client.name, period, segments, text,
        standard: standard.id, standardName: standard.shortName,
        date: new Date().toISOString(), photoCount,
        full: { standardTitle: standard.title, header, headerDefs: standard.headerFields || [], blocks, segmentData,
                sectionLabels: Object.fromEntries(segs.map(s => [s.id, s.label])) }
      };
      state.reports.push(rec);
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(state));
      } catch (e) {
        // Photos are the only thing big enough to fill localStorage. Keep the
        // report, drop the stored copies, and say so rather than failing quietly.
        rec.full.segmentData = Object.fromEntries(Object.entries(rec.full.segmentData)
          .map(([k, v]) => [k, Object.assign({}, v, { photos: [] })]));
        save();
        alert("The report was generated and the download below includes your photos. Browser storage was full, so the saved copy in 'Past reports' keeps the tables and narrative but not the images.");
      }

      const preview = main.querySelector("#report-output");
      preview.innerHTML = card("Generated report", `
        <p class="muted small">Read it through before it leaves your hands. "Full report" keeps the tables, charts and photographs; ".txt" is the plain-text version.</p>
        <div class="modal-actions">
          <button class="btn btn-primary" id="dl-html">Download full report (.html)</button>
          <button class="btn btn-ghost" id="dl-now">Download .txt</button>
        </div>
        <div class="report-preview">${buildReportHtml(rec, true)}</div>`);
      preview.querySelector("#dl-now").addEventListener("click", () =>
        downloadText(`${REPORT_FILE_PREFIX[standard.id] || "Verda-Reporting"}-${client.name.replace(/\s+/g, "_")}.txt`, text));
      preview.querySelector("#dl-html").addEventListener("click", () =>
        downloadHtml(`${REPORT_FILE_PREFIX[standard.id] || "Verda-Reporting"}-${client.name.replace(/\s+/g, "_")}.html`,
          buildReportHtml(rec)));

      renderTopbar();
      refreshList();
      refreshPrior();             // this report is now the carry-forward source
      updateProgress();
    });
