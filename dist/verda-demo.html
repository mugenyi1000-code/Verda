<title>Verda EHS Platform</title>
<style>
/* Verda — theme system & layout */

:root, :root[data-theme="forest"] {
  --brand-1: #1f7a4d;
  --brand-2: #2fa66a;
  --brand-3: #eaf7ef;
  --solid-1: var(--brand-1);
  --solid-2: var(--brand-2);
  --accent: #d97706;
  --bg: #f4f7f4;
  --surface: #ffffff;
  --text: #16241c;
  --muted: #5b6b61;
  --border: #dde7e0;
  --warn: #c0392b;
  --shadow-sm: 0 1px 2px rgba(20, 40, 30, .06), 0 1px 1px rgba(20, 40, 30, .04);
  --shadow-md: 0 6px 16px rgba(20, 40, 30, .08), 0 2px 6px rgba(20, 40, 30, .05);
  --shadow-lg: 0 16px 40px rgba(20, 40, 30, .16), 0 4px 12px rgba(20, 40, 30, .08);
  --ring: rgba(31, 122, 77, .28);
}
:root[data-theme="ocean"] {
  --brand-1: #0b6e8f;
  --brand-2: #2aa3c0;
  --brand-3: #e7f6fa;
  --solid-1: var(--brand-1);
  --solid-2: var(--brand-2);
  --accent: #f59e0b;
  --bg: #f2f8fa;
  --surface: #ffffff;
  --text: #0e2630;
  --muted: #4f6b74;
  --border: #d7e9ee;
  --warn: #c0392b;
  --shadow-sm: 0 1px 2px rgba(10, 40, 55, .07), 0 1px 1px rgba(10, 40, 55, .04);
  --shadow-md: 0 6px 16px rgba(10, 40, 55, .09), 0 2px 6px rgba(10, 40, 55, .05);
  --shadow-lg: 0 16px 40px rgba(10, 40, 55, .18), 0 4px 12px rgba(10, 40, 55, .09);
  --ring: rgba(11, 110, 143, .28);
}
:root[data-theme="amber"] {
  --brand-1: #b45309;
  --brand-2: #e8880c;
  --brand-3: #fdf1e0;
  --solid-1: var(--brand-1);
  --solid-2: var(--brand-2);
  --accent: #1f7a4d;
  --bg: #faf6ef;
  --surface: #ffffff;
  --text: #2a1c0d;
  --muted: #7a6650;
  --border: #efe0c9;
  --warn: #b91c1c;
  --shadow-sm: 0 1px 2px rgba(60, 35, 5, .07), 0 1px 1px rgba(60, 35, 5, .04);
  --shadow-md: 0 6px 16px rgba(60, 35, 5, .10), 0 2px 6px rgba(60, 35, 5, .05);
  --shadow-lg: 0 16px 40px rgba(60, 35, 5, .18), 0 4px 12px rgba(60, 35, 5, .09);
  --ring: rgba(180, 83, 9, .28);
}
:root[data-theme="slate"] {
  --brand-1: #8fa6bd;
  --brand-2: #a9bbcf;
  --brand-3: #24344a;
  --solid-1: #3b5573;
  --solid-2: #4d7396;
  --accent: #38bdf8;
  --bg: #0c1420;
  --surface: #16202f;
  --text: #e6edf3;
  --muted: #93a2b5;
  --border: #2a3a51;
  --warn: #f87171;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, .38);
  --shadow-lg: 0 20px 48px rgba(0, 0, 0, .5);
  --ring: rgba(56, 189, 248, .35);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { line-height: 1.25; letter-spacing: -.01em; }
h1 { font-size: 1.7rem; font-weight: 800; }
h3 { font-size: 1.02rem; font-weight: 700; }
p { line-height: 1.55; }

a { color: var(--brand-1); }
::selection { background: var(--ring); }

.icon { width: 18px; height: 18px; flex-shrink: 0; }

/* ---- Illustrations (original flat-style SVG art) ---- */
.illus { width: 100%; height: 110px; display: block; }
.illus-fill-1 { fill: var(--brand-1); }
.illus-fill-2 { fill: var(--brand-2); }
.illus-fill-3 { fill: var(--brand-3); }
.illus-fill-accent { fill: var(--accent); }
.illus-fill-muted { fill: var(--muted); }
.illus-fill-surface { fill: var(--surface); }

.focus-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-bottom: 20px; }
@media (max-width: 1400px) { .focus-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 900px) { .focus-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .focus-grid { grid-template-columns: 1fr; } }
.focus-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 14px 16px;
  box-shadow: var(--shadow-sm); text-decoration: none; color: var(--text);
  display: block; transition: box-shadow .16s ease, transform .16s ease;
}
.focus-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.focus-card h4 { margin: 12px 0 4px; font-size: .92rem; }
.focus-card p { margin: 0; }

/* ---- Page header: title/lead beside a module illustration ---- */
.page-header {
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
  background: linear-gradient(120deg, var(--brand-3), transparent 70%);
  border: 1px solid var(--border); border-radius: 16px;
  padding: 18px 24px; margin-bottom: 20px;
}
.page-header-text { min-width: 0; }
.page-header-text h1 { margin: 0 0 6px; }
.page-header-text p { margin: 0; max-width: 62ch; }
.page-header-illus { width: 150px; height: 92px; flex-shrink: 0; }
@media (max-width: 780px) { .page-header-illus { display: none; } }

.iec-cat-header { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
.iec-cat-illus { width: 64px; height: 44px; flex-shrink: 0; }
.iec-cat-header h3 { margin: 0; }

.solution-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

/* ---- Wide tables scroll in their own container, never the page body ---- */
.table-scroll { overflow-x: auto; }
.table-scroll .table { min-width: 640px; }
.table-scroll input { min-width: 84px; }

/* ---- Pricing plans ---- */
.plan-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; align-items: stretch; }
@media (max-width: 1200px) { .plan-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 620px) { .plan-grid { grid-template-columns: 1fr; } }
.plan-card {
  position: relative; display: flex; flex-direction: column; gap: 4px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 20px; box-shadow: var(--shadow-sm);
}
.plan-featured { border-color: var(--brand-2); box-shadow: var(--shadow-md); }
.plan-flag {
  position: absolute; top: -11px; left: 20px; background: var(--solid-1); color: #fff;
  font-size: .68rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 999px;
}
.plan-card h3 { margin: 4px 0 2px; }
.plan-price { font-size: 1.9rem; font-weight: 800; color: var(--brand-1); letter-spacing: -.02em; }
.plan-per { font-size: .82rem; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.plan-seats { margin: 0 0 8px; }
.plan-pitch { font-size: .88rem; margin: 0 0 8px; }
.plan-features { flex: 1; margin-bottom: 14px; }
.plan-features li { font-size: .85rem; }
.plan-card .btn { width: 100%; justify-content: center; }

/* ---- Notice card: a caveat that must not read as decoration ---- */
.notice-card { border-left: 4px solid var(--accent); background: var(--brand-3); }
.notice-card p { margin: 6px 0 0; }

/* ---- Sector grid ---- */
.sector-groups { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
@media (max-width: 900px) { .sector-groups { grid-template-columns: 1fr; } }
.sector-group { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow-sm); }
.sector-group-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.sector-group-illus { width: 72px; height: 48px; flex-shrink: 0; }
.sector-group-title { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
.sector-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.sector-chip {
  border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer;
  padding: 6px 12px; border-radius: 999px; font-size: .82rem; font-weight: 600; font-family: inherit;
  transition: all .14s ease;
}
.sector-chip:hover { background: var(--brand-3); border-color: var(--brand-2); }

/* ---- Status badges ----
   Doubled class (.badge.badge-x) so these win over the base .badge rule
   regardless of source order. Every status badge carries its own label,
   so color never has to be read on its own. */
.badge.badge-good { background: rgba(12, 163, 12, .16); color: #0a7d0a; }
.badge.badge-warning { background: rgba(250, 178, 25, .24); color: #8a6000; }
.badge.badge-serious { background: rgba(236, 131, 90, .24); color: #a54a22; }
.badge.badge-critical { background: rgba(208, 59, 59, .16); color: #b02a2a; }
:root[data-theme="slate"] .badge.badge-good { color: #4ed24e; }
:root[data-theme="slate"] .badge.badge-warning { color: #fab219; }
:root[data-theme="slate"] .badge.badge-serious { color: #ec835a; }
:root[data-theme="slate"] .badge.badge-critical { color: #f08585; }
.row-overdue { background: color-mix(in srgb, #d03b3b 7%, transparent); }

/* ---- Charts ----
   Categorical slot 1 and the fixed status palette from the validated
   reference palette; dark steps applied under the Slate theme. */
:root { --chart-1: #2a78d6; --chart-good: #0ca30c; --chart-warning: #fab219; --chart-serious: #ec835a; --chart-critical: #d03b3b; }
:root[data-theme="slate"] { --chart-1: #3987e5; }
/* max-width keeps type at a sane size when a chart sits in a full-width card */
.chart { width: 100%; max-width: 560px; height: auto; display: block; margin-top: 6px; }
.chart-axis { stroke: var(--border); stroke-width: 1; }
.chart-value { font-size: 13px; font-weight: 700; text-anchor: middle; fill: var(--text); }
.chart-label { font-size: 12px; text-anchor: middle; fill: var(--muted); }
.chart-table { margin-top: 8px; }
.chart-table summary { cursor: pointer; font-size: .82rem; color: var(--muted); }

/* ---- Risk matrix ---- */
.risk-matrix { border-collapse: separate; border-spacing: 3px; width: 100%; }
.risk-matrix th { font-size: .75rem; color: var(--muted); font-weight: 700; width: 16%; text-align: center; }
.risk-cell {
  text-align: center; font-weight: 800; font-size: .9rem; color: #fff;
  border-radius: 7px; height: 38px;
}
.risk-good { background: #0ca30c; }
.risk-warning { background: #fab219; color: #4a3600; }
.risk-serious { background: #ec835a; }
.risk-critical { background: #d03b3b; }

/* ---- Top bar ---- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20; box-shadow: var(--shadow-sm);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.18rem; letter-spacing: -.01em; }
.brand .logo {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(135deg, var(--solid-1), var(--solid-2));
  display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800;
  box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.25);
}
.topbar-right { display: flex; align-items: center; gap: 10px; }
.topbar-right select {
  padding: 7px 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font-size: .85rem; cursor: pointer; transition: border-color .15s ease;
}
.topbar-right select:hover { border-color: var(--brand-2); }
#topbar-credits {
  display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 700; color: var(--brand-1);
  background: var(--brand-3); padding: 6px 12px; border-radius: 999px;
}
#topbar-credits[hidden] { display: none; }
#topbar-credits .icon { width: 15px; height: 15px; }
#topbar-auth { display: flex; gap: 8px; align-items: center; }

/* ---- Layout ---- */
.layout { display: flex; min-height: calc(100vh - 58px); }
#sidebar {
  width: 258px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
  padding: 16px 12px; overflow-y: auto;
}
.nav-group { margin-bottom: 20px; }
.nav-group-title {
  font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
  padding: 4px 10px; font-weight: 800;
}
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; text-decoration: none; color: var(--text);
  font-size: .89rem; font-weight: 500; margin: 2px 0; transition: background-color .12s ease, color .12s ease;
  border-left: 3px solid transparent;
}
.nav-item .icon { opacity: .65; transition: opacity .12s ease; }
.nav-item:hover { background: var(--brand-3); }
.nav-item.active { background: var(--solid-1); color: #fff; font-weight: 700; border-left-color: var(--accent); box-shadow: var(--shadow-sm); }
.nav-item.active .icon { opacity: 1; }

#main { flex: 1; padding: 26px 30px; max-width: 1120px; }

/* ---- Hero ---- */
.hero {
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, var(--solid-1), var(--solid-2));
  color: #fff; padding: 34px 32px; border-radius: 18px; margin-bottom: 22px; box-shadow: var(--shadow-lg);
}
.hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(circle at 88% -10%, rgba(255,255,255,.22), transparent 45%),
    radial-gradient(circle at 100% 100%, rgba(255,255,255,.12), transparent 40%);
}
.hero h1 { margin: 0 0 8px; font-size: 1.9rem; position: relative; }
.hero p { position: relative; opacity: .95; }
.hero-actions { margin-top: 16px; display: flex; gap: 10px; position: relative; }
.hero .btn-primary { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.4); backdrop-filter: blur(2px); }
.hero .btn-ghost { color: #fff; border-color: rgba(255,255,255,.5); }

/* ---- Grid / cards ---- */
.grid { display: grid; gap: 18px; margin-bottom: 20px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } #sidebar { display: none; } }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; margin-bottom: 18px;
  box-shadow: var(--shadow-sm); transition: box-shadow .16s ease, transform .16s ease;
}
.card h3 { margin-top: 0; }
.stat { font-size: 2.1rem; font-weight: 800; color: var(--brand-1); letter-spacing: -.02em; }
.stat.warn { color: var(--warn); }
.muted { color: var(--muted); }
.small { font-size: .82rem; }

.stat-card { display: flex; gap: 14px; align-items: flex-start; }
.stat-icon {
  width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  background: var(--brand-3); color: var(--brand-1);
}
.stat-icon-warn { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.stat-icon .icon { width: 21px; height: 21px; }
.stat-label { font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
.stat-body p { margin: 4px 0 0; }

/* ---- Forms ---- */
label { display: block; margin: 12px 0; font-size: .85rem; font-weight: 600; color: var(--muted); }
input, select, textarea {
  width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font-size: .92rem; margin-top: 5px; font-family: inherit;
  transition: border-color .14s ease, box-shadow .14s ease;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--brand-2); box-shadow: 0 0 0 3px var(--ring);
}
textarea { min-height: 74px; resize: vertical; }
.form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.form-row > * { flex: 1; min-width: 140px; }

/* ---- Buttons ---- */
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); cursor: pointer; font-size: .89rem; font-weight: 600; text-decoration: none;
  box-shadow: var(--shadow-sm); transition: transform .1s ease, box-shadow .15s ease, background-color .15s ease;
}
.btn .icon { width: 17px; height: 17px; }
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn:active { transform: translateY(0); }
.btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
.btn-primary {
  background: linear-gradient(135deg, var(--solid-1), var(--solid-2)); color: #fff; border-color: transparent;
}
.btn-ghost { background: transparent; box-shadow: none; }
.btn-ghost:hover { background: var(--brand-3); box-shadow: none; transform: none; }
.btn-sm { padding: 6px 12px; font-size: .8rem; }
.quick-actions { display: flex; flex-direction: column; gap: 9px; }
.quick-actions .btn { justify-content: flex-start; }

/* ---- Tables ---- */
.table { width: 100%; border-collapse: collapse; margin-top: 10px; }
.table th, .table td { text-align: left; padding: 10px 12px; font-size: .87rem; }
.table thead th { color: var(--muted); font-weight: 700; font-size: .74rem; text-transform: uppercase; letter-spacing: .03em; border-bottom: 2px solid var(--border); }
.table tbody tr { border-bottom: 1px solid var(--border); transition: background-color .1s ease; }
.table tbody tr:hover { background: var(--brand-3); }
.table tbody tr:last-child { border-bottom: none; }

/* ---- Segments / checklists ---- */
.segments { border: none; padding: 0; margin: 12px 0; }
.seg-toggle { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-weight: 500; }
.seg-toggle input { width: auto; margin: 0; }
.seg-form { border-left: 3px solid var(--brand-2); padding: 10px 14px; margin: 12px 0; background: var(--brand-3); border-radius: 0 10px 10px 0; }
.checklist { list-style: none; padding: 0; }
.checklist li { padding: 7px 0; border-bottom: 1px dashed var(--border); }
.checklist label { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 500; margin: 0; }
.checklist input { width: auto; }

.report-pre { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; font-size: .85rem; line-height: 1.6; }

.badge { display: inline-block; padding: 3px 11px; border-radius: 999px; background: var(--brand-3); color: var(--brand-1); font-size: .74rem; font-weight: 700; }

/* ---- Tabs ---- */
.tabs { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
.tab-btn {
  padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  cursor: pointer; font-size: .84rem; font-weight: 600; transition: all .14s ease;
}
.tab-btn:hover { border-color: var(--brand-2); }
.tab-btn.active { background: var(--solid-1); color: #fff; border-color: var(--solid-1); box-shadow: var(--shadow-sm); }

/* ---- Audit rows ---- */
.audit-row { display: grid; grid-template-columns: 2fr 1fr 1.4fr; gap: 10px; align-items: center; margin: 10px 0; }

/* ---- Records / gallery ---- */
.record-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.record-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-sm); transition: box-shadow .16s ease; }
.record-card:hover { box-shadow: var(--shadow-md); }
.record-card img { width: 100%; height: 140px; object-fit: cover; display: block; }
.record-noimg { height: 140px; display: flex; align-items: center; justify-content: center; color: var(--muted); background: var(--brand-3); }
.record-body { padding: 12px 14px; }

/* ---- Matterport frame ---- */
.mp-frame { margin-top: 14px; }
.mp-frame iframe { width: 100%; height: 380px; border: none; border-radius: 14px; box-shadow: var(--shadow-sm); }

/* ---- Workflow runs ---- */
.wf-run { padding: 14px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; background: var(--bg); }

/* ---- Modal ---- */
.modal-overlay { position: fixed; inset: 0; background: rgba(10, 15, 12, .5); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: var(--surface); border-radius: 16px; padding: 24px; width: 380px; max-width: 92vw; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

footer.app-footer { padding: 26px; text-align: center; color: var(--muted); font-size: .8rem; border-top: 1px solid var(--border); margin-top: 12px; }

/* ---- Scrollbars (webkit) ---- */
#sidebar::-webkit-scrollbar { width: 8px; }
#sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

</style>

  <header class="topbar">
    <div class="brand"><span class="logo">V</span> Verda <span class="muted small">by EEIS</span></div>
    <div class="topbar-right">
      <span id="topbar-credits"></span>
      <select id="lang-select" title="Language">
        <option value="en">English</option>
        <option value="sw">Kiswahili</option>
        <option value="fr">Français</option>
        <option value="pt">Português</option>
        <option value="zh">中文</option>
      </select>
      <select id="theme-select" title="Colour theme">
        <option value="forest">Forest</option>
        <option value="ocean">Ocean</option>
        <option value="amber">Amber</option>
        <option value="slate">Slate</option>
      </select>

`PPE AWARENESS — KEY POINTS (Verda IEC Series)

1. Wear the PPE assigned for your specific task — not "any" PPE.
2. Inspect PPE before each use; damaged PPE must be replaced, not repaired informally.
3. Store PPE clean and dry; contaminated PPE should be decontaminated or discarded per site rules.
4. Report lost or damaged PPE to your supervisor immediately.
5. PPE is the last line of defence — it does not replace safe work procedures.
6. Never remove required PPE to "work faster." Report barriers to PPE use so they can be fixed.` },
    { category: "Safety", title: "Fire Safety — Do's and Don'ts", body:
`FIRE SAFETY — DO'S AND DON'TS (Verda IEC Series)

DO
- Know the location of your nearest fire extinguisher and assembly point.
- Keep fire exits and extinguisher access clear at all times.
- Report damaged electrical wiring or overloaded sockets.
- Participate in fire drills.

DON'T
- Don't store flammable materials near ignition sources or exits.
- Don't prop open fire doors.
- Don't attempt to fight a fire beyond your training — evacuate and raise the alarm.` },

Separate waste at the point of generation into:
- General/non-hazardous waste (bin: black)
- Recyclables — paper, plastic, metal (bin: green)
- Hazardous waste — chemicals, oils, contaminated materials (bin: red, labelled)
- Organic/biodegradable waste (bin: brown)

Hazardous waste must be stored in a bunded, covered area and handed only to a
licensed waste transporter. Keep waste transfer records for every collection.` },

- Community members have the right to raise concerns about site operations.
- Grievances should be logged, acknowledged, and given a reference number.
- Investigate and respond within the timeframe committed in your ESMP.
- Keep the grievance log available for audit and regulator review.
- No community member should face any form of retaliation for raising a concern.` },
    { category: "Environment", title: "GHG & Climate Awareness Basics", body:
`GHG & CLIMATE AWARENESS BASICS (Verda IEC Series)

- Greenhouse gases (GHGs) from a site typically come from fuel combustion,
  electricity use, process emissions, and vehicle fleets.
- Simple reduction actions: fix leaks, maintain equipment, switch off idle
  machinery, monitor fuel/electricity use monthly, and track against a baseline.
- Keeping basic activity data (litres of fuel, kWh of power) is the first step
  toward any future GHG inventory or reporting requirement.` },
    { category: "Health", title: "Basic First Aid — Response Priorities", body:

1. Ensure the scene is safe before approaching.
2. Check responsiveness and breathing; call for emergency help.
3. Control severe bleeding with direct pressure.
4. Do not move a person with a suspected spinal injury unless there is

<script>
/* Verda AI Assist — drafting engine.
   -----------------------------------------------------------------------
   HONEST NOTE ON HOW THIS WORKS:
   Verda is a static, no-backend app. A real live call to the Claude API
   requires a server-side proxy so the API key is never exposed in the
   browser — that backend doesn't exist yet. Everything in this file is a
   deterministic, rule-based drafting engine that turns structured form
   input into readable prose, in the same shape a Claude-drafted report
   would take. It is intentionally isolated behind the functions below
   (generateAIDraft, generateAuditSummary, suggestSkills) so that wiring in
   a real POST to a Claude API backend later is a one-function swap, not a
   rewrite.
   ----------------------------------------------------------------------- */

const VerdaAI = (() => {

  function bulletList(items) {
    return items.filter(Boolean).map(i => `  • ${i}`).join("\n");
  }

  function narrativeForSegment(seg, data, label) {
    const d = data || {};
    switch (seg) {
      case "safety":
        return `SAFETY\n` +
          `During the reporting period, ${d.incidents || "0"} incident(s) and ${d.nearMisses || "0"} near-miss event(s) were recorded. ` +
          `PPE compliance was observed at ${d.ppeCompliance || "N/A"}. ${d.trainingNote || "Routine safety briefings were conducted."}\n` +
          (d.notes ? `Notes: ${d.notes}\n` : "");
      case "security":
        return `SECURITY\n` +
          `${d.securityIncidents || "0"} security-related incident(s) were logged this period. Access control and site perimeter checks were carried out ${d.accessChecks || "as scheduled"}.\n` +
          (d.notes ? `Notes: ${d.notes}\n` : "");
      case "environment":
        return `ENVIRONMENT\n` +
          `Effluent and air monitoring were carried out ${d.monitoringFreq || "as scheduled"}. ${d.wasteNote || "Waste was segregated and handed to a licensed transporter."} ` +
          `${d.spillNote || "No uncontrolled spills were recorded."}\n` +
          (d.notes ? `Notes: ${d.notes}\n` : "");
      case "ghg":
        return `GHG\n` +
          `Estimated fuel/energy use for the period: ${d.energyUse || "not yet tracked"}. ${d.reductionActions || "No specific reduction actions logged this period."}\n` +
          (d.notes ? `Notes: ${d.notes}\n` : "");
      case "community":
        return `COMMUNITY\n` +
          `${d.grievances || "0"} grievance(s) were logged, of which ${d.grievancesClosed || "0"} were closed out. ${d.engagementNote || "No community engagement activities were scheduled this period."}\n` +
          (d.notes ? `Notes: ${d.notes}\n` : "");
      case "permitting":
        return `PERMITTING\n` +
          `Current permit status: ${d.permitStatus || "valid"}. Next renewal due: ${d.renewalDate || "not set"}. ${d.submissionNote || "No new submissions were made this period."}\n` +
          (d.notes ? `Notes: ${d.notes}\n` : "");
      default:
        // Any framework segment without a bespoke template — e.g. the IFC
        // Performance Standards — is rendered from its own label and input.
        return `${label || seg}\n` +
          ((d.notes && d.notes.trim())
            ? d.notes.trim()
            : "Status not yet recorded for this period. Add site data, monitoring results and any corrective actions before this report is issued.") + "\n";
    }
  }

  function generateAIDraft({ clientName, period, segments, segmentData, standardTitle, segmentDefs }) {
    const defs = segmentDefs || [];
    const labelFor = (id) => {
      const d = defs.find((x) => x.id === id);
      return d ? d.label : id[0].toUpperCase() + id.slice(1);
    };
    const header =
`${standardTitle || "VERDA REPORTING"}
Client: ${clientName || "—"}
Reporting Period: ${period || "—"}
Segments included: ${segments.map(labelFor).join("; ")}
Generated: ${new Date().toISOString().slice(0, 10)}
-----------------------------------------------------------------------`;

    const body = segments.map(s => narrativeForSegment(s, segmentData[s] || {}, labelFor(s))).join("\n");

    const summary =
`\nSUMMARY\nThis report was compiled from the ${segments.length} selected segment(s) above. ` +
`Review each section, add any site-specific context, and forward to the client contact for sign-off.`;

    return `${header}\n\n${body}${summary}`;
  }

  function generateEsiaDraft({ projectName, sections }) {
    const header =
`TERMS OF REFERENCE / ESIA REPORT DRAFT
Project: ${projectName || "—"}
Generated: ${new Date().toISOString().slice(0, 10)}
-----------------------------------------------------------------------\n`;
    const body = sections.map(s => `${s.title}\n${s.text && s.text.trim() ? s.text.trim() : "[Not yet completed — add input for this section.]"}`).join("\n\n");
    return header + body;
  }

  function generateAuditSummary({ industry, findings }) {
    const nonCompliant = findings.filter(f => f.status === "Non-Compliant");
    const compliant = findings.filter(f => f.status === "Compliant");
    const na = findings.filter(f => f.status === "N/A");

    let text =
`EHS AUDIT FINDINGS SUMMARY\nIndustry checklist: ${industry}\nGenerated: ${new Date().toISOString().slice(0, 10)}\n` +
`-----------------------------------------------------------------------\n` +
`Items reviewed: ${findings.length}  |  Compliant: ${compliant.length}  |  Non-Compliant: ${nonCompliant.length}  |  N/A: ${na.length}\n\n`;

    if (nonCompliant.length === 0) {
      text += "No non-compliant items were identified in this audit. Maintain current controls and re-audit at the next scheduled interval.\n";
    } else {
      text += "NON-COMPLIANT ITEMS & RECOMMENDED CORRECTIVE ACTIONS:\n";
      text += nonCompliant.map(f =>
        `  • ${f.item}\n    Note: ${f.note || "—"}\n    Recommended action: Assign an owner, set a closure date, and re-verify at next visit.`
      ).join("\n");
      text += "\n";
    }
    return text;
  }

  function suggestSkills(freeText, keywordMap) {
    const t = (freeText || "").toLowerCase();
    const hits = [];
    keywordMap.forEach(rule => {
      const matched = rule.match.filter(k => t.includes(k));
      if (matched.length) hits.push({ suggest: rule.suggest, why: rule.why, matched });
    });
    // de-dupe by suggestion, keep richest match
    const seen = new Map();
    hits.forEach(h => {
      if (!seen.has(h.suggest) || seen.get(h.suggest).matched.length < h.matched.length) seen.set(h.suggest, h);
    });
    return Array.from(seen.values());
  }

  return { generateAIDraft, generateEsiaDraft, generateAuditSummary, suggestSkills };
})();

    if (bal < amount) { alert(`Not enough credits. This action costs ${amount}, you have ${bal}. Visit Credits & Billing to top up.`); return false; }

  function statCard(iconName, label, value, sub, warn) {

  /* Every value a user typed is escaped before it reaches innerHTML.
     With local-only storage this is self-XSS, but the moment records are
     shared between tenants an unescaped incident description becomes
     stored XSS in someone else's session — so it is escaped at the seam,
     not left for the backend to worry about. */
  function esc(value) {
    if (value === null || value === undefined) return "";
    return String(value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function today() { return new Date().toISOString().slice(0, 10); }
  function daysUntil(dateStr) {
    if (!dateStr) return null;
    return Math.round((new Date(dateStr) - new Date(today())) / 86400000);
  }
  function addMonths(dateStr, months) {
    const d = new Date(dateStr);
    d.setMonth(d.getMonth() + months);
    return d.toISOString().slice(0, 10);
  }
  function statusBadge(label, status) {

  function trainingStatus(expiry) {
    const d = daysUntil(expiry);
    if (d === null) return { label: "Unknown", status: "neutral" };
    if (d < 0) return { label: "Expired", status: "critical" };
    if (d <= 60) return { label: "Expiring soon", status: "warning" };
    return { label: "Valid", status: "good" };
  }

  /* ---- Charts: inline SVG, no chart library (keeps the app offline-capable).
     Colors come from CSS custom properties so they follow the active theme;
     the status palette is fixed and always paired with a visible label. ---- */
  function barChart(rows, title, valueLabel) {
    const W = 520, H = 210, padL = 16, padR = 12, padT = 26, padB = 40;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const max = Math.max(1, ...rows.map(r => r.value));
    const n = rows.length || 1;
    const slot = plotW / n, barW = Math.min(52, slot * 0.6);
    const bars = rows.map((r, i) => {
      const hgt = Math.round((r.value / max) * plotH);
      const x = padL + slot * i + (slot - barW) / 2;
      const y = padT + plotH - hgt;
      const rad = Math.min(4, hgt);
      const d = hgt <= 0 ? "" :
        `M${x} ${y + hgt} V${y + rad} q0 -${rad} ${rad} -${rad} h${barW - 2 * rad} q${rad} 0 ${rad} ${rad} V${y + hgt} Z`;
      return `<g><title>${r.label}: ${r.value}</title>` +
        (hgt > 0 ? `<path d="${d}" style="fill:${r.color}"/>` : "") +
        `<text x="${x + barW / 2}" y="${y - 7}" class="chart-value">${r.value}</text>` +
        `<text x="${x + barW / 2}" y="${padT + plotH + 17}" class="chart-label">${r.label}</text></g>`;
    }).join("");
    const table = `<details class="chart-table"><summary>View data table</summary>
      <table class="table"><thead><tr><th>${title}</th><th>${valueLabel || "Count"}</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${r.label}</td><td>${r.value}</td></tr>`).join("")}
      </tbody></table></details>`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">
      <line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" class="chart-axis"/>
      ${bars}</svg>${table}`;
  }

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  function openAuthModal(mode) {
    const overlay = h(`<div class="modal-overlay"><div class="modal">

      <p class="muted small">Prototype authentication — stored in this browser only. Wire up a real identity provider before production use.</p>

          <button type="button" class="btn btn-ghost" id="auth-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">${mode === "signup" ? T().signup : T().login}</button>
        </div>
      </form>
    </div></div>`);
    document.body.appendChild(overlay);
    overlay.querySelector("#auth-cancel").addEventListener("click", () => overlay.remove());
    overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector("#auth-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const email = fd.get("email").trim().toLowerCase();
      if (mode === "signup") {
        if (state.users.some(u => u.email === email)) { alert("An account with that email already exists — log in instead."); return; }
        const user = { name: fd.get("name"), email, company: fd.get("company"), industry: fd.get("industry"), role: fd.get("role"), password: fd.get("password") };
        state.users.push(user);
        state.credits[email] = VERDA_SEED.freeSignupCredits;
        state.user = user;
      } else {
        const u = state.users.find(u => u.email === email && u.password === fd.get("password"));
        if (!u) { alert("No matching account. Try Free Sign Up."); return; }
        state.user = u;
      }
      save();
      overlay.remove();
      renderTopbar();
      route();
    });
  }

        <tr><td>${esc(r.clientName)}</td><td>${statusBadge(esc(r.standardName || "Verda"), STANDARD_BADGE[r.standard] || "good")}</td>
        <td>${esc(r.period)}</td><td>${r.segments.length}</td><td>${r.date.slice(0,10)}</td>
        <td><button class="btn btn-ghost btn-sm" data-dl="${r.id}">Download</button></td></tr>`).join("") ||
        `<tr><td colspan="6" class="muted">No reports generated yet.</td></tr>`;
      main.querySelectorAll("[data-dl]").forEach(btn => btn.addEventListener("click", () => {
        const r = state.reports.find(x => x.id === btn.dataset.dl);
        const prefix = REPORT_FILE_PREFIX[r.standard] || "Verda-Reporting";
        downloadText(`${prefix}-${r.clientName.replace(/\s+/g,"_")}-${r.period.replace(/\s+/g,"_")}.txt`, r.text);
      }));
    }
    refreshList();

    main.querySelector("#gen-report").addEventListener("click", () => {
      const clientId = main.querySelector("#rep-client").value;
      const client = state.clients.find(c => c.id === clientId);
      const period = main.querySelector("#rep-period").value.trim() || "Current period";
      const segments = Array.from(main.querySelectorAll(".seg-check:checked")).map(c => c.value);
      if (!segments.length) { alert("Select at least one segment."); return; }
      if (!spendCredits(VERDA_SEED.creditCosts.aiDraft, "Verda Reporting AI draft")) return;
      const segmentData = {};
      segments.forEach(id => {
        const notes = main.querySelector(`.seg-form[data-seg="${id}"] [data-field="notes"]`).value;
        segmentData[id] = { notes };
      });
      const text = VerdaAI.generateAIDraft({
        clientName: client.name, period, segments, segmentData,
        standardTitle: standard.title, segmentDefs: segs
      });
      const rec = {
        id: uid("rep"), clientName: client.name, period, segments, text,
        standard: standard.id, standardName: standard.shortName,
        date: new Date().toISOString()
      };
      state.reports.push(rec);
      save();
      main.querySelector("#report-output").innerHTML = card("Generated report (preview)", `<pre class="report-pre">${esc(text)}</pre>
        <div class="modal-actions"><button class="btn btn-primary" id="dl-now">Download .txt</button></div>`);
      main.querySelector("#dl-now").addEventListener("click", () =>
        downloadText(`${REPORT_FILE_PREFIX[standard.id] || "Verda-Reporting"}-${client.name.replace(/\s+/g,"_")}.txt`, text));
      renderTopbar();
      refreshList();
    });
  }

  /* ============================ RISK REGISTER ============================ */
  function renderRisk(main) {
    const S = VERDA_SEED;
    main.appendChild(h(`
      <section>
        <h1>Risk Register</h1>
        <p class="muted">Score hazards on a 5×5 likelihood × severity matrix. Verda bands the score and tracks controls and ownership.</p>
        <div class="card">
          <h3>Add a hazard</h3>
          <div class="form-row">
            <label>Hazard<input id="risk-hazard" placeholder="e.g. Unguarded conveyor drive" /></label>
            <label>Area / activity<input id="risk-area" placeholder="e.g. Packing line" /></label>
            <label>Likelihood<select id="risk-l">${S.riskLikelihood.map((l, i) => `<option value="${i + 1}">${i + 1} — ${l}</option>`).join("")}</select></label>
            <label>Severity<select id="risk-s">${S.riskSeverity.map((l, i) => `<option value="${i + 1}">${i + 1} — ${l}</option>`).join("")}</select></label>
          </div>
          <div class="form-row">
            <label>Existing controls<input id="risk-controls" placeholder="e.g. Fixed guard, LOTO procedure" /></label>
            <label>Owner<input id="risk-owner" placeholder="Who owns this risk" /></label>
          </div>
          <button class="btn btn-primary" id="risk-add">${icon("risk")}<span>Add to register</span></button>
        </div>
        <div class="grid grid-2">
          <div class="card"><h3>Risk matrix</h3><div id="risk-matrix"></div>
            <p class="muted small">Likelihood (rows) × Severity (columns). Cell numbers are hazards currently at that score.</p></div>
          <div class="card"><h3>Profile</h3><div id="risk-profile"></div></div>
        </div>
        <div class="card">
          <h3>Register</h3>
          <table class="table"><thead><tr><th>Hazard</th><th>Area</th><th>Score</th><th>Band</th><th>Controls</th><th>Owner</th></tr></thead>
          <tbody id="risk-rows"></tbody></table>
        </div>
      </section>`));

    function refresh() {
      // matrix
      let m = `<table class="risk-matrix"><thead><tr><th></th>${S.riskSeverity.map((s, i) => `<th>${i + 1}</th>`).join("")}</tr></thead><tbody>`;
      for (let l = 5; l >= 1; l--) {
        m += `<tr><th>${l}</th>`;
        for (let s = 1; s <= 5; s++) {
          const band = riskBandFor(l * s);
          const count = state.risks.filter(r => r.likelihood === l && r.severity === s).length;
          m += `<td class="risk-cell risk-${band.status}" title="${band.label} — score ${l * s}">${count || ""}</td>`;
        }
        m += `</tr>`;
      }
      m += `</tbody></table>`;
      main.querySelector("#risk-matrix").innerHTML = m;

      // profile chart
      const rows = S.riskBands.map(b => ({
        label: b.label,
        value: state.risks.filter(r => riskBandFor(r.likelihood * r.severity).label === b.label).length,
        color: `var(--chart-${b.status})`
      }));
      main.querySelector("#risk-profile").innerHTML = barChart(rows, "Hazards by risk band");

      main.querySelector("#risk-rows").innerHTML = state.risks.slice().reverse().map(r => {
        const score = r.likelihood * r.severity, band = riskBandFor(score);
        return `<tr><td>${esc(r.hazard)}</td><td>${esc(r.area)}</td><td>${score}</td>
          <td>${statusBadge(band.label, band.status)}</td><td>${esc(r.controls) || "—"}</td><td>${esc(r.owner) || "—"}</td></tr>`;
      }).join("") || `<tr><td colspan="6" class="muted">No hazards recorded yet.</td></tr>`;
    }
    refresh();

    main.querySelector("#risk-add").addEventListener("click", () => {
      const hazard = main.querySelector("#risk-hazard").value.trim();
      if (!hazard) { alert("Name the hazard."); return; }
      state.risks.push({
        id: uid("risk"), hazard, area: main.querySelector("#risk-area").value,
        likelihood: parseInt(main.querySelector("#risk-l").value, 10),
        severity: parseInt(main.querySelector("#risk-s").value, 10),
        controls: main.querySelector("#risk-controls").value, owner: main.querySelector("#risk-owner").value
      });
      save();
      main.querySelector("#risk-hazard").value = ""; main.querySelector("#risk-area").value = "";
      refresh();
    });
  }

  function renderActions(main) {

    main.appendChild(h(`

        </div>
      </section>`));

    const PRI_STATUS = { Low: "good", Medium: "warning", High: "critical" };
    function refresh() {
      main.querySelector("#act-rows").innerHTML = state.actions.slice().reverse().map(a => {
        const overdue = a.status !== "Closed" && daysUntil(a.due) < 0;
        return `<tr class="${overdue ? "row-overdue" : ""}">
          <td>${esc(a.title)}</td><td>${esc(a.source)}</td><td>${esc(a.owner) || "—"}</td>

        </tr>`;
      }).join("") || `<tr><td colspan="6" class="muted">No actions yet — raise one here or from an incident.</td></tr>`;

      main.querySelectorAll(".act-status").forEach(sel => sel.addEventListener("change", () => {
        state.actions.find(a => a.id === sel.dataset.id).status = sel.value;

      }));

    refresh();

    main.querySelector("#act-add").addEventListener("click", () => {
      const title = main.querySelector("#act-title").value.trim();
      if (!title) { alert("Describe the action."); return; }
      state.actions.push({
        id: uid("act"), title, source: main.querySelector("#act-source").value,
        owner: main.querySelector("#act-owner").value, due: main.querySelector("#act-due").value,
        priority: main.querySelector("#act-priority").value, status: "Open", created: today()
      });
      save();
      main.querySelector("#act-title").value = ""; main.querySelector("#act-owner").value = "";
      refresh();
    });
  }

  /* ---- Platform (SaaS) revenue: what Verda earns its developers ---- */
  function renderPlatformRevenue(container) {
    const P = state.platformRevenue;
    const plans = VERDA_SEED.platformPlans;
    const priceOf = (id) => id === "enterprise" ? P.enterprisePrice : (plans.find(p => p.id === id) || {}).price || 0;
    const usd = (n) => `$${Math.round(n).toLocaleString()}`;

    const paidPlans = ["team", "business", "enterprise"];
    const rows = paidPlans.map(id => {
      const plan = plans.find(p => p.id === id);
      const subs = P.subscribers[id] || 0;
      const price = priceOf(id);
      return { id, name: plan.name, subs, price, mrr: subs * price };
    });
    const subscriptionMrr = rows.reduce((a, r) => a + r.mrr, 0);
    const payingAccounts = rows.reduce((a, r) => a + r.subs, 0);
    const creditMrr = payingAccounts * P.creditRevenuePerPayingAccount;
    const grossMrr = subscriptionMrr + creditMrr;
    const infraCost = payingAccounts * P.infraCostPerAccount;
    const netMrr = grossMrr - infraCost - P.monthlyBuildCost;
    const churnedPerMonth = payingAccounts * (P.monthlyChurnPct / 100);
    const arpa = payingAccounts > 0 ? grossMrr / payingAccounts : 0;
    // Lifetime = 1/churn rate (months); LTV = ARPA x lifetime, net of infra.
    const lifetimeMonths = P.monthlyChurnPct > 0 ? 100 / P.monthlyChurnPct : null;
    const ltv = lifetimeMonths ? (arpa - P.infraCostPerAccount) * lifetimeMonths : null;
    const accountsToBreakEven = (arpa - P.infraCostPerAccount) > 0
      ? Math.ceil(P.monthlyBuildCost / (arpa - P.infraCostPerAccount)) : null;

    container.innerHTML = `
      <div class="card notice-card">
        <strong>This models the product business, and it cannot start today.</strong>
        <p class="muted small">Subscriptions need a backend, real authentication, multi-tenancy and a payment gateway. Until those exist this tab is a plan, not a forecast — the services tab is the revenue that is available now.</p>
      </div>
      <div class="card">
        <h3>Assumptions</h3>
        <div class="form-row">
          ${rows.map(r => `<label>${esc(r.name)} subscribers${r.id === "enterprise" ? "" : ` <span class="muted small">($${r.price}/mo)</span>`}
            <input class="pr-in" data-field="subs" data-plan="${esc(r.id)}" type="number" min="0" value="${r.subs}" /></label>`).join("")}
          <label>Enterprise price /mo<input class="pr-in" data-field="enterprisePrice" type="number" min="0" value="${P.enterprisePrice}" /></label>
        </div>
        <div class="form-row">
          <label>Monthly churn %<input class="pr-in" data-field="monthlyChurnPct" type="number" min="0" step="0.5" value="${P.monthlyChurnPct}" /></label>
          <label>Credit revenue / account /mo<input class="pr-in" data-field="creditRevenuePerPayingAccount" type="number" min="0" value="${P.creditRevenuePerPayingAccount}" /></label>
          <label>Infra cost / account /mo<input class="pr-in" data-field="infraCostPerAccount" type="number" min="0" value="${P.infraCostPerAccount}" /></label>
          <label>Build &amp; run cost /mo<input class="pr-in" data-field="monthlyBuildCost" type="number" min="0" value="${P.monthlyBuildCost}" /></label>
        </div>
      </div>
      <div class="grid grid-3">
        ${statCard("revenue", "Platform MRR", usd(grossMrr), `${payingAccounts} paying accounts · ${usd(subscriptionMrr)} subscriptions + ${usd(creditMrr)} credits.`)}
        ${statCard("analytics", "Annual run rate", usd(grossMrr * 12), "Gross, before costs.")}
        ${statCard("governance", "Net after costs", usd(netMrr), netMrr >= 0 ? "Covers infra and build cost." : "Does not yet cover infra and build cost.", netMrr < 0)}
      </div>
      <div class="grid grid-2">
        <div class="card"><h3>Unit economics</h3>
          <table class="table"><tbody>
            <tr><td>Average revenue per account</td><td>${usd(arpa)}/mo</td></tr>
            <tr><td>Infra cost per account</td><td>${usd(P.infraCostPerAccount)}/mo</td></tr>
            <tr><td>Expected account lifetime</td><td>${lifetimeMonths ? lifetimeMonths.toFixed(0) + " months" : "—"}</td></tr>
            <tr><td>Lifetime value per account</td><td>${ltv !== null ? usd(ltv) : "—"}</td></tr>
            <tr><td>Accounts lost per month at ${P.monthlyChurnPct}% churn</td><td>${churnedPerMonth.toFixed(1)}</td></tr>
            <tr><td>Accounts needed to cover build cost</td><td>${accountsToBreakEven !== null ? accountsToBreakEven : "not reachable"}</td></tr>
          </tbody></table>
        </div>
        <div class="card"><h3>MRR by plan</h3>
          ${barChart(rows.map(r => ({ label: r.name, value: Math.round(r.mrr), color: "var(--chart-1)" })), "MRR by plan", "$ / month")}
        </div>
      </div>
      <div class="card">
        <h3>What has to be true first</h3>
        <ul class="checklist">
          <li>Backend with real authentication, roles and per-tenant data separation.</li>
          <li>Payment gateway (card and mobile money) wired to plans and credit packs.</li>
          <li>A live Claude API proxy so AI drafting is genuinely AI, not templated.</li>
          <li>Someone answering support, or Team-tier customers churn straight back out.</li>
        </ul>
        <p class="muted small">Each is a real build. The order above is also the order they pay off in.</p>
      </div>`;

    container.querySelectorAll(".pr-in").forEach(inp => inp.addEventListener("input", () => {
      const val = parseFloat(inp.value) || 0;
      if (inp.dataset.field === "subs") P.subscribers[inp.dataset.plan] = val;
      else P[inp.dataset.field] = val;
      save();
      renderPlatformRevenue(container);
      // Re-focus the field the user was typing in. No setSelectionRange here:
      // it throws on <input type="number">, which every field here is.
      const focused = container.querySelector(`.pr-in[data-field="${inp.dataset.field}"]${inp.dataset.plan ? `[data-plan="${inp.dataset.plan}"]` : ""}`);
      if (focused) focused.focus();
    }));
  }

  /* ============================ REVENUE PLANNER ============================ */
  function renderRevenue(main) {
    if (!state.revenue) state.revenue = JSON.parse(JSON.stringify(VERDA_SEED.revenueDefaults));
    if (!state.platformRevenue) state.platformRevenue = JSON.parse(JSON.stringify(VERDA_SEED.platformRevenueDefaults));
    const R = state.revenue;
    const money = (n) => `${esc(R.currency)} ${Math.round(n).toLocaleString()}`;

    /* One visit falls in each billing period (a quarterly plan is visited
       quarterly, a monthly plan monthly), so the fee for a period must clear
       the cost of that period's visit — that is the break-even fee. */
    function tierMaths(t) {
      const costPerVisit = t.labCost + (t.daysPerVisit * R.dayRate) + t.travel;
      const annualRevenue = t.fee * t.visitsPerYear * t.clients;
      const annualCost = costPerVisit * t.visitsPerYear * t.clients;
      const marginPerVisit = t.fee - costPerVisit;
      return {
        costPerVisit, annualRevenue, annualCost, marginPerVisit,
        annualMargin: annualRevenue - annualCost,
        mrr: annualRevenue / 12,
        monthlyMargin: (annualRevenue - annualCost) / 12,
        marginPct: t.fee > 0 ? (marginPerVisit / t.fee) * 100 : 0
      };
    }

    main.appendChild(h(`
      <section>
        <h1>Revenue Planner</h1>
        <p class="muted">Two ways this makes money: delivering compliance care plans as a service, and licensing Verda itself as a product. Model both here.</p>
        <div class="tabs">
          <button class="tab-btn active" data-rev-tab="services">Services — compliance care plans</button>
          <button class="tab-btn" data-rev-tab="platform">Platform — Verda subscriptions</button>
        </div>
        <div id="rev-platform" hidden></div>
        <div id="rev-services"></div>
      </section>`));

    const servicesPanel = main.querySelector("#rev-services");
    servicesPanel.appendChild(h(`
      <div>
        <div class="card notice-card">
          <strong>These are placeholder figures, not EEIS rates.</strong>
          <p class="muted small">Replace every number below with your own rate card before quoting. The three that decide everything: your fee per tier, your lab cost per visit, and your loaded day rate.</p>
        </div>
        <div class="card">
          <h3>Shared inputs</h3>
          <div class="form-row">
            <label>Currency<input id="rv-currency" value="${R.currency}" /></label>
            <label>Loaded day rate<input id="rv-dayrate" type="number" min="0" value="${R.dayRate}" /></label>
            <label>Fixed monthly overhead<input id="rv-overhead" type="number" min="0" value="${R.overhead}" /></label>
          </div>
        </div>
        <div class="card">
          <h3>Per tier</h3>
          <div class="table-scroll">
            <table class="table"><thead><tr>
              <th>Tier</th><th>Billing</th><th>Fee per period</th><th>Clients</th>
              <th>Lab cost / visit</th><th>Days / visit</th><th>Travel / visit</th>
            </tr></thead><tbody>
              ${R.tiers.map(t => `<tr>
                <td>${t.name}</td>
                <td class="muted small">${t.billing}<br>${t.visitsPerYear} visits/yr</td>
                <td><input class="rv-in" data-tier="${t.id}" data-field="fee" type="number" min="0" value="${t.fee}" /></td>
                <td><input class="rv-in" data-tier="${t.id}" data-field="clients" type="number" min="0" value="${t.clients}" /></td>
                <td><input class="rv-in" data-tier="${t.id}" data-field="labCost" type="number" min="0" value="${t.labCost}" /></td>
                <td><input class="rv-in" data-tier="${t.id}" data-field="daysPerVisit" type="number" min="0" step="0.25" value="${t.daysPerVisit}" /></td>
                <td><input class="rv-in" data-tier="${t.id}" data-field="travel" type="number" min="0" value="${t.travel}" /></td>
              </tr>`).join("")}
            </tbody></table>
          </div>
        </div>
        <div id="rv-results"></div>
      </div>`));

    // Tab switching between the two revenue models.
    main.querySelectorAll("[data-rev-tab]").forEach(btn => btn.addEventListener("click", () => {
      main.querySelectorAll("[data-rev-tab]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const showPlatform = btn.dataset.revTab === "platform";
      main.querySelector("#rev-platform").hidden = !showPlatform;
      main.querySelector("#rev-services").hidden = showPlatform;
      if (showPlatform) renderPlatformRevenue(main.querySelector("#rev-platform"));
    }));

    function refresh() {
      const rows = R.tiers.map(t => ({ t, m: tierMaths(t) }));
      const totalClients = R.tiers.reduce((a, t) => a + t.clients, 0);
      const mrr = rows.reduce((a, r) => a + r.m.mrr, 0);
      const monthlyMargin = rows.reduce((a, r) => a + r.m.monthlyMargin, 0);
      const marginPct = mrr > 0 ? (monthlyMargin / mrr) * 100 : 0;
      const marginPerClient = totalClients > 0 ? monthlyMargin / totalClients : 0;
      const breakEvenClients = marginPerClient > 0 ? Math.ceil(R.overhead / marginPerClient) : null;
      const profit = monthlyMargin - R.overhead;

      const chartRows = rows.map(r => ({
        label: r.t.name.split("—")[0].trim(),
        value: Math.max(0, Math.round(r.m.monthlyMargin)),
        color: "var(--chart-1)"
      }));

      main.querySelector("#rv-results").innerHTML = `
        <div class="grid grid-3">
          ${statCard("revenue", "Monthly recurring revenue", money(mrr), `${totalClients} client${totalClients === 1 ? "" : "s"} across ${R.tiers.length} tiers.`)}
          ${statCard("analytics", "Monthly gross margin", money(monthlyMargin), `${marginPct.toFixed(0)}% of revenue after delivery cost.`, marginPct < 30)}
          ${statCard("governance", "After overhead", money(profit), profit >= 0 ? "Covers overhead." : "Does not yet cover overhead.", profit < 0)}
        </div>
        <div class="grid grid-2">
          <div class="card"><h3>Break-even</h3>
            ${breakEvenClients === null
              ? `<p class="muted">No tier earns a positive margin yet — a fee has to clear its own cost per visit before client count can help.</p>`
              : `<div class="stat">${breakEvenClients}</div>
                 <p class="muted">clients at the current mix to cover ${money(R.overhead)} of monthly overhead (average margin ${money(marginPerClient)} per client per month).</p>`}
            <p class="muted small">Annual: revenue ${money(mrr * 12)} · gross margin ${money(monthlyMargin * 12)}</p>
          </div>
          <div class="card"><h3>Monthly gross margin by tier</h3>${barChart(chartRows, "Monthly gross margin by tier", R.currency + " / month")}</div>
        </div>
        <div class="card">
          <h3>Margin per visit</h3>
          <p class="muted small">A tier only works if its fee for the period clears the cost of that period's visit. Anything at or below zero loses more money with every client you add.</p>
          <div class="table-scroll">
            <table class="table" id="rv-margin-table"><thead><tr>
              <th>Tier</th><th>Fee</th><th>Cost / visit</th><th>Margin / visit</th><th>Margin %</th><th>MRR</th><th>Monthly margin</th>
            </tr></thead><tbody>
              ${rows.map(r => {
                const band = r.m.marginPerVisit <= 0 ? "critical" : r.m.marginPct < 30 ? "warning" : "good";
                return `<tr>
                  <td>${r.t.name}</td>
                  <td>${money(r.t.fee)}</td>
                  <td>${money(r.m.costPerVisit)}</td>
                  <td>${money(r.m.marginPerVisit)}</td>
                  <td>${statusBadge(r.m.marginPct.toFixed(0) + "%", band)}</td>
                  <td>${money(r.m.mrr)}</td>
                  <td>${money(r.m.monthlyMargin)}</td>
                </tr>`;
              }).join("")}
            </tbody></table>
          </div>
          <div class="modal-actions"><button class="btn" id="rv-export">Download summary</button></div>
        </div>`;

      main.querySelector("#rv-export").addEventListener("click", () => {
        const lines = [
          "VERDA REVENUE PLANNER — SUMMARY",
          `Generated: ${today()}`,
          `Currency: ${R.currency} · Loaded day rate: ${money(R.dayRate)} · Monthly overhead: ${money(R.overhead)}`,
          "-----------------------------------------------------------------------",
          ...rows.map(r =>
            `${r.t.name} (${r.t.billing}, ${r.t.visitsPerYear} visits/yr, ${r.t.clients} clients)\n` +
            `  Fee ${money(r.t.fee)} · cost/visit ${money(r.m.costPerVisit)} · margin/visit ${money(r.m.marginPerVisit)} (${r.m.marginPct.toFixed(0)}%)\n` +
            `  MRR ${money(r.m.mrr)} · monthly margin ${money(r.m.monthlyMargin)}`),
          "-----------------------------------------------------------------------",
          `TOTAL MRR: ${money(mrr)}`,
          `TOTAL MONTHLY GROSS MARGIN: ${money(monthlyMargin)} (${marginPct.toFixed(0)}%)`,
          `AFTER OVERHEAD: ${money(profit)}`,
          breakEvenClients === null ? "BREAK-EVEN: not reachable at current fees" : `BREAK-EVEN: ${breakEvenClients} clients at the current mix`,
          "",
          "Figures are only as good as the rates entered. Verify against EEIS's rate card."
        ];
        downloadText("Verda-Revenue-Summary.txt", lines.join("\n"));
      });
    }

    function bindInputs() {
      main.querySelector("#rv-currency").addEventListener("input", (e) => { R.currency = e.target.value || "USD"; save(); refresh(); });
      main.querySelector("#rv-dayrate").addEventListener("input", (e) => { R.dayRate = parseFloat(e.target.value) || 0; save(); refresh(); });
      main.querySelector("#rv-overhead").addEventListener("input", (e) => { R.overhead = parseFloat(e.target.value) || 0; save(); refresh(); });
      main.querySelectorAll(".rv-in").forEach(inp => inp.addEventListener("input", () => {
        const tier = R.tiers.find(t => t.id === inp.dataset.tier);
        tier[inp.dataset.field] = parseFloat(inp.value) || 0;
        save(); refresh();
      }));
    }
    bindInputs();
    refresh();
  }

  /* ============================ ANALYTICS ============================ */
  function renderAnalytics(main) {
    const openActions = state.actions.filter(a => a.status !== "Closed");
    const overdue = openActions.filter(a => daysUntil(a.due) < 0);
    const highRisks = state.risks.filter(r => r.likelihood * r.severity > 9);
    const expiredTraining = state.training.filter(t => trainingStatus(t.expires).status === "critical");
    const trainingValid = state.training.length
      ? Math.round((state.training.filter(t => trainingStatus(t.expires).status === "good").length / state.training.length) * 100)
      : null;

    // last 6 months of incidents
    const months = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
      months.push({ key: d.toISOString().slice(0, 7), label: d.toLocaleString("en", { month: "short" }) });
    }
    const incidentRows = months.map(m => ({
      label: m.label,
      value: state.incidents.filter(i => (i.date || "").slice(0, 7) === m.key).length,
      color: "var(--chart-1)"
    }));
    const actionRows = VERDA_SEED.actionStatuses.map(s => ({
      label: s, value: state.actions.filter(a => a.status === s).length, color: "var(--chart-1)"
    }));
    const riskRows = VERDA_SEED.riskBands.map(b => ({
      label: b.label,
      value: state.risks.filter(r => riskBandFor(r.likelihood * r.severity).label === b.label).length,
      color: `var(--chart-${b.status})`
    }));

    main.appendChild(h(`
      <section>
        <h1>Analytics</h1>
        <p class="muted">Leading and lagging indicators across every module — the management view of what the records add up to.</p>
        <div class="grid grid-3">
          ${statCard("incidents", "Incidents logged", state.incidents.length, "All severities, all sites.")}
          ${statCard("actions", "Open actions", openActions.length, `${overdue.length} overdue.`, overdue.length > 0)}
          ${statCard("risk", "High / critical risks", highRisks.length, "Score above 9 on the 5×5 matrix.", highRisks.length > 0)}
        </div>
        <div class="grid grid-3">
          ${statCard("training", "Training records", state.training.length, expiredTraining.length ? `${expiredTraining.length} expired.` : "None expired.", expiredTraining.length > 0)}
          ${statCard("clients", "Compliance care plans", state.clients.length, "Active recurring clients.")}
          ${statCard("analytics", "Training currency", trainingValid === null ? "—" : trainingValid + "%", "Records currently valid.")}
        </div>
        <div class="grid grid-2">
          <div class="card"><h3>Incidents by month</h3>${barChart(incidentRows, "Incidents by month")}</div>
          <div class="card"><h3>Actions by status</h3>${barChart(actionRows, "Actions by status")}</div>
        </div>
        <div class="card"><h3>Risk profile</h3>${barChart(riskRows, "Hazards by risk band")}</div>
      </section>`));
  }

  /* ============================ BOOTSTRAP ============================ */
  function init() {
    document.documentElement.setAttribute("data-theme", state.theme);
    document.getElementById("lang-select").value = state.lang;
    document.getElementById("theme-select").value = state.theme;
    buildNav();
    renderTopbar();
    route();

    window.addEventListener("hashchange", () => { window.__verdaMapActive = false; buildNav(); route(); });
    document.getElementById("lang-select").addEventListener("change", (e) => {
      state.lang = e.target.value; save(); buildNav(); route();
    });
    document.getElementById("theme-select").addEventListener("change", (e) => {
      applyTheme(e.target.value); buildNav(); route();
    });

    /* service worker omitted in the single-file build */
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
