<!doctype html>
<html lang="en" data-theme="forest">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verda — EHS Compliance Platform</title>
  <meta name="description" content="Verda by EEIS — environmental, health & safety compliance monitoring, reporting, audits and resources in one platform." />
  <meta name="theme-color" content="#1f7a4d" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <!-- Inline so the tab icon works from a file:// open and from the single-file
       build, where there is no second request to make. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231f7a4d'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EV%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231f7a4d'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EV%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">V</span> Verda <span class="muted small">by EEIS</span></div>
    <div class="topbar-right">
      <span id="topbar-credits"></span>
      <select id="country-select" title="Jurisdiction — which country's requirements apply">
        <option value="ug">🇺🇬 Uganda</option>
        <option value="ke">🇰🇪 Kenya</option>
        <option value="tz">🇹🇿 Tanzania</option>
        <option value="cd">🇨🇩 DR Congo</option>
        <option value="zm">🇿🇲 Zambia</option>
        <option value="rw">🇷🇼 Rwanda</option>
      </select>
      <select id="lang-select" title="Language">
        <option value="en">English</option>
        <option value="sw">Kiswahili</option>
        <option value="fr">Français</option>
        <option value="pt">Português</option>
        <option value="zh">中文</option>
      </select>
      <select id="theme-select" title="Colour theme">
        <option value="forest">Forest</option>
        <option value="ocean">Ocean</option>
        <option value="amber">Amber</option>
        <option value="slate">Slate</option>
      </select>
      <div id="topbar-auth"></div>
    </div>
  </header>

  <div class="layout">
    <nav id="sidebar"></nav>
    <main id="main"></main>
  </div>

  <footer class="app-footer">Verda — a compliance monitoring platform by EEIS. Your data is saved in this browser and goes nowhere else. AI drafting, payments and multi-user sign-in are simulated pending backend integration.</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <!-- Set window.VERDA_API to a server URL to use a backend; with it unset
       the app runs entirely in this browser, as it always has. -->
  <script src="./api.js"></script>
  <script src="./data.js"></script>
  <script src="./ai.js"></script>
  <script src="./map.js"></script>
  <script src="./app.js"></script>
</body>
</html>
